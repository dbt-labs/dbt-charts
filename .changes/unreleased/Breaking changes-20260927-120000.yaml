kind: Breaking changes
body: 'The `render_board` agent tool (`dct mcp` and `dbt_charts.ai`) now returns a compact text summary as a string instead of JSON with every executed row, and no longer takes `format`. The summary lists row counts, value ranges, category values, KPI values, and table previews; set the new `include_raw_data` boolean to also get each query''s rows. The local `dct mcp` server and Cloud MCP reject a supplied `format` or a non-boolean `include_raw_data`. `dct render` gains `--format text-data` (the summary plus rows, capped and marked like every other format''s rows), and the text summary drops empty layout headings, shows KPIs as formatted values only, lists every series of a multi-series chart, and previews table rows. `ProjectSession.render_board` and the other `--format` values are unchanged.'
time: 2026-09-27T12:00:00.000000-07:00
