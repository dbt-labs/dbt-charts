kind: Breaking changes
body: "Board markdown images (`text:` blocks, titles, tab text, callout messages and titles) now resolve against the project and embed as data URIs, where a relative image path was previously handed to the viewer to resolve against its own URL. A relative path resolves beside the file it is written in (an imported board's or chart's, an `extends:` fragment's, and a `meta.yml`'s included; an image inherited from a fragment or `meta.yml` must live under `charts/`); a path starting with `/` resolves from the project's `charts/` directory. A board that wrote a charts-rooted path without the `/` (`assets/logo.png` from `charts/cards/`) now renders that image as an error suggesting `/assets/logo.png`; no migration rewrites it, because whether the path meant the board's directory or `charts/` depends on which file exists. A template can no longer build a project image path: `![](img/{{ x }}.png)` renders as an error, because the files a board reads must be named in its YAML. A templated `http(s)://` URL, templated alt text, and `{% if %}` around whole images still work. An image that does not resolve renders as error text and reports ERR-IMAGE-REF-UNRESOLVED, so the board renders `partial` and `dct render` exits non-zero unless `--allow-chart-errors` is passed. A board artifact now records each board's `base_dir`, so an artifact written by an earlier release no longer loads. A title's `style.title.font.case` no longer changes inline code, and a title split by inline formatting is cased as one title."
time: 2026-09-28T15:00:00.000000-00:00
