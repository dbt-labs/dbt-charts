body: "`dct render --format text` shows values as an agent will actually see them: a KPI's formatted value (plus its raw cell and support line), a cartesian chart's value range formatted by its authored `style.number_format`, a table's resolved column labels and formats, and render-time warnings under a `## Warnings` heading."
