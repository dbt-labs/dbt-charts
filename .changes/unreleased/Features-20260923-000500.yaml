kind: Features
body: "Every categorical palette, shipped or inline, now offers four derived color variants addressed with a trailing token segment: category.blue.dark, category[2].light, vivid-10.3.pale, tableau.1.deep, or a whole list such as vivid-10.deep. The hand-tuned companion palettes (vivid-10-dark, editorial-10-ghost, and the rest) and the category_dark, category_light, category_ghost, and category_ink roles are retired; boards and themes that still use them are respelled in memory when loaded and, once schema 0.9.0 is released, by dct migrate on disk -- except a nested sub-board's own charts: block and a KPI background scale palette, which neither path reaches (such a board fails to compile with a message naming the new spelling), and, on disk only, a retired token inside a flow-style list, which dct migrate refuses to rewrite rather than corrupt."
