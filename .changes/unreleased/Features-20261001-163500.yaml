kind: Features
body: '`legend.position` is now a mapping of `edge` (`left`, `right`, `top`, `bottom`), `align` (`start`, `center`, `end`) and `overlay` (float over the plot or reserve a strip), so a legend can be centered along its edge and whether it covers data is explicit. A pie or donut takes `edge` and `align` only, never `overlay`.'
