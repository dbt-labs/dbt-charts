body: 'Custom chart templates can call a `d3` namespace of linear, sqrt, log, power, symlog, band, point and UTC time scales, ticks, curves, arcs, symbols, pie, stack and sankey layouts, map projections, geo paths, number and date formats and color mixing instead of hand-rolling the math.'
