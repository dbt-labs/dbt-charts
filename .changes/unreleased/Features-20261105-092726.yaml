kind: Features
body: Bar charts can tear outlier bars with style.torn_outlier, floating each torn bar's labeled cap above the plot so the smaller bars keep their scale, and a vertical bar past an `axis_y.scale.continuous.domain` maximum tears at the card's top edge with its value labeled and shows its true length on hover.
