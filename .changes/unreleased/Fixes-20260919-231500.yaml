kind: Fixes
body: An x-axis with an authored `style.time_format` (or `axis_x.labels.format`) could paint its tick labels on top of each other — "Jan 2022", "Apr 2022", "Jul 2022" overprinting at a quarterly cadence. The label cadence and tilt are picked by measuring how wide the labels will be, but that measurement read a fixed per-grain vocabulary ("Jan", "Q1", "2024") instead of the authored format Vega actually paints, so it sized the axis for ~19px labels and drew ~49px ones. The measurement now reads the authored format at every grain, so the cadence ladder coarsens (or tilts) when it needs to, and `WARN-AXIS-LABEL-COLLISION` fires when no layout fits. Relatedly, a temporal axis that still cannot fit its labels after every enabled strategy now hands thinning back to Vega instead of insisting every label be drawn, so an unfittable axis drops labels rather than overprinting them. A discrete (category) axis is unchanged, since a dropped category is unrecoverable.
