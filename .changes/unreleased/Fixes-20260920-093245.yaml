kind: Fixes
body: 'A chart spanning the full width of a board is no longer taller than the charts that split the row beneath it. The `style.charts.max_height` default drops from 400 to 376, the height the default aspect ratio produces at half width on a default-width board. Charts with their own aspect ratio (pie, donut, maps) lose the same 24px at every width.'
time: 2026-09-20T09:45:00.000000-07:00
