kind: Fixes
body: 'Redshift sources no longer fail every query at connection setup with `parameter ''statement_timeout'' requires an integer value`. Redshift''s `statement_timeout` takes an integer of milliseconds; it no longer inherits Postgres''s interval-string `SET statement_timeout = ''Ns''` syntax.'
