kind: Fixes
body: A `text:` block's Markdown parser dropped nested list items when the enclosing list was loose (a blank line between a top-level item and its nested sub-list), a shape common in lists exported from Word or Google Docs. `dct validate` gave no warning; the sub-items simply vanished from the rendered SVG. Fixed.
