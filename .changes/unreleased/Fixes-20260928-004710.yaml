kind: Fixes
body: 'A board with `chart_focus` set no longer prints a WARN-UNREFERENCED-CHART for every other chart on the board. The warning now judges "referenced" against the board''s layout as authored, before focus narrows it to one chart, matching how `--chart` already behaved.'
