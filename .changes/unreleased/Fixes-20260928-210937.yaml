kind: Fixes
body: 'A board author setting a chart, table column, or footer `link:` to a `javascript:`, `data:`, or editor-deeplink scheme now fails `dct validate` instead of silently rendering as a live, clickable link. A table cell or row link built from query row data is checked the same way when the board renders, since its scheme is not known until the query runs. A color that is not a hex value, a CSS named color, `rgb()`/`hsl()`, or `transparent`/`none` (for example `currentColor` or `var(--x)`) at a board title, the variables strip''s border, or a table link now fails the render instead of being applied unvalidated. A `variables:` name that is not a valid identifier (a space, hyphen, or leading digit) now fails at compile with a clear message instead of a confusing render-time error.'
time: 2026-09-28T21:09:37Z
