kind: Fixes
body: 'A `type: custom` chart with no `query:` draws with empty `rows`, like a blank chart of any other type, instead of failing its column params against placeholder data. `text_width()` in a custom template accepts CSS keyword weights such as `bold` and `normal`, so any font weight a theme sets works.'
