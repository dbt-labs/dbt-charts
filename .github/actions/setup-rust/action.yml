name: Set up Rust
description: Rust toolchain and a source-keyed cargo target cache

inputs:
  target:
    description: The cargo target directory to cache
    required: false
    default: libs/chart-svg/python/target
  profile:
    description: >-
      Names what the job builds in `target` (ext, release, dev). One cache per
      profile, so a job restores only the artifacts it uses. `ext` is the
      dbt_charts._engine build, which is also keyed on the Python version.
    required: false
    default: ext
  key-suffix:
    description: Build settings that change the artifacts (e.g. debuginfo off), so they key the cache
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      run: rustup toolchain install 1.98.0 --profile minimal --no-self-update && rustup default 1.98.0
      shell: bash

    # Incremental state only bloats the cached target/: CI builds each source once.
    - name: Disable incremental compilation
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      shell: bash

    # The crate is abi3-py310, so only the interpreter's major.minor shapes the
    # build; cargo's own fingerprints rebuild whatever a patch bump touches.
    # `uv run` resolves it the way the build does (UV_PYTHON, else
    # .python-version). Assigned on its own line so a failure aborts instead
    # of keying on "".
    - name: Resolve the build interpreter
      id: python
      if: inputs.profile == 'ext'
      run: |
        version="$(uv run --no-project python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
      shell: bash

    # The save runs as a post step, which sees an empty `inputs` context when
    # this action is nested (setup-python); env survives, so paths read it.
    - name: Pin the cached target dir
      run: echo "SETUP_RUST_TARGET=${{ inputs.target }}" >> "$GITHUB_ENV"
      shell: bash

    # Only main saves (a PR's or merge group's entries are unreadable elsewhere
    # and evict main's); both restore main's exact entry, else the newest of the
    # prefix so only changed crates rebuild. Keyed on every build input, so an
    # exact hit is a build of these sources. The registry's unpacked src/ and
    # incremental state are regenerable and stay out.
    - name: Restore cargo registry and target
      id: cargo-restore
      if: github.event_name == 'merge_group' || github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          !~/.cargo/registry/src
          ~/.cargo/git
          ${{ env.SETUP_RUST_TARGET }}
          !${{ env.SETUP_RUST_TARGET }}/**/incremental
        key: cargo-${{ runner.os }}-${{ inputs.profile }}-py${{ steps.python.outputs.version }}-${{ inputs.key-suffix }}-${{ hashFiles('.github/actions/setup-rust/action.yml', 'libs/chart-svg/**', 'dbt-charts/src/dbt_charts/core/defaults/palettes/tone/*.yml') }}
        restore-keys: cargo-${{ runner.os }}-${{ inputs.profile }}-py${{ steps.python.outputs.version }}-${{ inputs.key-suffix }}-

    - name: Cache cargo registry and target
      id: cargo-cache
      if: github.event_name != 'merge_group' && github.event_name != 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          !~/.cargo/registry/src
          ~/.cargo/git
          ${{ env.SETUP_RUST_TARGET }}
          !${{ env.SETUP_RUST_TARGET }}/**/incremental
        key: cargo-${{ runner.os }}-${{ inputs.profile }}-py${{ steps.python.outputs.version }}-${{ inputs.key-suffix }}-${{ hashFiles('.github/actions/setup-rust/action.yml', 'libs/chart-svg/**', 'dbt-charts/src/dbt_charts/core/defaults/palettes/tone/*.yml') }}
        restore-keys: cargo-${{ runner.os }}-${{ inputs.profile }}-py${{ steps.python.outputs.version }}-${{ inputs.key-suffix }}-

    # Cargo decides freshness of local crates by mtime, and checkout stamps
    # every file new, so without this an exact hit still recompiles and
    # re-links the whole extension. Safe only on an exact hit: sources are
    # byte-identical to the cached build.
    - name: Backdate extension sources to reuse the cached build
      if: steps.cargo-cache.outputs.cache-hit == 'true' || steps.cargo-restore.outputs.cache-hit == 'true'
      run: git ls-files -z libs/chart-svg dbt-charts/src/dbt_charts/core/defaults/palettes/tone | xargs -0 touch -t 197001010000
      shell: bash
