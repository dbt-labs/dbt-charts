name: Release to PyPI

# Tag naming: dbt-charts-vX.Y.Z. dbt-charts-playground publishes from the
# monorepo (.github/workflows/release-dbt-charts-playground.yml there) — this
# repo builds and publishes a single root-level package.
#
# Guard sequence (non-semver tag, tag not on main, frozen-schema verify,
# artifact audit) matches what the monorepo's own dbt-charts PyPI publish
# workflow checked before it was deleted (#7611) when dbt-charts stopped
# publishing from there — do not recreate a PyPI publish workflow for
# dbt-charts in the monorepo; this file is now the only one.
# `.github/scripts/check_published_artifact.py` is a trimmed, standalone copy
# of the monorepo's own audit (which also runs there, against the same wheel
# pre-export, on every PR touching dbt-charts/ — test-dataface.yml ::
# smoke-install) — re-run here, independently, against this workflow's own
# build output before it's uploaded or published.
#
# Ownership: this workflow is the sole PyPI publish trigger for dbt-charts.
# The monorepo it's exported from does not publish dbt-charts to PyPI at
# all — cutting a tag there only gets a commit exported and tagged here;
# this repo's own `release: published` event is what actually ships it.
#
# Each export push to main publishes its `X.Y.Z.devN` artifacts (version from
# the nearest dbt-charts-v* tag, stamped by _build_backend.py) via `pypi-dev`.
# A commit already carrying its release tag builds the stable version, which
# only the GitHub Release publishes.
#
# The package ships the Rust extension `dbt_charts._engine` as cp311-abi3
# wheels: one per platform below, plus an sdist. maturin-action builds them
# (manylinux_2_28 in its container on Linux); _build_backend.py then stamps
# each with the tag version and the vendored peer packages, exactly as
# `uv build --wheel` would. Every wheel is audited and import-tested before
# anything is uploaded.
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-${{ github.event.release.tag_name || github.ref }}"
  cancel-in-progress: false

env:
  # rustc embeds absolute source paths in the extension (panic locations).
  # Remap the workspace and cargo home on every runner/container layout so
  # wheels carry no build-machine paths; the artifact audit fails if any remain.
  RUSTFLAGS: >-
    --remap-path-prefix=${{ github.workspace }}=/src
    --remap-path-prefix=/io=/src
    --remap-path-prefix=/github/workspace=/src
    --remap-path-prefix=/root/.cargo=/cargo
    --remap-path-prefix=/home/runner/.cargo=/cargo
    --remap-path-prefix=/Users/runner/.cargo=/cargo
    --remap-path-prefix=C:\Users\runneradmin\.cargo=/cargo

jobs:
  sdist:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'dbt-charts-v')
    runs-on: ubuntu-latest
    outputs:
      is_dev: ${{ steps.version.outputs.is_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the version comes from tags and the "tag is on main" check needs them

      - name: Refuse non-semver release tags
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^dbt-charts-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match dbt-charts-vX.Y.Z"
            exit 1
          fi

      - name: Refuse release tags not on main
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git branch -r --contains "${{ github.sha }}" | grep -qE '^[[:space:]]+origin/main$'; then
            echo "::error::Tag '$TAG' (commit ${{ github.sha }}) is not on origin/main."
            exit 1
          fi

      - name: Verify the changelog documents this release
        # Same script, tag, repo, and changelog `close-linked-issues` uses for real after publish.
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 .github/scripts/close_linked_issues.py \
            --changes-dir .changes \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --dry-run

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.18"

      - uses: ./.github/actions/setup-rust

      - name: Verify frozen dbt charts YAML schema
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: uv run python -m dbt_charts.schema_release "${TAG#dbt-charts-v}" --verify

      - run: uv build --sdist

      - name: Detect dev version
        id: version
        run: |
          version=$(basename dist/*.tar.gz .tar.gz | cut -d- -f2)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          elif git tag --points-at HEAD | grep -qx "dbt-charts-v$version"; then
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Stable version $version but HEAD has no dbt-charts-v$version tag."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-sdist
          path: dist/

  wheels:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'dbt-charts-v')
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin}
          - {name: macos-arm64, os: macos-15, target: aarch64-apple-darwin}
          - {name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28"}
          - {name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28"}
          - {name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the wheel version comes from tags

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.18"

      - uses: PyO3/maturin-action@fdd104694b233054d6e985e29b3af9f126af7ac6  # v1.9.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist

      - name: Stamp the tag version and vendored packages
        run: uv run --no-project --with "maturin>=1.15,<2" --with "setuptools-scm>=8" python _build_backend.py dist/*.whl

      - name: Audit built artifact
        # --python pins the floor: _STDLIB reflects the executor's interpreter, so a
        # newer one would miss a 3.12+-only stdlib import in the wheel.
        run: uv run --no-project --python 3.11 python .github/scripts/check_published_artifact.py --wheel dist/*.whl

      - name: Import the extension from the built wheel
        run: uv run --no-project --isolated --python 3.11 --with "$(ls dist/*.whl)" python -c "import dbt_charts._engine"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: dist/

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.18"

      - run: uv publish --trusted-publishing always dist/*

  publish-dev:
    needs: [sdist, wheels]
    if: github.event_name == 'push' && needs.sdist.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    environment: pypi-dev
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.18"

      - run: uv publish --trusted-publishing always dist/*

  close-linked-issues:
    # needs: [publish] alone skips this on workflow_dispatch -- publish
    # itself only runs `if: github.event_name == 'release'`, and a skipped
    # need skips its dependent under the default `success()`.
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Close issues this release's changelog says it fixes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 .github/scripts/close_linked_issues.py \
            --changes-dir .changes \
            --tag "$TAG" \
            --repo "${{ github.repository }}"
