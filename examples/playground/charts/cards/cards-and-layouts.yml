# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
title: Cards and layouts
source: examples_db
style:
  frame:
    width: 1440
text: |
  A board is built from a handful of card types — KPIs, markdown, tables, and
  charts — arranged with a handful of layout devices. This board shows one of
  each, using our own product metrics as the data.
queries:
  kpi_metrics:
    sql: |
      WITH complete_months AS (
        SELECT *
        FROM dundersign_serving.monthly_metrics
        WHERE month > (SELECT min(month) FROM dundersign_serving.monthly_metrics)
          AND month < (SELECT max(month) FROM dundersign_serving.monthly_metrics)
      ),
      ranked AS (
        SELECT
          month, revenue, active_users, documents_completed, tickets_resolved,
          LAG(revenue) OVER (ORDER BY month) AS prev_revenue,
          LAG(active_users) OVER (ORDER BY month) AS prev_active_users,
          LAG(documents_completed) OVER (ORDER BY month) AS prev_documents_completed,
          LAG(tickets_resolved) OVER (ORDER BY month) AS prev_tickets_resolved
        FROM complete_months
      )
      SELECT
        month, revenue, active_users, documents_completed, tickets_resolved,
        (revenue - prev_revenue) / prev_revenue AS revenue_delta,
        (active_users - prev_active_users)::DOUBLE / prev_active_users AS active_users_delta,
        (documents_completed - prev_documents_completed)::DOUBLE / prev_documents_completed AS documents_completed_delta,
        (tickets_resolved - prev_tickets_resolved)::DOUBLE / prev_tickets_resolved AS tickets_resolved_delta
      FROM ranked
      WHERE prev_revenue IS NOT NULL
      ORDER BY month DESC
      LIMIT 1
  product_performance:
    sql: |
      WITH per_order AS (
        SELECT
          product,
          date_trunc('week', date)::DATE AS week,
          SUM(revenue) OVER (PARTITION BY product, date_trunc('week', date)::DATE) AS week_revenue,
          SUM(revenue) OVER (PARTITION BY product) AS total_revenue
        FROM main.ecommerce_orders
      ),
      distinct_weeks AS (
        SELECT DISTINCT product, week, week_revenue, total_revenue FROM per_order
      )
      SELECT
        product,
        any_value(total_revenue) AS total_revenue,
        ARRAY_AGG(week_revenue ORDER BY week) AS weekly_trend,
        (arg_max(week_revenue, week) - arg_min(week_revenue, week)) / arg_min(week_revenue, week) AS growth_pct
      FROM distinct_weeks
      GROUP BY product
      ORDER BY total_revenue DESC
  category_region_pivot:
    sql: |
      SELECT category, region, SUM(revenue) AS revenue, SUM(units_sold) AS units_sold
      FROM main.ecommerce_orders
      GROUP BY 1, 2
      ORDER BY 1, 2
  weekly_revenue:
    sql: |
      SELECT
        date_trunc('week', date)::DATE AS week,
        SUM(revenue) AS revenue,
        SUM(units_sold) AS units,
        COUNT(*) AS orders
      FROM main.ecommerce_orders
      GROUP BY 1
      ORDER BY 1
  category_revenue:
    sql: |
      SELECT category, SUM(revenue) AS revenue
      FROM main.ecommerce_orders
      GROUP BY 1
      ORDER BY 2 DESC
  region_revenue:
    sql: |
      SELECT region, SUM(revenue) AS revenue
      FROM main.ecommerce_orders
      GROUP BY 1
      ORDER BY 2 DESC
  monthly_revenue:
    sql: |
      SELECT month, revenue
      FROM dundersign_serving.monthly_metrics
      WHERE month > (SELECT min(month) FROM dundersign_serving.monthly_metrics)
        AND month < (SELECT max(month) FROM dundersign_serving.monthly_metrics)
      ORDER BY month
  monthly_tickets_resolved:
    sql: |
      SELECT month, tickets_resolved
      FROM dundersign_serving.monthly_metrics
      WHERE month > (SELECT min(month) FROM dundersign_serving.monthly_metrics)
        AND month < (SELECT max(month) FROM dundersign_serving.monthly_metrics)
      ORDER BY month
  monthly_active_users:
    sql: |
      SELECT month, active_users
      FROM dundersign_serving.monthly_metrics
      WHERE month > (SELECT min(month) FROM dundersign_serving.monthly_metrics)
        AND month < (SELECT max(month) FROM dundersign_serving.monthly_metrics)
      ORDER BY month
  monthly_tickets_created_resolved:
    sql: |
      WITH complete_months AS (
        SELECT *
        FROM dundersign_serving.monthly_metrics
        WHERE month > (SELECT min(month) FROM dundersign_serving.monthly_metrics)
          AND month < (SELECT max(month) FROM dundersign_serving.monthly_metrics)
      )
      SELECT month, 'Created' AS series, tickets_created AS value FROM complete_months
      UNION ALL
      SELECT month, 'Resolved' AS series, tickets_resolved AS value FROM complete_months
      ORDER BY 1, 2
  documents_by_status:
    sql: |
      SELECT status, count(*) / SUM(count(*)) OVER () AS share
      FROM dundersign.documents
      GROUP BY 1
      ORDER BY 1
  recent_orders:
    sql: |
      SELECT date, region, product, category, revenue, units_sold
      FROM main.ecommerce_orders
      ORDER BY date DESC, revenue DESC
      LIMIT 10
charts:
  kpi_revenue:
    type: kpi
    query: kpi_metrics
    label: Revenue, this month
    value: revenue
    style:
      value:
        format: currency
      support:
        format: percent_delta
        tone: positive
    support:
      value: revenue_delta
      label: vs last month
      glyph: ▲
  kpi_active_users:
    type: kpi
    query: kpi_metrics
    label: Active users, this month
    value: active_users
    style:
      value:
        format: integer
      support:
        format: percent_delta
        tone: negative
    support:
      value: active_users_delta
      label: vs last month
      glyph: ▼
  kpi_documents_completed:
    type: kpi
    query: kpi_metrics
    label: Documents completed
    value: documents_completed
    style:
      value:
        format: integer
      support:
        format: percent_delta
        tone: negative
    support:
      value: documents_completed_delta
      label: vs last month
      glyph: ▼
  kpi_tickets_resolved:
    type: kpi
    query: kpi_metrics
    label: Tickets resolved
    value: tickets_resolved
    style:
      value:
        format: integer
      support:
        format: percent_delta
        tone: positive
    support:
      value: tickets_resolved_delta
      label: vs last month
      glyph: ▲
  callout_card:
    type: callout
    style:
      tone: positive
    title: "Support load is healthy"
    message: |
      Tickets resolved rose to **7** this month, up from 6, while new tickets
      stayed about the same. No backlog action needed.
  product_performance_table:
    type: table
    query: product_performance
    title: Product performance, first half of 2024
    style:
      columns:
        total_revenue:
          format: currency
        weekly_trend:
          label: Weekly trend, Jan-Jun
          spark:
            type: line
        growth_pct:
          label: First week → last week
          format: percent_delta
    conditional_formatting:
      growth_pct:
        when:
          - gte: 0
            glyph: "▲"
            tone: positive
          - lt: 0
            glyph: "▼"
            tone: negative
  category_region_pivot:
    type: table
    query: category_region_pivot
    title: Revenue and units, by category and region
    rows:
      - category
    columns:
      - region
    style:
      columns:
        revenue:
          format: currency_whole
        units_sold:
          label: Units
  weekly_revenue_support:
    query: weekly_revenue
    type: bar
    title: Weekly revenue, with the underlying counts
    height: 320
    x: week
    y: revenue
    style:
      axis_y:
        labels:
          format: currency
    support_table:
      - source: revenue
        format: currency_whole
        label: Revenue
      - source: units
        format: ",d"
        label: Units
      - source: orders
        format: ",d"
        label: Orders
  width_demo_bar:
    query: category_revenue
    type: bar
    title: Revenue by category
    height: 260
    x: category
    y: revenue
    style:
      axis_y:
        labels:
          format: currency
  width_demo_kpi:
    type: kpi
    query: kpi_metrics
    label: Revenue, this month
    value: revenue
    style:
      value:
        format: currency
  grid_tall_chart:
    query: region_revenue
    type: table
    title: Revenue by region
    style:
      columns:
        revenue:
          format: currency_whole
  grid_chart_top:
    query: monthly_revenue
    type: line
    title: Revenue trend
    height: 220
    x: month
    y: revenue
    style:
      axis_y:
        labels:
          format: currency
  grid_side_chart:
    query: category_revenue
    type: table
    title: Revenue by category
    style:
      columns:
        revenue:
          format: currency_whole
  grid_chart_bottom:
    query: monthly_tickets_resolved
    type: bar
    title: Tickets resolved
    height: 220
    x: month
    y: tickets_resolved
    style:
      axis_y:
        labels:
          format: integer
  tabs_revenue_bar:
    query: category_revenue
    type: bar
    title: Revenue by category
    height: 280
    x: category
    y: revenue
    style:
      axis_y:
        labels:
          format: currency
  tabs_active_users_line:
    query: monthly_active_users
    type: line
    title: Active users, by month
    height: 280
    x: month
    y: active_users
    style:
      axis_y:
        labels:
          format: integer
  tabs_tickets_line:
    query: monthly_tickets_created_resolved
    type: line
    title: Tickets created vs. resolved
    height: 280
    x: month
    y: value
    color: series
    style:
      axis_y:
        labels:
          format: integer
  documents_status_bar:
    type: bar
    query: documents_by_status
    title: Documents, by status
    subtitle: Share of all documents
    height: 300
    x: status
    y: share
    style:
      axis_y:
        labels:
          format: percent_whole
  recent_orders_table:
    type: table
    query: recent_orders
    title: Most recent orders
    style:
      columns:
        revenue:
          format: currency_whole
        units_sold:
          label: Units
          format: integer
rows:
  - text: |
      **Every card type, one page.** KPIs, markdown, callouts, tables, a
      pivot, and an attached support table — plus the layout devices that
      arrange them: `rows:`, `cols:`, `grid:`, `tabs:`, and `details:`.
  - text: "Card types, side by side — markdown (with an inline local image), a callout with a KPI block, and a table"
  - cols:
      - text: |
          ### Highlights this month

          - Revenue held steady at **$2,931**, up slightly from June
          - Active users dipped to 818, down from June's 858

          > Document completions slipped in July as fewer signers finished
          > mid-cycle.

          ![dbt logo](data:image/svg+xml;base64,){width=140}

          *dbt Charts boards compile straight from a dbt project — no
          separate semantic layer to keep in sync.*
      - rows:
          - callout_card
          - cols:
              - kpi_revenue
              - kpi_active_users
          - cols:
              - kpi_documents_completed
              - kpi_tickets_resolved
      - product_performance_table
  - text: "Pivot table (`rows:`/`columns:`/`values:`) and a chart with an attached `support_table:`, side by side"
  - cols:
      - category_region_pivot
      - weekly_revenue_support
  - text: "Layout — `cols:` with explicit width percentages (25% / 50% / 25%)"
  - cols:
      - width: "25%"
        text: |
          This column is pinned to **25%** width. The middle column takes
          **50%**, and the KPI on the right takes the remaining **25%**.
      - width: "50%"
        rows:
          - width_demo_bar
      - width: "25%"
        rows:
          - width_demo_kpi
  - text: "Layout — `grid:` with `col_span` and `row_span`"
  - grid:
      items:
        - item: grid_tall_chart
          col_span: 8
          row_span: 2
        - item: grid_chart_top
          col_span: 8
          row_span: 1
        - item: grid_side_chart
          col_span: 8
          row_span: 2
        - item: grid_chart_bottom
          col_span: 8
          row_span: 1
  - text: "Layout — `tabs:` groups related views behind clickable tabs"
  - tabs:
      items:
        - title: Revenue
          rows:
            - tabs_revenue_bar
        - title: Customers
          rows:
            - tabs_active_users_line
        - title: Support
          rows:
            - tabs_tickets_line
  - text: "Layout — `cols:` nested inside `rows:`"
  - cols:
      - text: |
          Nesting `cols:` inside a `rows:` item builds a two-panel section:
          this text on the left, a chart on the right.
      - documents_status_bar
  - text: "Layout — `details:` collapses a section behind a summary bar"
  - details:
      summary: Show the underlying order rows
      expanded_title: Hide the underlying order rows
    rows:
      - recent_orders_table
