      ## Special Characters & Emoji

  - title: "Special Characters Demo"
    style:
      border:
        width: 2
        color: "#999"
        radius: 8
      padding: "16px"
      background: "#fafafa"
    text: |
      ### Emoji Support

      🚀 Rocket for launches
      📊 Chart for data
      ✅ Checkmark for success
      ❌ X for errors
      💡 Lightbulb for tips
      ⚠️ Warning sign
      🎯 Target for goals
      🔥 Fire for trending
      📈 Trending up
      📉 Trending down

      ### Mathematical Symbols

      - Greater than: 5 > 3
      - Less than: 2 < 4
      - Arrows: → ← ↑ ↓ ↔
      - Math: ± × ÷ = ≠ ≈ ≤ ≥
      - Currency: $ € £ ¥

      ### Special Punctuation

      - En dash: 2020–2024
      - Em dash: dbt Charts—the best tool—is here
      - Ellipsis: Loading...
      - Quotes: "Smart quotes" and 'single quotes'

