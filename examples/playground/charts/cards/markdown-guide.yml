      ## Combining Elements

  - title: "Combined Elements Demo"
    style:
      border:
        width: 2
        color: "#999"
        radius: 8
      padding: "16px"
      background: "#fafafa"
    text: |
      ### 📊 Board Best Practices

      Follow these guidelines for effective boards:

      1. **Start with KPIs** — Put the most important metrics at the top
         - Use large, clear numbers
         - Add context with trends

      2. **Group related charts** — Use layouts effectively
         > Tip: Use `cols` for side-by-side comparisons

      3. **Add interactivity** — Variables make boards powerful
         - [ ] Date range filters
         - [ ] Category selectors
         - [x] Dynamic titles

      ---

      | Priority | Task              | Status    |
      |----------|-------------------|-----------|
      | 🔴 High  | Fix data pipeline | ✅ Done   |
      | 🟡 Med   | Add new charts    | 🔄 Active |
      | 🟢 Low   | Update docs       | 📋 Todo   |

      ---

      ```yaml
      # Example: Combining all elements
      text: |
        # Title with **bold** and *italic*

        - List item with `code`
        - Another with [link](url)
      ```

  - text: |
      ---

      ## Tips & Best Practices
    style:
      background: "#e8f5e9"
      padding: "16px"
      border:
        radius: 8

  - text: |
      💡 **Use `|` for multiline content** — The pipe character preserves formatting

      💡 **Indent consistently** — YAML requires consistent indentation

      💡 **Escape special characters** — Use backslash for literal `*`, `_`, etc.

      💡 **Combine with styling** — Add `style` blocks for colors and backgrounds

      💡 **Images need paths** — Use relative paths from the board file

      ---

      That's everything you can do with markdown in dbt Charts! 🎉
