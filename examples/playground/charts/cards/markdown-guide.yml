      ## Code Blocks

  - title: "Code Blocks Demo"
    style:
      border:
        width: 2
        color: "#999"
        radius: 8
      padding: "16px"
      background: "#fafafa"
    text: |
      ### YAML Example

      ```yaml
      title: My Board
      queries:
        sales:
          source: examples_db
          sql: SELECT * FROM ecommerce_orders
      charts:
        revenue:
          query: sales
          type: bar
          x: product
          y: revenue
      ```

      ### Python Example

      ```python
      import dbt_charts

      # Compile and render a board
      result = dbt_charts.compile("board.yml")
      html = dbt_charts.render(result.board)
      ```

      ### SQL Example

      ```sql
      SELECT
        product,
        SUM(revenue) as total_revenue,
        COUNT(*) as order_count
      FROM orders
      GROUP BY product
      ORDER BY total_revenue DESC
      ```

      ### Shell Commands

      ```bash
      # Install dbt Charts
      pip install "dbt-charts"

      # Render a board
      dct render board.yml -o output.html
      ```

  - text: |
