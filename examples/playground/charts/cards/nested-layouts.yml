# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
title: "Nested Layouts Demo"

text: |
  dbt charts supports **four layout types** that can be nested to create complex boards:

  | Layout | Purpose | Key Property |
  |--------|---------|--------------|
  | `rows` | Stack vertically | Default layout |
  | `cols` | Arrange side-by-side | `width: "50%"` |
  | `grid` | Flexible grid system | `columns: 24` |
  | `tabs` | Tabbed navigation | `items: [...]` |

rows:
  # Section 1: Rows and Cols
  - title: "Rows & Cols"
    style:
      background: "rgba(102, 126, 234, 0.1)"
      border:
        radius: 12
    cols:
      - text: |
          **Cols** arrange items side-by-side.

          This section has three columns:
          - This intro (auto width)
          - Middle column (25%)
          - Right column (50%)

          Leave room for auto items by keeping specified widths under 100%.
          This example uses `width: "25%"` and `width: "50%"`.

      - width: "25%"
        style:
          background: "rgba(118, 75, 162, 0.12)"
          border:
            radius: 8
        rows:
          - title: "Rows in a Column"
            style:
              background: "rgba(156, 39, 176, 0.1)"
              border:
                radius: 6
            text: |
              **Rows** stack items vertically.

              This column contains nested rows.

          - title: "Second Row"
            style:
              background: "rgba(123, 31, 162, 0.1)"
              border:
                radius: 6
            text: |
              Rows can contain:
              - Content (markdown)
              - Charts
              - More nested layouts

          - title: "Deep Nesting"
            style:
              background: "rgba(103, 58, 183, 0.1)"
              border:
                radius: 6
            cols:
              - text: |
                  **Cols** inside rows!
                style:
                  background: "rgba(139, 195, 74, 0.15)"
                  border:
                    radius: 4
              - text: |
                  Nest infinitely deep.
                style:
                  background: "rgba(0, 188, 212, 0.12)"
                  border:
                    radius: 4

      - width: "50%"
        style:
          background: "rgba(79, 172, 254, 0.1)"
          border:
            radius: 8
        text: |
          This is the **50% width** column.

          Layouts can nest many levels deep:

          **Rows** → **Cols** → **Rows** → **Cols** → ...

          Each level can have its own styling. The middle column shows rows with cols nested inside.

  # Section 2: Grid Layout
  - title: "Grid Layout"
    style:
      background: "rgba(255, 152, 0, 0.1)"
      border:
        radius: 12
    text: |
      Use `grid.columns` to define a column system. Items span columns with `col_span`.

    grid:
      columns: 24
      items:
        - item:
            text: |
              `col_span: 6`
            title: "Span 6"
            style:
              background: "rgba(33, 150, 243, 0.12)"
              border:
                radius: 5
          col_span: 6

        - item:
            text: |
              6 + 6 = 12
            title: "Span 6"
            style:
              background: "rgba(103, 58, 183, 0.12)"
              border:
                radius: 5
          col_span: 6

        - item:
            text: |
              `col_span: 12` — 12 + 12 = 24 columns total
            title: "Span 12"
            style:
              background: "rgba(76, 175, 80, 0.12)"
              border:
                radius: 5
          col_span: 12

        - item:
            text: |
              Next row starts here.
            title: "Span 8"
            style:
              background: "rgba(233, 30, 99, 0.12)"
              border:
                radius: 5
          col_span: 8

        - item:
            text: |
              8 + 16 = 24. Items auto-flow to fill rows.
            title: "Span 16"
            style:
              background: "rgba(156, 39, 176, 0.12)"
              border:
                radius: 5
          col_span: 16

  # Section 3: Tabs Layout
  - title: "Tabs Layout"
    style:
      background: "rgba(96, 125, 139, 0.1)"
      border:
        radius: 12
    text: |
      Tabs show one item at a time. Click to switch between tabs.

    tabs:
      items:
        - title: "Overview"
          text: |
            **Tabs** are great for organizing related content.

            Each tab can contain:
            - Text and markdown
            - Charts and visualizations
            - Nested layouts (rows, cols, grids)
          style:
            background: "rgba(76, 175, 80, 0.12)"
            border:
              radius: 4

        - title: "With Cols"
          style:
            background: "rgba(3, 169, 244, 0.12)"
            border:
              radius: 4
          cols:
            - title: "Left"
              text: |
                Tabs can contain **cols** layouts.
              style:
                background: "rgba(255, 193, 7, 0.15)"
                border:
                  radius: 4
            - title: "Right"
              text: |
                Side-by-side content in a tab.
              style:
                background: "rgba(233, 30, 99, 0.12)"
                border:
                  radius: 4

        - title: "With Grid"
          style:
            background: "rgba(156, 39, 176, 0.12)"
            border:
              radius: 4
          grid:
            columns: 6
            items:
              - item:
                  text: |
                    Grid inside a tab!
                  style:
                    background: "rgba(240, 147, 251, 0.15)"
                    border:
                      radius: 4
                col_span: 3
              - item:
                  text: |
                    Flexible layouts anywhere.
                  style:
                    background: "rgba(236, 64, 122, 0.12)"
                    border:
                      radius: 4
                col_span: 3
