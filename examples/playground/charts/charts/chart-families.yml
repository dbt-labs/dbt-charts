# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
title: Chart families
style:
  frame:
    width: 1872
queries:
  product_revenue:
    source: examples_db
    sql: |
      SELECT product, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY product
      ORDER BY revenue DESC
  region_category_revenue:
    source: examples_db
    sql: |
      SELECT region, category, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY region, category
      ORDER BY region, category
  region_category_category_share:
    source: examples_db
    sql: |
      SELECT
        region,
        category,
        SUM(revenue) / SUM(SUM(revenue)) OVER (PARTITION BY region)
          AS category_share
      FROM ecommerce_orders
      GROUP BY region, category
      ORDER BY region, category
  company_growth:
    source: examples_db
    sql: |
      SELECT company, growth_rate
      FROM company_revenue
      ORDER BY growth_rate DESC
  monthly_active_users:
    source: db
    sql: |
      SELECT month, active_users
      FROM dundersign_serving.monthly_metrics
      WHERE month > (SELECT MIN(month) FROM dundersign_serving.monthly_metrics)
        AND month < (SELECT MAX(month) FROM dundersign_serving.monthly_metrics)
      ORDER BY month
  weekly_revenue_by_category:
    source: examples_db
    sql: |
      SELECT DATE_TRUNC('week', date) AS week, category, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY week, category
      ORDER BY week, category
  order_scatter:
    source: examples_db
    sql: |
      SELECT category, units_sold, revenue
      FROM ecommerce_orders
      WHERE date >= DATE '2024-06-24'
  company_growth_margin:
    source: examples_db
    sql: |
      SELECT company, region, growth_rate, margin, headcount
      FROM company_revenue
  category_revenue:
    source: examples_db
    sql: |
      SELECT category, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY category
      ORDER BY revenue DESC
  document_status:
    source: dundersign_db
    sql: |
      SELECT status, COUNT(*) AS document_count
      FROM documents
      GROUP BY status
      ORDER BY document_count DESC
  region_product_revenue:
    source: examples_db
    sql: |
      SELECT region, product, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY region, product
      ORDER BY region, product
  monthly_revenue:
    source: db
    sql: |
      SELECT month, strftime(month, '%b %Y') AS month_label, revenue
      FROM dundersign_serving.monthly_metrics
      WHERE month > (SELECT MIN(month) FROM dundersign_serving.monthly_metrics)
        AND month < (SELECT MAX(month) FROM dundersign_serving.monthly_metrics)
      ORDER BY month
  sales_summary:
    source: examples_db
    sql: |
      SELECT SUM(revenue) AS revenue, SUM(units_sold) AS units_sold
      FROM ecommerce_orders
  recent_orders:
    source: examples_db
    sql: |
      SELECT date, product, category, region, revenue, units_sold
      FROM ecommerce_orders
      ORDER BY date DESC, revenue DESC
      LIMIT 8
  new_england_density:
    columns: [state_code, population_density]
    values:
      - ["9", 742]
      - ["23", 44]
      - ["25", 901]
      - ["33", 154]
      - ["44", 1022]
      - ["50", 68]
  new_england_stores:
    columns: [city, lat, lng, revenue]
    values:
      - ["Boston", 42.3601, -71.0589, 980000]
      - ["Providence", 41.8240, -71.4128, 520000]
      - ["Portland", 43.6591, -70.2568, 410000]
      - ["Hartford", 41.7658, -72.6734, 460000]
      - ["Burlington", 44.4759, -73.2121, 290000]
      - ["Manchester", 42.9956, -71.4548, 380000]
charts:
  vertical_bar:
    query: monthly_revenue
    type: bar
    title: Monthly revenue
    subtitle: "type: bar draws vertical columns for a date-based x axis"
    x: month
    y: revenue
    style:
      orientation: vertical
      axis_y:
        labels:
          format: currency_whole
  horizontal_bar:
    query: product_revenue
    type: bar
    title: Top products by revenue
    subtitle: "style.orientation: horizontal ranks long category labels"
    x: product
    y: revenue
    sort:
      by: revenue
      order: desc
    style:
      orientation: horizontal
      axis_y:
        labels:
          format: currency_whole
  grouped_bar:
    query: region_category_revenue
    type: bar
    title: Revenue by region and category
    subtitle: "a color field with no style.stack groups bars side by side"
    x: region
    y: revenue
    color: category
    style:
      axis_y:
        labels:
          format: currency_whole
  stacked_bar:
    query: region_category_revenue
    type: bar
    title: Revenue by region, stacked by category
    subtitle: "style.stack: zero stacks bars from one shared baseline"
    x: region
    y: revenue
    color: category
    style:
      stack: zero
      axis_y:
        labels:
          format: currency_whole
  stacked_bar_normalized:
    query: region_category_category_share
    type: bar
    title: Category mix of revenue by region
    subtitle: "style.stack: normalize shows each category's share of the total"
    x: region
    y: category_share
    color: category
    style:
      stack: normalize
      axis_y:
        labels:
          format: percent_whole
  mirror_bar:
    query: company_growth
    type: bar
    title: Quarterly revenue growth by company
    subtitle: "bars run either side of zero once a value turns negative"
    x: company
    y: growth_rate
    sort:
      by: growth_rate
      order: desc
    style:
      orientation: horizontal
      axis_y:
        labels:
          format: percent_delta
  line_single:
    query: monthly_active_users
    type: line
    title: Active users over time
    subtitle: "type: line traces one series across a date-based x axis"
    x: month
    y: active_users
  line_multi:
    query: weekly_revenue_by_category
    type: line
    title: Weekly revenue by category
    subtitle: "color: draws one line per category, each named on the chart"
    x: week
    y: revenue
    color: category
    style:
      axis_y:
        labels:
          format: currency_whole
  area_stacked:
    query: weekly_revenue_by_category
    type: area
    title: Composition of weekly revenue
    subtitle: "style.stack: zero shows changing composition over time"
    x: week
    y: revenue
    color: category
    style:
      stack: zero
      axis_y:
        labels:
          format: currency_whole
  scatter_basic:
    query: order_scatter
    type: scatter
    title: Revenue vs. units sold
    subtitle: "type: scatter plots two measures against each other"
    x: units_sold
    y: revenue
    color: category
    x_label: Units Sold
    y_label: Revenue
    style:
      axis_y:
        labels:
          format: currency_whole
  bubble_scatter:
    query: company_growth_margin
    type: scatter
    title: Growth, margin, and headcount by company
    subtitle: "size: maps a third measure to point area"
    x: growth_rate
    y: margin
    size: headcount
    color: region
    x_label: Growth rate
    y_label: Margin
    style:
      axis_x:
        labels:
          format: percent_whole
      axis_y:
        labels:
          format: percent_whole
  pie_basic:
    query: category_revenue
    type: pie
    title: Revenue share by category
    subtitle: "type: pie divides a whole into angular slices"
    theta: revenue
    color: category
  donut_basic:
    query: document_status
    type: donut
    title: Documents by status
    subtitle: "type: donut is a pie with a hole in the middle"
    theta: document_count
    color: status
  heatmap_basic:
    query: region_product_revenue
    type: heatmap
    title: Revenue by region and product
    subtitle: "color: encodes the value as a shaded cell instead of a bar"
    x: region
    y: product
    color: revenue
  spark_revenue:
    query: monthly_revenue
    type: spark_bar
    title: Revenue trend
    subtitle: "type: spark_bar is a compact inline trend, no axes"
    x: revenue
    y: month_label
  histogram_revenue:
    query: order_scatter
    type: histogram
    title: Order revenue distribution
    subtitle: "type: histogram bins a continuous field"
    x: revenue
  revenue_kpi:
    query: sales_summary
    type: kpi
    label: Total revenue
    value: revenue
  reading_callout:
    type: callout
    title: Read with care
    message: >
      Units are shipped, not ordered. Returns are netted out the following
      month, so the latest month reads low until it closes.
    style:
      tone: warning
  orders_table:
    query: recent_orders
    type: table
    title: Recent orders
    subtitle: "type: table lists rows with formatted columns"
  density_map:
    query: new_england_density
    type: map
    title: Population density
    subtitle: "type: map (also geoshape) fills regions by a value"
    geo:
      source: us-states
    lookup: state_code
    value: population_density
  store_points:
    query: new_england_stores
    type: point_map
    title: Store locations
    subtitle: "type: point_map marks exact coordinates"
    latitude: lat
    longitude: lng
    geo_source: us-states
  store_bubbles:
    query: new_england_stores
    type: bubble_map
    title: Store revenue
    subtitle: "type: bubble_map sizes each marker by a value"
    latitude: lat
    longitude: lng
    size: revenue
    geo_source: us-states
rows:
- text: |
    dbt Charts draws every chart type below from the same small set of
    typed fields, `x`, `y`, `color`, `theta`, `value`, and a typed `style`
    block. All sixteen built-in types are here, each in a natural business
    use, grouped by family.
- title: Bars
  rows:
  - cols:
    - vertical_bar
    - horizontal_bar
    - grouped_bar
  - cols:
    - stacked_bar
    - stacked_bar_normalized
    - mirror_bar
  - cols:
    - histogram_revenue
- title: Lines and areas
  rows:
  - cols:
    - line_single
    - line_multi
    - area_stacked
- title: Points
  rows:
  - cols:
    - scatter_basic
    - bubble_scatter
- title: Sectors and grids
  rows:
  - cols:
    - pie_basic
    - donut_basic
    - heatmap_basic
- title: Values and tables
  rows:
  - cols:
    - revenue_kpi
    - reading_callout
    - spark_revenue
  - cols:
    - orders_table
- title: Maps
  rows:
  - cols:
    - density_map
    - store_points
    - store_bubbles
