  - cols: [c_small, c_bold]

charts:
  c_labels:
    query: traffic
    type: heatmap
    x: day
    y: block
    color: visits
    title: Dark ink on pale cells, light ink on dark cells
    subtitle: Every cell prints its value, and every label reads against its own fill, from the palest cell to the darkest.
    style:
      marks:
        rect:
          labels:
            visible: true
  c_small:
    query: sales
    type: heatmap
    x: month
    y: region
    color: orders
    title: Labels that do not fit are left off
    subtitle: Short values print; wide ones such as 12,480 are omitted from their narrow cells rather than shrunk or clipped.
    style:
      marks:
        rect:
          labels:
            visible: true
            format: ",.0f"
  c_bold:
    query: traffic
    type: heatmap
    x: day
    y: block
    color: visits
    title: One cell's label in bold red
    subtitle: Only the cells at or above 125 visits carry the conditional rule.
    style:
      marks:
        rect:
          labels:
            visible: true
      conditional:
        visits:
          - gte: 125
            marks:
              text:
                font:
                  color: "#c62828"
                  weight: 700
