# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
# Template board: shared presentation defaults for report-style dashboards.
#
# The underscore prefix marks this as a non-listable building block.
# Other boards extend this to inherit the cream theme and tighter card spacing.
# It remains a valid standalone board — template boards must be self-contained.

title: Report Base (template)
notes: >
  Base template for report-style dashboards.
  Extend this board to inherit the cream theme and compact card gap.

extends: paper

style:
  frame:
    card_gap: 4.0

rows: []
