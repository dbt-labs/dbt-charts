# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
# Custom charts
# =============
# Every chart here is `type: custom`: an SVG drawn by a sandboxed Jinja
# template in this project's templates/ folder. The templates read the board's
# merged style, so a theme switch recolors them like any built-in chart.

title: Custom charts
source: examples_db
notes: |
  Shapes dbt Charts has no `type:` for, each drawn by a template in `templates/`.
  The Sankey and funnel answer dbt-labs/dbt-charts#3, the XmR chart answers
  dbt-labs/dbt-charts#44, and the pictogram follows a 1938 Isotype chart.
style:
  frame:
    width: 1440
  charts:
    category_colors:
      qualification:
        values:
          Graduates: "#2b59a8"
          Certificated: "#d33a32"
          Specialists: "#2e9a6a"
          Uncertificated: "#2a2a2a"
queries:
  signup_flows:
    columns: [source, target, visitors]
    values:
      - [Visits, Signup, 4200]
      - [Visits, Bounced, 9800]
      - [Signup, Trial, 3100]
      - [Signup, Abandoned, 1100]
      - [Trial, Paid, 1300]
      - [Trial, Churned, 1800]
      - [Paid, Annual, 500]
      - [Paid, Monthly, 800]
  activation_funnel:
    columns: [stage, users]
    values:
      - [Visited site, 48210]
      - [Started signup, 12940]
      - [Verified email, 9120]
      - [Created a board, 5310]
      - [Invited a teammate, 2180]
      - [Upgraded, 740]
  nps:
    columns: [nps, goal]
    values:
      - [72.4, 80]
  sessions_by_channel:
    columns: [channel, sessions]
    values:
      - [Search, 18400]
      - [Direct, 12900]
      - [Social, 8300]
      - [Email, 6100]
      - [Partners, 2900]
  defect_rate:
    sql: |
      SELECT
        strftime(DATE '2024-01-01' + INTERVAL (m) MONTH, '%b %Y') AS month,
        round(
          42 + 3.1 * sin(m * 1.9) + 2.2 * cos(m * 3.7)
          + CASE WHEN m BETWEEN 17 AND 25 THEN 4.2 ELSE 0 END
          + CASE WHEN m = 9 THEN -11 ELSE 0 END,
          1
        ) AS defects_per_k
      FROM range(30) AS t(m)
      ORDER BY m
  # Counts read off Isotype chart VI (1938), one symbol per 1,250 teachers.
  teachers_1938:
    columns: [school, qualification, teachers, per_row]
    values:
      - [Elementary men, Graduates, 6250, 3]
      - [Elementary men, Certificated, 38750, 3]
      - [Elementary men, Specialists, 2500, 3]
      - [Elementary men, Uncertificated, 1250, 3]
      - [Elementary women, Graduates, 3750, 7]
      - [Elementary women, Certificated, 103750, 7]
      - [Elementary women, Specialists, 2500, 7]
      - [Elementary women, Uncertificated, 21250, 7]
      - [Secondary men, Graduates, 12500, 1]
      - [Secondary men, Specialists, 1250, 1]
      - [Secondary women, Graduates, 8750, 1]
      - [Secondary women, Certificated, 1250, 1]
      - [Secondary women, Specialists, 2500, 1]
      - [Secondary women, Uncertificated, 1250, 1]
  plan_scores:
    columns: [category, plan, score]
    values:
      - [Speed, Starter, 6]
      - [Reliability, Starter, 7]
      - [Support, Starter, 4]
      - [Integrations, Starter, 5]
      - [Ease of use, Starter, 9]
      - [Price, Starter, 9]
      - [Speed, Enterprise, 9]
      - [Reliability, Enterprise, 9]
      - [Support, Enterprise, 8]
      - [Integrations, Enterprise, 9]
      - [Ease of use, Enterprise, 6]
      - [Price, Enterprise, 4]
  trade:
    columns: [year, exports, imports]
    values:
      - [1700, 60, 40]
      - [1710, 75, 50]
      - [1720, 80, 55]
      - [1730, 110, 60]
      - [1740, 125, 80]
      - [1750, 150, 95]
      - [1760, 170, 115]
      - [1770, 200, 130]
  warehouse_share:
    columns: [warehouse, projects]
    values:
      - [Snowflake, 412]
      - [BigQuery, 298]
      - [Databricks, 187]
      - [Redshift, 96]
      - [Postgres, 61]
      - [DuckDB, 38]
  campaign_economics:
    sql: |
      SELECT
        channel,
        campaign,
        cost_per_signup,
        retention,
        avg(cost_per_signup) OVER () AS avg_cost,
        avg(retention) OVER () AS avg_retention
      FROM (VALUES
        ('Search', 'Brand search', 18, 0.46),
        ('Search', 'Generic search', 42, 0.31),
        ('Search', 'Competitor terms', 55, 0.27),
        ('Search', 'Retargeting', 24, 0.38),
        ('Social', 'LinkedIn sponsored', 68, 0.29),
        ('Social', 'Instagram', 33, 0.18),
        ('Social', 'YouTube pre-roll', 47, 0.21),
        ('Social', 'Reddit', 29, 0.24),
        ('Email', 'Newsletter', 9, 0.41),
        ('Email', 'Win-back', 14, 0.22),
        ('Email', 'Onboarding drip', 6, 0.52),
        ('Partners', 'Agency referrals', 31, 0.58),
        ('Partners', 'Marketplace listing', 22, 0.44),
        ('Partners', 'Integration directory', 16, 0.49),
        ('Events', 'Conference booth', 92, 0.47),
        ('Events', 'Webinar series', 27, 0.43),
        ('Events', 'Meetups', 51, 0.36)
      ) AS t(channel, campaign, cost_per_signup, retention)
    formats:
      cost_per_signup: currency_whole
      avg_cost: currency_whole
      retention: percent_whole
      avg_retention: percent_whole
charts:
  signup_sankey:
    type: custom
    template: sankey
    query: signup_flows
    title: Where visitors go
    subtitle: Visitors by step, from first visit to plan
    x: [source, target]
    value: visitors
  activation:
    type: custom
    template: funnel
    query: activation_funnel
    title: Activation funnel
    x: stage
    y: users
    options:
      label_width: 140
  nps_gauge:
    type: custom
    template: gauge
    query: nps
    title: Net promoter score
    style:
      aspect_ratio: 1.8
    value: nps
    options:
      max: 100
      target: goal
      bands: "50,75"
      label: Target 80
      value_format: ".0f"
  channel_rings:
    type: custom
    template: radial_bar
    query: sessions_by_channel
    title: Sessions by channel
    style:
      aspect_ratio: 1
    x: channel
    y: sessions
  defect_xmr:
    type: custom
    template: xmr
    query: defect_rate
    title: Defects per thousand units
    subtitle: Red points sit outside the natural process limits; amber points are a run of eight above the mean
    x: month
    y: defects_per_k
  teachers_isotype:
    type: custom
    template: isotype
    query: teachers_1938
    title: Teachers in public elementary and secondary schools, 1938
    subtitle: England and Wales, after Isotype chart VI
    style:
      aspect_ratio: 0.8
    x: school
    color: qualification
    y: teachers
    options:
      per_symbol: 1250
      unit: teachers
      per_row_column: per_row
  warehouse_waffle:
    type: custom
    template: waffle
    query: warehouse_share
    title: Projects by warehouse
    color: warehouse
    theta: projects
  plan_radar:
    type: custom
    template: radar
    query: plan_scores
    title: Plan review scores
    subtitle: Scores out of ten
    x: category
    y: score
    color: plan
    options:
      max: 10
      rings: 5
  campaign_quadrant:
    type: custom
    template: quadrant
    query: campaign_economics
    title: Campaign cost against retention
    subtitle: One dot per campaign; the crosshair sits at the average of all campaigns
    style:
      aspect_ratio: 1.3
    x: cost_per_signup
    y: retention
    color: channel
    options:
      center_x: avg_cost
      center_y: avg_retention
      corner: top_left
      corner_label: Cheaper and stickier
      x_title: Cost per signup
      y_title: Signups still active after 90 days
  # Inline: the template, header included, lives under `svg:` instead of templates/.
  trade_balance:
    type: custom
    query: trade
    title: Exports and imports
    subtitle: Drawn by an inline template
    svg: |
      {#---
      description: Two lines with the gap between them filled and labeled.
      channels:
        x:
          description: Column holding the period.
        y:
          description: The upper line's column, then the lower line's.
          multiple: true
      ---#}
      {% set up = channels.y[0] %}{% set lo = channels.y[1] %}
      {% set n = rows | length %}{% set pad = 40 %}
      {% set ymax = [rows | map(attribute=up) | max, rows | map(attribute=lo) | max] | max * 1.1 %}
      {% set x = d3.scale_linear([0, n - 1], [pad, width - pad]) %}
      {% set y = d3.scale_linear([0, ymax], [height - pad, pad]) %}
      {% set ns = namespace(upper=[], lower=[]) %}
      {% for r in rows %}
        {% set ns.upper = ns.upper + [[x(loop.index0), y(r[up])]] %}
        {% set ns.lower = ns.lower + [[x(loop.index0), y(r[lo])]] %}
      {% endfor %}
      <g font-family="{{ style.font.family }}" font-size="{{ style.font.size }}" fill="{{ style.font.color }}">
        <path fill="{{ style.tones.positive }}" fill-opacity="0.3"
          d="{{ d3.line(ns.upper + (ns.lower | reverse | list)) }}Z"/>
        <path fill="none" stroke="{{ style.accent }}" stroke-width="2" d="{{ d3.line(ns.upper) }}"/>
        <path fill="none" stroke="{{ style.muted }}" stroke-width="2" d="{{ d3.line(ns.lower) }}"/>
        {% for r in rows %}
        <text x="{{ x(loop.index0) }}" y="{{ height - pad / 3 }}"
              text-anchor="middle">{{ r[channels.x] }}</text>
        {% endfor %}
        {% set mid = rows[n // 2] %}
        <text x="{{ x(n // 2) }}" y="{{ y((mid[up] + mid[lo]) / 2) }}"
              text-anchor="middle" dy="0.35em" font-style="italic">Balance in our favor</text>
        <text x="{{ width - pad }}" y="{{ y(rows[n - 1][up]) - 8 }}"
              text-anchor="end" fill="{{ style.accent }}">{{ up }}</text>
        <text x="{{ width - pad }}" y="{{ y(rows[n - 1][lo]) + 22 }}"
              text-anchor="end" fill="{{ style.muted }}">{{ lo }}</text>
      </g>
    x: year
    y: [exports, imports]
rows:
- text: |
    Each chart below is `type: custom`. A template in `templates/` turns the
    query rows into SVG and reads the board's style for its colors and fonts,
    so these charts follow the theme like the built-in types do.
- title: Flows and stages
  rows:
  - cols:
    - signup_sankey
    - activation
- title: Single values and rankings
  rows:
  - cols:
    - nps_gauge
    - channel_rings
    - warehouse_waffle
- title: Inline template
  rows:
  - cols:
    - trade_balance
- title: Process behavior and profiles
  rows:
  - cols:
    - defect_xmr
    - plan_radar
- title: Quadrants
  rows:
  - cols:
    - campaign_quadrant
    - text: |
        A **quadrant scatter** splits the plane at a center point and shades
        the corner where both measures sit on their better side: here, cheaper
        than the average campaign and better at keeping signups.

        The query computes the center with a window average and repeats it on
        every row, so the template only draws. Its scales, ticks and gutter
        come from `d3.scale_linear(...).nice()`; `corner:` picks the quadrant
        to shade.
- title: Pictograms
  rows:
  - cols:
    - teachers_isotype
    - text: |
        **Isotype** (International System of Typographic Picture Education)
        was developed in 1920s Vienna by Otto Neurath, Marie Neurath, and
        Gerd Arntz. A symbol always stands for the same quantity, so a reader
        compares amounts by counting.

        This chart follows chart VI of a 1938 Isotype book: one figure for
        every 1,250 teachers, colored by qualification. The colors are board
        pins under `style.charts.category_colors`, which a template reads
        through `color_for(value, column)`.
