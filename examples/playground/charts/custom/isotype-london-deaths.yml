# Isotype chart I from "Battle for health" (1944), redrawn with the
# isotype_rows template. Values are read off the original chart.
title: Deaths per 100 population in London
style:
  frame:
    width: 1600
notes: |
  After chart I of *Battle for health, a primer for social medicine* (Isotype
  Institute, 1944). Each row is a hundred Londoners; each cross is one of them
  who died that year, on the annual average. Values are read off the original
  chart, to the nearest half symbol.
queries:
  london_deaths:
    columns: [period, deaths_per_100, event]
    values:
      - ["1625", 20, Plague]
      - [about 1650, 5, null]
      - ["1665", 20, Plague]
      - [about 1710, 4, null]
      - [about 1810, 2.5, null]
      - ["1849", 3, Cholera]
      - [about 1870, 2.5, null]
      - [about 1910, 1.5, null]
      - ["1917", 2, War]
      - ["1938", 1, null]
charts:
  london_deaths:
    type: custom
    template: isotype_rows
    query: london_deaths
    style:
      aspect_ratio: 1.9
    y: period
    x: deaths_per_100
    options:
      note: event
      symbol: cross
      symbol_color: chrome.heading
      out_of: 100
      backdrop_symbol: person
      backdrop_color: warning.solid
      key: Each cross represents one death among a hundred people
rows:
  - london_deaths
