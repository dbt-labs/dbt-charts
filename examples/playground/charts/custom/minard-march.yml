# Charles Joseph Minard's 1869 map of Napoleon's Russian campaign of 1812,
# redrawn with the minard template.
title: Napoleon's march on Moscow, 1812
notes: |
  After Charles Joseph Minard's *Carte figurative des pertes successives en
  hommes de l'Armée Française dans la campagne de Russie 1812-1813* (1869).
  The band's width is the number of men still with the army: tan on the
  advance from the Niemen, black on the retreat from Moscow. Beneath it, the
  cold of the retreat, in degrees Réaumur, on the same longitude scale.
  Troop, city, and temperature figures are approximate, as tabulated from
  Minard's map by Leland Wilkinson and Michael Friendly.
