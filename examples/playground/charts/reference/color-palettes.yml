  # ============================================================================
  # FAMILY EXPLANATIONS + DEMOS
  # ============================================================================

  - text: |
      ---

      # Family notes

      ## Categorical

      Discrete, unordered hues. Used when a chart needs to distinguish
      categories that have no inherent ranking. `vivid-10` is the
      chroma-pushed default the `vivid` and `neon` themes cycle through: blue-first, calm
      posture, earth-and-neutral expansion past slot 5. It's a retune of the
      former `category-10` arrangement — each slot holds its hue while the
      muted blue/cyan/green/gold/moss are lifted toward the sRGB gamut ceiling.
      Single-series charts (one mark, no color encoding) don't read from this
      palette at all — they paint with the active theme's
      `single_series_palette[0]` ink.

      Every categorical palette derives four literal tiers live from its own
      stops — `dark`, `light`, `pale`, and `deep` — computed by `variant()`,
      no companion file to author or keep in sync. Address one with a
      trailing token segment on any form: `vivid-10.dark` (whole list),
      `vivid-10.3.dark` (one slot), `category.blue.dark` (role + alias).
      `dark` inks direct text labels (e.g. right-pane endpoint labels on
      multi-series lines, segment names on stacked bars) — though the
      engine derives label ink live from each mark's own color against the
      chart's canvas (`label_ink()`) rather than reading a fixed variant
      slot, which is what keeps labels legible on dark themes like `neon`
      with no theme-level rebind. `light` is a moderate positive lightness
      shift; `pale` is the dim-the-chorus de-emphasis band, every stop
      pulled toward one uniform light band; `deep` is `pale`'s symmetric
      opposite — every stop dropped into a tight dark band, the
      theme-level default ink for single-encoding marks (the vivid-family
      themes bind `single_series_palette` to a `deep` slot). The pairing is
      positional: variant slot N derives from base slot N in `vivid-10`.

      `editorial-10` is the quieter 10-color cycle used by `clarity` and
      `paper`. Its order is blue, sky, green, purple,
      gold, rust, teal, brown, gray, graphite. Its four variants read the
      same way: `dark` for direct labels, `light` for a moderate lift,
      `pale` for de-emphasis, `deep` for single-encoding ink. Clarity fixes
      one ink (blue, `category.blue.deep`) for every single-series chart —
      no rotation; paper still cycles brown/gold/orange. At
      N=10 weighted Leonardo CVD scoring this palette outperforms `vivid-10`,
      The Economist, and Apache ECharts.

      **Named hue roles.** Beyond positional access (`category[3]`), the two
      default categorical palettes and their companions name each slot by hue:
      `category.blue`, `category.green`, `category.gold`, `category.purple`,
      `category.orange`, `category.gray`, `category.charcoal`, plus
      `category.sky` and `category.sage` for the two lighter cool slots. A hue
      can sit at a different slot in each palette, so a named token stays
      swap-invariant: `category.green`
      resolves to the green of whichever palette the active theme binds to the
      `category` role, and switching themes keeps green green without touching
      the board. The `dark`/`light`/`pale`/`deep` variants carry the same
      names against their own slots. The names are a slot bijection. `orange`
      maps to editorial rust, `sage` maps to editorial teal, and `charcoal`
      maps to editorial graphite. Roles preserve semantic intent across a
      reorder, not an exact color value.
      Tonal palettes (`category-6-tonal-*`) define no hue names — a hue token
      against them errors rather than guessing.

      The five `category-6-tonal-*` palettes hold a single hue across
      6 stops — useful for editorial dashboards that want one hue throughout.
      Slots 0–3 are CVD-strict-safe; slots 4–5 are extended and require
      redundant form encoding (dash, marker, or pattern).

      `tableau` and `hero-6` are kept for users who want the familiar
      Tableau hues or a marketing/cover-page blue lead.

      ## Sequential

      Single-hue, monotonic L\* ramp from light to dark. Each palette has
      11 hand-authored stops (the **spine**). Reviewers edit the spine;
      renderers consume the spine directly.

      Eight palettes, tuned to harmonize with both `vivid-10` (the
      saturated default) and `editorial-10` (the muted editorial default) —
      hue identity is anchored on vivid-10, chroma is pulled to sit closer
      to editorial-10's quieter envelope. Each palette name describes the
      midtone identity: `dbt-seq-amber` (honey/amber, not pure gold),
      `dbt-seq-rust` (terracotta, not vivid orange), `dbt-seq-teal` (turquoise),
      `dbt-seq-brown` (warm low-chroma, pairs with cream),
      `dbt-seq-gray` (pure achromatic — magnitude without hue meaning).

      ## Diverging

      Symmetric two-arm ramps about a neutral light midpoint (step 6).
      `dbt-div-blue-red` is the default — RdBu-family editorial posture,
      CVD-safe under deut/prot/trit at common subset counts.
      `dbt-div-orange-teal` is the politically-neutral alternative.
      `dbt-div-crimson-green` is the asymmetric red-green for finance
      (loss/gain) — engineered to pass CVD where symmetric red-green fails;
      always pair with icon + label.
      `dbt-div-coolwarm` is Moreland 2009 (canonical scientific viz);
      `dbt-div-sunset` is Paul Tol's SRON-published multi-hue diverging.

      ## Scaffold

      `dbt-grays` (cool) and `dbt-creams` (warm) are the structural framing
      palettes. They're not data — they're chrome. Reference slots by
      named step: `color("dbt-grays.ink")`, `color("dbt-creams.canvas")`.
      Scaffolds pair with their matching theme: clarity/vivid/neon →
      dbt-grays; paper → dbt-creams.

      ## Tone

      Status palettes. Each one (`negative`, `positive`, `warning`, `info`)
      ships six named role slots — `bg`, `subtle`, `border`, `solid`,
      `solid-hover`, `text` — designed to compose into notice cards, badges,
      and buttons that pass WCAG AA without per-component tuning. The strips
      in the index above run those six slots left to right.

      Reference slots directly: `color("negative.solid")`,
      `color("warning.bg")`, `color("positive.text")`, `color("info.solid")`.

  - text: |
      ---

      # Named hue roles — live demo

      Every strip above references a palette directly, by its own literal
      name (`color("<name>.<n>")` by stop position for categorical/sequential/
      diverging/scaffold, `color("<name>.<slot>")` by alias for tone) — none of
      them change when the active theme changes. The swatches in **this** row are
      different: they're authored with named-*role* tokens — `category.blue`,
      `category.green`, `category.gold`, … — as their `background`. Each token
      resolves through whichever categorical palette the active theme binds to
      the `category` role, so the same board repaints on a theme swap.

      This page carries no `theme:` key, so it renders under the **default**
      theme (`clarity`, which binds `category` to `editorial-10`) — the strip
      below should therefore match the `editorial-10` strip in the index, hue
