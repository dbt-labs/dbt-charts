# Color Palettes — Every dbt charts palette in one place.
#
# Compact index up top (name + swatch strip per palette, grouped by family),
# then family explanations and demos below. Most-used data palettes
# (categorical → sequential → diverging) come first; UI scaffolds and
# semantic role palettes follow, leading into the semantic demo at the end.

title: "Color Palettes"
notes: "Every dbt charts color palette: categorical, sequential, diverging, scaffold, and tone."

text: |
  Every dbt charts color palette in one place. The index below shows all palettes
  as compact swatch strips, grouped by family. Family explanations and demos
  follow underneath.

  Palette source files live in `dbt-charts/src/dbt_charts/core/defaults/palettes/`. Reference
  a palette in YAML with `color("palette-name.slot-or-stop")`.

# ============================================================================
# COMPACT INDEX
# ============================================================================
# Each palette is one row: fixed-width name column + a strip of square swatches.
# Name column is 180px across every family so first swatches align vertically.
# Each swatch is 28×28px with a 4px gap, so an 11-stop palette is visibly
# longer than a 6-stop palette.

rows:
  # ── Categorical ───────────────────────────────────────────────────────
  - text: "## Categorical"
  - text: |
      Discrete hues for unordered categories. `vivid-10` is the chroma-pushed
      default the `vivid` and `neon` themes cycle through; `editorial-10` is
      the muted, cycling-discipline counterpart used by `clarity` and `paper`.
      Every categorical palette derives four literal tiers live --
      `dark`/`light`/`pale`/`deep` -- computed from its own stops (`variant()`,
      no companion file to author or keep in sync); address one with a
      trailing token segment (`vivid-10.dark`, `category.blue.pale`). A board
      can still pin the same fixed dark `dbt-grays.heading` single-series mark
      via `single_series_palette: [dbt-grays.heading]` (see
      `labs/gray-single-series`). The `category-6-tonal-*` palettes stay
      within a single hue family for editorial restraint.

