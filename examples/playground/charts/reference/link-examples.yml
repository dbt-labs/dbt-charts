title: link Click-Through Examples
notes: |
  Demonstrates all three link usage patterns:
    1. Static URL — every bar/point navigates to the same page
    2. Dynamic URL — field value is interpolated into the URL
    3. Variable update — clicking a mark updates a dashboard variable in-place
       (the query string is intercepted by variables.js; no full navigation)

source: examples_db
variables:
  selected_category:
    label: Category
    default:
queries:
  revenue_by_category: |
    SELECT
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY category
    ORDER BY revenue DESC

  revenue_by_region: |
    SELECT
      region,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY region
    ORDER BY revenue DESC

  revenue_by_product: |
    SELECT
      product,
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    WHERE category = '{{ selected_category }}'
       OR '{{ selected_category }}' = ''
    GROUP BY product, category
    ORDER BY revenue DESC
    LIMIT 10

charts:
  static_link:
    query: revenue_by_category
    type: bar
    x: category
    y: revenue
    title: Static URL — all bars link to the same page
    link: "https://example.com/"
  dynamic_path_link:
    query: revenue_by_region
    type: bar
    x: region
    y: revenue
    title: Dynamic URL — each bar's link carries its own field value
    link: "/reference/regions?region={{ x }}"
  variable_update_link:
    query: revenue_by_category
    type: bar
    x: category
    y: revenue
    title: Variable update — click a bar to filter the product breakdown below
    link: ?selected_category={{ x }}
  product_breakdown:
    query: revenue_by_product
    type: bar
    x: product
    y: revenue
    color: category
    title: Product breakdown (filtered by selected category)
    style:
      stack: zero
rows:
  - cols:
      - static_link
      - dynamic_path_link
  - cols:
      - variable_update_link
      - product_breakdown
