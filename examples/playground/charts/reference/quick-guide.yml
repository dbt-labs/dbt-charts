    type: kpi
    value: units_sold

text: |
  Get up and running with dbt charts in 5 minutes. This guide walks you through the core concepts and builds a dashboard from scratch.

  **🎯 Meta moment:** This entire tutorial is itself a dbt charts dashboard with embedded examples!
  Each section below is a nested dashboard demonstrating the concept.

  ---

  ## Core Elements

  dbt charts has just four core elements:

  - **boards** — containers that define layout and structure
  - **queries** — fetch data via SQL, CSV, dbt, or HTTP
  - **charts** — visualize data from queries
  - **variables** — user inputs that filter and update the dashboard

  We'll make combinations of these in one YAML file to declare exactly the dashboard we'd like to be rendered. Let's start by going through each of these.

  ---

  ## Boards of Boards: The Layout System

  Boards are the fundamental building block of dbt charts. They work recursively and by creating and nesting combinations of boards you can make incredibly complex designs. A board uses one of four layout types: **rows**, **cols**, **tabs**, or **grid**.

  Here's a quick example showcasing the different types of boards:

rows:
  # ==========================================================================
  # LAYOUT TYPES DEMO
  # ==========================================================================
  - title: "Layout Types Demo"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    rows:
      - title: "ROWS: Stack items vertically"
        rows:
          - text: "**First row item** - full width"
            style:
              background: mistyrose
              padding: "8px"
          - text: "**Second row item** - stacks below"
            style:
              background: pink
              padding: "8px"

      - title: "COLS: Place items side by side"
        cols:
          - text: "**Left column**"
            style:
              background: aliceblue
              padding: "8px"
          - text: "**Middle column**"
            style:
              background: lightblue
              padding: "8px"
          - text: "**Right column**"
            style:
              background: lightskyblue
              padding: "8px"

      - title: "NESTED: Unequal widths"
        cols:
          - text: "**Wide** (2/3)"
            style:
              background: honeydew
              padding: "8px"
          - cols:
              - text: "**Narrow** (1/6)"
                style:
                  background: palegreen
                  padding: "8px"
              - text: "**Narrow** (1/6)"
                style:
                  background: lightgreen
                  padding: "8px"

      - title: "TABS: Organized views"
        tabs:
          items:
            - title: "Tab A"
              text: "Content for **Tab A** - click the tabs above!"
              style:
                background: lavender
                padding: "12px"
            - title: "Tab B"
              text: "Content for **Tab B** - tabs hide content until needed"
              style:
                background: thistle
                padding: "12px"
            - title: "Tab C"
              text: "Content for **Tab C** - great for reducing clutter"
              style:
                background: plum
                padding: "12px"

  - text: |
      As you can see, you can nest simple boards to create complex layouts. You can even import entire files and use them as board items.

      **Split Screen Imports** - Show two dashboards side by side:

  # ==========================================================================
  # SPLIT SCREEN DEMO
  # ==========================================================================
  - title: "Split Screen View"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    cols:
      - title: "Sales Dashboard"
        rows:
          - text: "## 📈 Sales Overview"
            style:
              background: mistyrose
              padding: "8px"
          - text: "Revenue metrics and trends would go here"
            style:
              background: pink
              padding: "8px"

      - title: "Marketing Dashboard"
        rows:
          - text: "## 📊 Marketing Overview"
            style:
              background: aliceblue
              padding: "8px"
          - text: "Campaign metrics and analytics would go here"
            style:
              background: lightblue
              padding: "8px"

  - text: |
      With imports, this becomes just:

      ```yaml
      # charts/company_overview.yml
      cols:
        - sales_dashboard.yml      # sibling: charts/sales_dashboard.yml
        - marketing_dashboard.yml  # sibling: charts/marketing_dashboard.yml
      ```

      Any `.yml` file can be imported as a board item by its path, written
      relative to the importing file's own directory. The extension is required —
      it is what marks the item as a file import rather than a chart name.

      In a nutshell, that's the layout system: **boards of boards**.

      ---

      ## Queries: Getting Data

      Queries define where your data comes from. Each query has a name and a source:

      ```yaml
      queries:
        sales:
          sql: |
            SELECT product, category, revenue, units_sold
            FROM ecommerce_orders
            WHERE revenue > 100
          source: my_postgres
      ```

      dbt charts supports multiple types of queries: **SQL**, **CSV**, **dbt**, **HTTP APIs**, and more. You can even reference queries from other files.

  # ==========================================================================
  # QUERIES DEMO
  # ==========================================================================
  - title: "Query Types"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    cols:
      - text: |
          ### CSV Query

          ```yaml
          queries:
            sales:
              source: examples_db
              sql: SELECT * FROM ecommerce_orders
          ```

          Load data directly from CSV files.
        style:
          background: "#e3f2fd"
          padding: "12px"
          border:
            radius: 4

      - text: |
          ### SQL Query

          ```yaml
          queries:
            revenue:
              sql: |
                SELECT product, SUM(revenue)
                FROM orders
                GROUP BY product
              source: my_postgres
          ```

          Query any SQL database.
        style:
          background: "#f3e5f5"
          padding: "12px"
          border:
            radius: 4

      - text: |
          ### Import Query

          ```yaml
          queries:
            shared:
              source: _queries.yml#sales
          ```

          Reuse queries from other files.
        style:
          background: "#e8f5e9"
          padding: "12px"
          border:
            radius: 4

  - text: |
      ---

      ## Charts: Visualizing Data

      Charts turn query data into visualizations. Reference a query and map fields to chart properties:

  # ==========================================================================
  # CHARTS DEMO - SINGLE
  # ==========================================================================
  - title: "Charts Demo"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    rows:
      - revenue_by_product

  - text: |
      The chart references `query: sales` to pull data, then maps `product` to the x-axis and `revenue` to the y-axis.

      ### Multiple Charts

      Add more charts and arrange them with layouts:

  # ==========================================================================
  # CHARTS DEMO - MULTIPLE
  # ==========================================================================
  - title: "Multiple Charts Demo"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    rows:
      - cols:
          - revenue_bar
          - category_donut
      - trend_line

  - text: |
      dbt charts supports all [Vega-Lite](https://vega.github.io/vega-lite/) chart types: `bar`, `line`, `area`, `pie`, `scatter`, `heatmap`, `table`, `kpi`, and more.

      ---

      ## Variables: Making It Interactive

      Variables add user inputs that dynamically update your dashboard. Let's start with a simple example:

  # ==========================================================================
  # VARIABLES DEMO - SIMPLE
  # ==========================================================================
  - title: "Variables Demo"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    variables:
      name:
        label: "Your Name"
        input: input
        default: "World"
    rows:
      - text: |
          # Hello, {{ name }}! 👋
        style:
          background: honeydew
          padding: "20px"
          text:
            align: center
          border:
            radius: 8

  - text: |
      Type in the input above and watch the greeting change! The `{{ name }}` syntax inserts the variable value.

      ### Variables in Dashboards

      Variables can appear anywhere — in text, titles, and even query filters. Here's a dashboard with a category selector:

  # ==========================================================================
  # VARIABLES DEMO - DASHBOARD
  # ==========================================================================
  - title: "Interactive Dashboard Demo"
    style:
      background: "#f5f5f5"
      margin: "16px 0"
      border:
        width: 1
        color: "#ddd"
        radius: 8
      padding: "16px"
    variables:
      demo_category:
        label: "Category Filter"
        options:
          static: [Electronics, Furniture, Clothing]
        default: Electronics
    rows:
      - text: "### Showing: {{ demo_category }}"
        style:
          background: azure
          padding: "12px"
      - revenue_kpi
      - revenue_bar

  - text: |
      The selected category appears in the header. For actual data filtering, variables connect to query filters.

      Variable input types include: `select`, `input`, `number`, `date`, `daterange`, and more.

      ---

      ## Styling: Making It Beautiful

      Every board accepts a `style:` block, and most of it cascades: a background, a font color, a border, or a chart palette set once on a board reaches every nested board and chart inside it. Below, one `style:` on the outer board carries the whole look:

  # ==========================================================================
  # STYLING DEMO
  # ==========================================================================
  # One style block on the nested board carries the whole look. The header is
  # a text item that inverts the same palette (ink surface, cream type) to
  # show a local override sitting inside the cascade.
  - title: "Quarterly Sales"
    style:
      background: "#f6f1e7"
      font:
        color: "#2b2620"
      border:
        radius: 12
      padding: "24px"
      gap: 16
      charts:
        background: white
        color:
          categorical:
            palette: ["#b5562f", "#d9a45b", "#5e6b4f"]
            single_series_palette: ["#b5562f"]
        axis:
          grid:
            color: "#ece4d6"
    variables:
      style_category:
        label: "Category"
        options:
          static: [Electronics, Furniture, Clothing]
        default: Electronics
    rows:
      - text: |
          ## {{ style_category }} performance

          Revenue, units, and product mix for the quarter to date.
        style:
          background: "#2b2620"
          font:
            color: "#f6f1e7"
          title:
            font:
              color: "#f6f1e7"
          padding: "28px 32px"
          border:
            radius: 10

      - cols:
          - revenue_kpi
          - units_kpi
        style:
          padding: 0
          gap: 16

      - cols:
          - revenue_bar
          - category_donut
        style:
          padding: 0
          gap: 16

      - text: "**Widget B** leads on revenue · **Electronics** is 64% of the mix · **Tools** trail at 15%"
        style:
          font:
            color: "#8a7b6b"
          text:
            align: center

  - text: |
      That single `style:` block does the work. `background`, `border.radius`, `padding`, `gap`, and `font.color` shape the board itself. The `charts:` group inside it recolors the bar and donut charts at once: canvas background, categorical palette, single-series ink, and grid color. KPI cards have their own slots (`charts.kpi`), so here they sit bare on the surface. Any item can still override locally, as the header text block does by inverting the palette with its own `background` and `font.color`.

      ---

      ## Quick Reference

      ```yaml
      # Complete dashboard structure
      title: My Dashboard

      variables:
        filter:
          input: select
          options:
            static: [A, B, C]
          default: A

      queries:
        my_data:
          sql: SELECT * FROM table

      charts:
        my_chart:
          query: my_data
          type: bar
          x: dimension
          y: metric

      rows:
        - text: "# Welcome!"
        - my_chart
      ```

      That's it — **boards**, **queries**, **charts**, and **variables**. Start simple, add complexity as needed.

      **Happy building!** 🚀
