# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
# Quick Guide - Interactive Tutorial
# This dashboard IS the tutorial! It demonstrates dbt charts concepts
# using embedded examples. Notice: this entire guide is a dbt charts dashboard
# with dashboards embedded inside it!

title: "dbt charts Quick Guide"
notes: "Get up and running with dbt charts in 5 minutes"
source: examples_db

