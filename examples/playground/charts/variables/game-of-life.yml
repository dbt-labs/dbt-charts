rows:
- cols:
  - generation
  - grid
  - population
  - advance
- status
- text: 'Starter pattern chooses either a random seed or a classic Life pattern.

    Starting live cells only applies to Random; the classic patterns use their

    known cell positions. Not precomputed: each selected generation is

    simulated by recursive SQL. Stable means the next board is identical;

    Extinct means no live cells remain.

    '
- board
