# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
# Interactive Sales Board
# Demonstrates variables in nested boards
#
# This example shows how variables and their dependent charts
# can be defined together in a nested board.

title: "Interactive Sales Board"
source: examples_db

queries:
  category_totals: |
    SELECT
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY category
    ORDER BY revenue DESC

# Top-level chart with no variable dependencies
charts:
  category_breakdown:
    style:
      marks:
        slice:
          labels:
            template: "{{ '{:.0%}'.format(percent) }} {{ category }}"
    title: "Revenue by Category"
    query: category_totals
    type: pie
    theta: revenue
    color: category

rows:
  # Top row: intro content on left, pie chart on right
  - cols:
      - title: "About This Dashboard"
        text: |
          Use the **dropdown controls** below to filter the charts.

          This demonstrates dbt charts's interactive features:
          - 📊 **Dynamic titles** — Chart titles update based on your selection
          - 🔄 **Real-time filtering** — See detailed data for your selection
          - 📦 **Nested variables** — Variables scoped to their section

      - category_breakdown

  # Nested board with its own variables AND charts
  - title: "Product Analysis"

    # Variables scoped to this nested board
    variables:
      region:
        options:
          static: [North, South, East, West]
      selected_product:
        label: Select Product
        options:
          static: [Widget A, Widget B, Widget C, Gadget X, Gadget Y, Gadget Z, Tool A, Tool Z]

    queries:
      product_revenue_data: |
        SELECT
          product,
          category,
          SUM(revenue) AS revenue
        FROM ecommerce_orders
        WHERE ({{ region }} IS NULL OR region = {{ region }})
        GROUP BY product, category
        ORDER BY revenue DESC

      product_detail_data: |
        SELECT
          DATE_TRUNC('week', date) AS week,
          product,
          SUM(revenue) AS revenue
        FROM ecommerce_orders
        WHERE ({{ region }} IS NULL OR region = {{ region }})
          AND ({{ selected_product }} IS NULL OR product = {{ selected_product }})
        GROUP BY week, product
        ORDER BY week, product

      units_by_region_data: |
        SELECT
          region,
          SUM(units_sold) AS units_sold
        FROM ecommerce_orders
        WHERE ({{ region }} IS NULL OR region = {{ region }})
          AND ({{ selected_product }} IS NULL OR product = {{ selected_product }})
        GROUP BY region
        ORDER BY units_sold DESC

    # Charts that use the variables - defined in the same nested board
    charts:
      product_revenue:
        title: "Revenue by Product"
        query: product_revenue_data
        type: bar
        x: product
        y: revenue
        color: category

      product_detail:
        title: "Weekly Sales{% if selected_product %} - {{ selected_product }}{% else %} - All Products{% endif %}"
        query: product_detail_data
        type: line
        x: week
        y: revenue
        color: product

      units_by_region:
        title: "Units by Region{% if selected_product %} - {{ selected_product }}{% endif %}"
        query: units_by_region_data
        type: bar
        x: region
        y: units_sold

    # Layout for the nested charts
    rows:
      - cols:
          - product_revenue
          - product_detail
      - cols:
          - units_by_region
