[package]
name = "bind"
version = "0.0.1"
edition = "2021"
description = "The bind stage: a normalized board plus its datasets to a bound board. Data-derived facts only; no measuring, no nodes."

[dependencies]
board-model = { path = "../board-model" }
color = { package = "dbt-charts-color", path = "../color" }
model-core = { path = "../model-core" }
column-types = { path = "../column-types" }
d3rs = { path = "../d3rs" }
diagnostic = { path = "../diagnostic" }
display-text = { path = "../display-text" }
minijinja = "=2.24.0"
template = { path = "../template" }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Scope guards and locale builders the engine's tests build payloads and active scopes with.
test-support = []

[dev-dependencies]
board-model = { path = "../board-model", features = ["fixtures"] }
bind = { path = ".", features = ["test-support"] }
diagnostic = { path = "../diagnostic", features = ["test-support"] }
yaml = { path = "../yaml" }
