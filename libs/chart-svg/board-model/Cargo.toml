[package]
name = "board-model"
version = "0.0.1"
edition = "2021"
publish = false
description = "The typed spine: hand-written board model types (facet and unit newtypes, rule enums, style modules) on model-core and model-derive."

[features]
# Builders for the types of this crate, through the same `try_from` normalize uses.
fixtures = []

[dependencies]
color = { package = "dbt-charts-color", path = "../color" }
d3rs = { path = "../d3rs" }
diagnostic = { path = "../diagnostic" }
indexmap = "2"
model-core = { path = "../model-core" }
model-derive = { path = "../model-derive" }
project = { path = "../project" }
regex = "1"
serde_json = "1"
yaml = { path = "../yaml" }

[build-dependencies]
yaml = { path = "../yaml" }
serde_json = "1"

[dev-dependencies]
board-model = { path = ".", features = ["fixtures"] }
migrate = { path = "../migrate" }
serde_json = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "cascade"
harness = false
