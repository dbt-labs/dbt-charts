[package]
name = "board-types"
version = "0.0.1"
edition = "2021"
description = "Generated serde types for the normalized board seam (D-03). Nothing hand-written: `src/generated.rs` comes from `board.schema.json` via `chart_svg_dev/gen_board_types.py`."

[lib]
# The schema descriptions carry indented text typify emits as doc comments, which rustdoc would compile.
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
