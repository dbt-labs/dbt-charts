[package]
name = "d3rs"
version = "0.0.1"
edition = "2021"
description = "Spike-scoped ports of d3 functions used by dbt charts: d3-path, d3-shape, d3-format, d3-scale (ticks/nice), d3-sankey, and SI-unit utilities."

[dependencies]
display-text = { path = "../display-text" }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
libm = "0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
