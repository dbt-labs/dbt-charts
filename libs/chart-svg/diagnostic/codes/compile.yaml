- code: ERR-UNKNOWN-VARIABLE
  level: error
  title: Unknown variable referenced in template
  template: '{surface} {owner_name!r} references unknown variable {var_name!r}. Declare it
    under `variables:` or fix the typo.'
  doc: Fired when a Jinja template references a variable name that is not declared under `variables:`.
    Check for typos and ensure the variable is declared before the template that uses it.
  docs_topic: variables
- code: ERR-DUPLICATE-VARIABLE-NAME
  level: error
  title: Two boards declare the same variable
  template: 'Duplicate variable name {name!r}: declared in {first} and {second}. Variables
    are global to the board, so delete one and read the other by name, or rename one if they
    are separate controls.'
  doc: 'Fired when a board and a board nested in it, or an imported board, declare the same
    variable. A board has one variable namespace: a nested board reads an outer variable without
    declaring it.'
  docs_topic: variables
- code: ERR-RESERVED-VARIABLE-NAME
  level: error
  title: Variable name is reserved
  template: "Variable name '{name}' is reserved. It conflicts with a dbt charts helper or dbt Jinja builtin. Choose a different name."
  doc: 'Fired when a board declares a variable named like a helper the template context provides: filter, filter_date_range, queries, glob_boards or glob_folders.'
  docs_topic: variables
- code: ERR-TAB-DEFAULT-UNKNOWN
  level: error
  title: tabs.default names no tab
  template: '`tabs.default: {default}` slugs to {slug!r}, which is not a tab on this board
    (tabs: {slugs}).'
  doc: 'Fired when the `default:` of a `tabs:` layout matches no tab title. It is compared
    by slug: the title lowercased with spaces replaced by underscores.'
  docs_topic: layout
- code: ERR-DUPLICATE-QUERY-NAME
  level: error
  title: Two queries share one name
  template: 'Duplicate query name {name!r}: declared in {first} and {second}. Every board
    in a file shares one set of query names, and a query read from another file takes a
    name of its own, so delete one if they are the same query, or rename one and update
    the `query:` of each chart that reads it.'
  doc: Fired when two boards in the same file, a board and one nested in it or two nested
    boards, declare the same query name, or when a query declared on a board is named like
    the key a query read from another file is registered under (`_ximport_<file>_<name>`),
    or when two other files' queries share one such key. A chart on any board in the file
    can read a query declared on any other, so one declaration is enough.
  docs_topic: queries
- code: ERR-DUPLICATE-CHART-NAME
  level: error
  title: Two boards in a file declare the same chart
  template: 'Duplicate chart name {name!r}: declared in {first} and {second}. Every board
    in a file shares one set of chart names, so delete one if they are the same chart, or
    rename one and update the layouts that place it.'
  doc: Fired when two boards in the same file, a board and one nested in it or two nested
    boards, declare the same chart name. A layout on any board in the file can place a chart
    declared on any other, so one declaration is enough.
  docs_topic: charts
- code: ERR-UNKNOWN-QUERY
  level: error
  title: Chart references an unknown query
  template: 'Chart {chart_name!r} references unknown query {query_name!r}. Available queries:
    {available}. Declare the query under `queries:` or fix the typo in `query:`.'
  doc: Fired when a chart's `query:` names a query that is not declared under `queries:` in
    the board or any included meta.yml. Check for typos and ensure the query is declared.
  summary: Fired when a chart's `query:` names a query that isn't declared under `queries:`.
  docs_topic: queries
  hint: suggest_close_query
- code: ERR-UNKNOWN-CHART
  level: error
  title: Chart id is not on the board
  template: 'No chart {chart!r} on this board. Available charts: {available}.'
  doc: Fired when a caller addresses one chart by board path + chart id (`dct render BOARD
    --chart ID`, `dct describe BOARD --chart ID`) and the board declares no chart with that
    id.
  summary: Fired when a board path + chart id names a chart the board doesn't declare.
  docs_topic: charts
  hint: suggest_close_chart
- code: ERR-TEXT-UNKNOWN-QUERY
  level: error
  title: Text references an unknown query
  template: '{surface} references unknown query {query_name!r}. Defined queries: {defined}.'
  doc: Fired when board `text:` or `title:`, or a chart's `title`, `subtitle`, KPI `label`
    or callout `title` or `message`, reads `queries.<name>` for a query that is not defined
    on the board, its `extends:` parents or its imports. Check for typos and declare the query
    under `queries:`.
  summary: Fired when board or chart text reads a query the board does not define.
  docs_topic: board
- code: ERR-TEXT-QUERIES-NONLITERAL
  level: error
  title: Text uses queries without a literal name
  template: Text must reference queries by literal name (queries.<name> or queries['<name>']).
  doc: Fired when board `text:` or `title:`, or chart text, uses `queries` in any way other
    than `queries.<name>` or `queries['<name>']`, such as `queries[var]`, `queries | list`
    or `{% set q = queries %}`. The queries a board reads must be known before it runs.
  summary: Fired when text uses `queries` without a literal query name.
  docs_topic: board
- code: ERR-TEXT-LISTING-NONLITERAL
  level: error
  title: Text lists boards without a literal pattern
  template: '{function} takes exactly one literal string pattern, e.g. {function}(''*'').'
  doc: Fired when board `text:` calls `glob_boards` or `glob_folders` with anything but one
    string literal, or uses the name without calling it. The files a board lists must be known
    before it renders.
  summary: Fired when `glob_boards`/`glob_folders` get a non-literal pattern.
  docs_topic: board
- code: ERR-TEXT-LISTING-PATTERN
  level: error
  title: Invalid board listing
  template: '{function}({pattern!r}): {reason}'
  doc: Fired at compile when `glob_boards`/`glob_folders` is called outside board `text:`
    (a board title or chart text), and at render when a pattern leaves the listing board's
    root (`charts/`) or the board has no file location.
  summary: Fired when a board listing pattern or call site is invalid.
  docs_topic: board
- code: ERR-EXTRA-FIELD
  level: error
  title: Unknown field in board YAML
  template: Unknown field {field_path!r} in board YAML. Remove it or check the schema for
    supported keys.
  doc: Fired when the board YAML contains a field name that the schema does not recognize.
    Remove the unknown field or refer to the YAML reference for the supported keys. A key
    a past grammar renamed, moved, or removed is ERR-RETIRED-FIELD instead. When the key is
    valid in a nearby block (the chart for a key written under `style:`, or the reverse),
    the hint names that block.
  docs_topic: board
- code: ERR-RETIRED-FIELD
  level: error
  title: Retired field in board YAML
  template: '{old!r} at {parent} {history}'
  doc: Fired when the board YAML spells a key a past grammar version renamed, moved, or removed
    and the file could not be migrated automatically (for example it also uses newer keys,
    or both spellings are present). The message names the version that retired the key and
    where it went; the hint says what to change. The params also carry `field_path`, `unknown_field`,
    `parent_path`, `retired_in` and, unless the key was removed, `successor`. The facts come from
    the migration declarations, so every key ever retired stays known.
  docs_topic: board
- code: ERR-HTTP-QUERY-REMOVED
  level: error
  title: '`type: http` queries were removed'
  template: '`type: http` queries were removed. Load the data into your warehouse (for example
    with a connector) and query it with SQL, or use a committed CSV, JSON or Parquet file
    source.'
  doc: 'Fired when a query authors `type: http`, or a `url:` with no type. Load the data into
    the warehouse, for example with a Fivetran connector, or commit the data as a CSV, JSON
    or Parquet file and query it through a file source.'
  summary: 'Fired when a query authors the removed `type: http`.'
  docs_topic: queries
- code: ERR-SQL-LITERAL-NEWLINES
  level: error
  title: SQL contains literal backslash-n from single-quoted YAML
  template: |-
    Query {query_name!r} {field_label} contains literal \n (backslash + n). Use YAML block scalar `{field_label}: |` to write multiline SQL:

      queries:
        my_query:
          {field_label}: |
            SELECT
              col
            FROM t
  doc: 'Fired when a query''s SQL or pre-query string contains a literal backslash followed
    by ''n'', which typically means YAML single-quote escaping swallowed an intended newline.
    Use a YAML block scalar (`field: |`) for multiline SQL to avoid this.'
  docs_topic: queries
- code: ERR-QUERY-DIALECT-MIXED
  level: error
  title: Composed queries declare different dialects
  template: 'Query {query_name!r} (dialect: {dialect}) embeds {{{{ queries.{dep_name} }}}}
    (dialect: {dep_dialect}). Queries composed with {{{{ queries.X }}}} become one statement,
    so they must all declare the same `dialect:`.'
  fix: Set the same `dialect:` on both queries, or on neither. A query that sets none is written
    in its source's own dialect.
  doc: Fired when a query embeds another with `{{ queries.X }}` and the two declare different
    `dialect:` values, counting an unset `dialect:` as a value.
  summary: Fired when a query embeds another query that declares a different `dialect:`.
  docs_topic: queries
- code: ERR-SQL-DATE-LITERAL-VARIABLE
  level: error
  title: Variable quoted as a date/time/timestamp literal will not compile
  template: Query {query_name!r} {field_label} casts a variable with {keyword} '{{{{ {variable}
    }}}}'. This source binds the variable as a query parameter, so its quotes are stripped
    and this compiles to {keyword} $N, which the warehouse does not parse. Use cast('{{{{
    {variable} }}}}' as {keyword}) instead.
  doc: Fired when a query casts a Jinja variable to a date/time/timestamp using the SQL literal
    syntax (`date '{{{{ var }}}}'`) on a source whose adapter binds variables as real query
    parameters (duckdb, sqlite). The parameterizer strips the quotes around every placeholder,
    so `date '{{{{ var }}}}'` compiles to `date $1` -- syntax the warehouse does not accept.
    Other sources (postgres, snowflake, bigquery, dbt_profile, etc.) render variables as inline
    literal text instead, so the same SQL is valid there and this check does not fire. Use
    `cast('{{{{ var }}}}' as date)` (or `time`/`timestamp`) instead, which keeps the variable
    an ordinary string parameter and works on every source.
  docs_topic: queries
- code: ERR-SOURCE-REQUIRED
  level: error
  title: Query has no source configured
  template: 'Query {query_name!r}: SQL queries must have a source. Set it on the query (`source:
    my_db`), or at the board or folder meta.yml level (`source: my_db`).'
  doc: 'Fired when a SQL query has no `source:` set at the query, board, or folder meta.yml
    level and no default source is configured. Set `source: my_db` on the query or as a default
    at a higher level.'
  summary: Fired when a SQL query has no source configured at any level.
  docs_topic: queries
- code: ERR-SOURCE-NOT-FOUND
  level: error
  title: Query references an unknown source
  template: 'Query {query_name!r} references unknown source {source!r}. Available sources:
    {available}. dct sources are declared under `sources:` in your dbt_charts.yml; the source
    name is not the dbt project name.{advice}'
  doc: Fired when a query's `source:` names a source that is not declared in the sources registry.
    Check for typos and ensure the source is declared under `sources:` in your dbt_charts.yml.
    Also includes the execute-side failure of the same name (source lookup at query time).
  docs_topic: queries
  hint: suggest_close_source
- code: ERR-SOURCE-INLINE-FORBIDDEN
  level: error
  title: Inline source definition is not allowed
  template: 'Query {query_name!r}: inline source definitions are not allowed. Reference a
    source by name (`source: my_db`) instead. Got: {offending_value}'
  fix: Use a named source declared under `sources:` in your dbt_charts.yml instead of inline
    connection parameters.
  doc: 'Fired when a query''s `source:` is set to an inline dictionary instead of a named
    source reference. Inline source definitions are forbidden for security reasons: connection
    parameters in the committed YAML would leak credentials. Use a named source declared under
    `sources:`.'
  docs_topic: queries
- code: ERR-FILE-SOURCE-AMBIGUOUS
  level: error
  title: Inline file source path exists at both candidate locations
  template: 'Query {query_name!r}: inline file source {ref!r} exists at both {candidates}.
    Rename or remove one so only a single candidate exists.'
  doc: 'Fired when a query''s inline `source: <path>` ref resolves to a real file at both
    of its two candidate locations, the board''s own directory and the project root (a bare
    path is tried against both anchors so it works from any board depth). dbt charts never
    silently prefers one anchor; move or rename one of the two files so only a single candidate
    remains.'
  docs_topic: queries
- code: ERR-SOURCE-CREDENTIAL-LITERAL
  level: error
  title: Source contains a raw credential literal
  template: 'Source {source_name!r}: field {field!r} holds a raw credential literal. dbt_charts.yml
    is committed to git, so inline secrets leak on push. Reference the secret instead (e.g.
    {field}: {{{{ env_var(''SECRET_NAME'') }}}}), or use a `type: dbt_profile` source that
    delegates to an out-of-repo profiles.yml.'
  doc: Fired when a `sources:` entry in the committed dbt_charts.yml contains a raw secret
    literal (password, API key, etc.). Since dbt_charts.yml is committed to git, inline secrets
    would be leaked on push. Reference the secret via `env_var()` or use a `dbt_profile` source
    type that delegates to an out-of-repo profiles.yml.
  summary: Fired when a `sources:` entry in the committed dbt_charts.yml contains a raw secret
    literal.
  docs_topic: queries
- code: ERR-SOURCE-CONFIG-INVALID
  level: error
  title: Source configuration fails validation
  template: 'Source {source_name!r} in {filename}: {detail}'
  doc: Fired when a `sources:` entry in dbt_charts.yml fails typed SourceConfig validation.
    Check the source definition for missing required fields or invalid values, and refer to
    the sources reference for the expected schema.
  summary: Fired when a `sources:` entry fails typed SourceConfig validation.
  docs_topic: queries
- code: ERR-META-SCHEMA
  level: error
  title: Board fragment contains an unknown or invalid field
  template: 'Board fragment schema error: {message}. Check that all keys are valid board fields.'
  doc: Fired when a meta.yml file or a private (`_`-prefixed) partial contains a field that
    is not recognized by the board schema, or a field with an invalid value. Check that all
    keys match the supported board fields and remove any extras. The offending file is named
    separately, in the diagnostic's `file` location.
  summary: Fired when a board fragment (meta.yml or a private partial) contains a field the
    board schema doesn't recognize.
  docs_topic: board
- code: ERR-PROJECT-CONFIG-SCHEMA
  level: error
  title: dbt_charts.yml contains an unknown or invalid field
  template: 'Project config schema error: {message}. Check that all keys are valid project
    config fields.'
  doc: Fired when dbt_charts.yml (the project config file) contains a top-level field that
    is not recognized (e.g. `style:`, which belongs in charts/meta.yml instead), or a field
    with an invalid value. Check the project config reference for the supported keys.
  summary: Fired when dbt_charts.yml contains a field the project config schema doesn't recognize.
  docs_topic: board
- code: ERR-LOCKED-SCHEMA-VERSION
  level: error
  title: Board file does not match the project's locked schema version
  template: '{message}'
  doc: Fired when dbt_charts.yml sets `locked_schema_version` and a board, its meta.yml, or
    an `extends:` file uses syntax that release does not accept, typically because a newer
    dbt Charts wrote it. Rewrite the file in the locked release's syntax, or raise the lock.
  summary: Fired when a board file uses syntax newer than the project's locked_schema_version.
  docs_topic: board
- code: ERR-CONFIG-KEY-MOVED
  level: error
  title: dbt_charts.yml key moved out of project config
  template: 'dbt_charts.yml key {key!r} has moved: {replacement}'
  doc: 'Fired when dbt_charts.yml sets a key that no longer exists there. Design values (formerly
    under `chart_rendering:`, and the `vega:` block) are theme fields: set the successor named
    in the message under `style:` in charts/meta.yml. Engine constants are not configurable;
    delete the key.'
  summary: Fired when dbt_charts.yml sets a key that moved to the theme or was removed.
  docs_topic: board
- code: ERR-WRONG-SHAPE
  level: error
  title: Field expects a mapping but got a scalar
  template: 'Field {field_path!r} expects a mapping, not a scalar. Provide a YAML block with
    keys: {available_keys}.'
  doc: Fired when a board YAML field that expects a mapping (nested object) receives a plain
    scalar value instead. Provide a YAML block with the appropriate keys.
  docs_topic: board
- code: ERR-UNRESOLVED-REFERENCE
  level: error
  title: Reference points to an unknown name
  template: Reference {ref!r} not found{context}.
  doc: Fired when a chart or layout reference names a target that cannot be found in the current
    board or any included files. Check for typos and ensure the referenced chart, query, or
    layout item is declared.
  docs_topic: queries
  hint: suggest_layout_chart
- code: ERR-BOARD-IMPORT-CYCLE
  level: error
  title: Board files place each other in a circle
  template: 'Board files place each other in a circle: {chain}. Remove one of these references,
    or move what they share into a file neither places.'
  doc: A rows item, or a `charts` fence, can place another board file or Markdown page by
    its path, and that file can place others. When the chain comes back to a file already
    being placed, it would never end, so the board stops here and names the files in order.
  summary: Board files place each other in a circle.
  docs_topic: board
- code: ERR-JINJA-ERROR
  level: error
  title: Jinja template in a query failed to render
  template: 'Jinja template error: {message}'
  doc: Fired when a Jinja template in a query or pre-query raises a rendering error. Check
    the template syntax and ensure all referenced values and filters are available.
  docs_topic: queries
- code: ERR-FILTER-DATE-RANGE-TIMESTAMP
  level: error
  title: filter_date_range was passed the retired timestamp argument
  template: A column with a time zone dates in the board's `regional.time_zone` when
    passed bare, so drop `timestamp=`. A naive column that stores UTC passes `is_naive_utc=true`.
  doc: Fired when `filter_date_range` is called with `timestamp=`. The argument was replaced
    by `is_naive_utc=true`, which dates a naive timestamp column that stores UTC in the board
    zone. A timestamp column with a zone needs no argument.
  docs_topic: variables
- code: ERR-TEMPLATE-OUTPUT-TOO-LARGE
  level: error
  title: Board render's cumulative template output exceeded the cap
  template: This board render's templated fields (queries, titles, markdown, …) emitted more
    than {ceiling} bytes combined, stopping after {emitted_bytes} bytes. This is a render-wide
    cumulative cap, not a per-field one — a nested loop, a runaway variable expansion, or
    genuinely oversized content anywhere in the board can trip it. Reduce the amount of text
    a templated field (or their combination) produces.
  doc: 'Fired when the cumulative bytes emitted by every templated field (queries, titles,
    markdown, chart labels) in one board render exceed the effective `execution.max_template_output_bytes`
    limit — a hard error, not a truncation-with-warning like `WARN-QUERY-RESULT-TRUNCATED`:
    a truncated SVG or SQL string is a corrupt document, never a usable-with-a-caveat result.
    The message names no config key deliberately: the effective limit is the lower of the
    project''s own config value and any deployment ceiling (`DCT_MAX_TEMPLATE_OUTPUT_BYTES_CEILING`),
    so it cannot be raised past the ceiling.'
  summary: Fired when one board render's Jinja-emitted output, summed across every templated
    field, exceeds the effective cap.
  docs_topic: queries
- code: ERR-VALIDATION-FIELD
  level: error
  title: Board YAML field failed Pydantic validation
  template: 'Field {field_path!r}: {pydantic_msg}'
  doc: Fired when a board YAML field fails Pydantic's type or constraint validation, or a
    normalize-stage rule on one field that Pydantic cannot express (a cross-field exclusion,
    a root-only constraint). The message carries the specific error. A missing required field
    lists the fields the block accepts. Check the field value against the schema.
  docs_topic: board
- code: ERR-BAR-Y-NOT-NUMERIC
  level: error
  title: Bar chart y column is not numeric
  template: 'Chart {chart_id!r} (bar): y column {y_field!r} is not numeric. Bar charts always
    plot x as the category and y as the measure, regardless of orientation; use a numeric
    column for y.'
  doc: Fired when a bar chart's `y:` column contains non-numeric data. Bar charts always use
    y as the measure axis regardless of orientation; use a numeric column for y.
  docs_topic: charts
- code: ERR-CHART-CHANNELS-UNBOUND
  level: error
  title: Chart names no channel and its query's columns fit no positional shape
  template: 'Chart {chart_id!r} ({chart_type}) names no {channels}, so its query''s columns
    bind by position: {shapes}. {outcome}'
  fix: Name the family's channels, or select only the columns the chart plots.
  doc: 'Fired when a chart names none of its channels and the query''s column count fits
    none of the family''s positional shapes (for a bar, line or area: 2 columns bind `x`,
    `y`; 3 bind `x`, `color`, `y`), or, for a pie or donut, the query returned no rows to
    bind from. Positional binding reads column order only, dimensions first and the measure
    last, never a column''s name or type.'
  summary: Fired when a chart names no channel and its query's column count fits no positional
    shape.
  docs_topic: charts
- code: ERR-CHART-CHANNELS-INCOMPLETE
  level: error
  title: Chart names some of its channels but not the rest
  template: 'Chart {chart_id!r} ({chart_type}) names {named} but not {missing}. A family''s
    channels are named together: {required}.'
  fix: Name the rest of the set too, or name no column so the query's columns bind by position.
  doc: 'Fired when a chart names one of its channels (`x`, `y`, `color`, `theta`, ...) and
    leaves a required sibling unnamed: a `y` with no `x`, a `color` with no `x` and `y`. A
    field that names a column outside the set (`layers`, `y_start`, `connect`, `multiples`,
    `tooltip`) counts as naming one: binding the rest by position would read that column
    again. So does a `sort`, `support_table` or the chart''s own mark `labels.field` (a board
    or theme cascade is not read) naming a column other than the measure once the query''s
    columns fill an optional channel. Name the set, or name none of it and the query''s
    columns bind by position.'
  summary: Fired when a chart names some of its channels and leaves a required one unnamed.
  docs_topic: charts
- code: ERR-CHART-CHANNELS-NO-QUERY
  level: error
  title: Chart names no channel and has no query to bind them from
  template: 'Chart {chart_id!r} ({chart_type}) names no {channels} and has no query, so there
    are no columns to bind by position.'
  fix: Give the chart a `query:`.
  doc: 'Fired when a chart names none of its channels and has no query: positional binding
    reads the query''s columns, and there are none. Any family that binds by position reaches
    it; a pie, donut or KPI names its one channel (`theta:`, `value:`) to pass instead.'
  summary: Fired when a chart names no channel and has no query to bind its columns from.
  docs_topic: charts
- code: ERR-LAYER-BASELINE-ON-DATE-MEASURE
  level: error
  title: A bar or area layer has no baseline on a date axis
  template: '{field_path} has type {layer_type}, which grows from a baseline, but this bar''s
    value axis holds dates, which have none. Give a bar layer a `y_start` to span two dates,
    or plot the dates as a `scatter` or `line` layer.'
  doc: A bar between two date columns puts dates on its value axis. A layer that grows from
    a zero baseline (a bar without `y_start`, or an area) has no zero on it, so it is refused.
    A layer pinned to its own axis with `axis_y.position` keeps its own numeric scale.
  summary: Bar or area layer without a baseline over a date measure.
  docs_topic: charts
- code: ERR-LAYER-MIXED-AXES-ON-DATE-MEASURE
  level: error
  title: Layers over a date axis cannot mix pinned and unpinned sides
  template: '{field_path}: this bar''s value axis holds dates, and some layers pin `axis_y.position`
    while others do not. A pinned layer gets a numeric scale of its own, so the others'' dates
    would have nowhere to draw. Pin every layer, or none.'
  doc: Layers over a date-measure bar share its date axis unless one pins a side. Pinning
    makes the layers' scales independent, and a date column cannot ride a numeric one.
  summary: Pinned and unpinned layers over a date measure.
  docs_topic: charts
- code: ERR-LAYER-Y-KIND-MISMATCH
  level: error
  title: A layer's y column does not fit the axis it plots on
  template: '{field_path}: column {y_field!r} holds {y_kind} values, but it plots on {axis_where},
    which takes {axis_kind} values. Plot a {axis_kind} column there.'
  doc: 'A layer on a bar''s value axis shares its scale, so its `y` must be the same kind
    as the bar''s: dates over a date measure, numbers over a numeric bar. A layer pinned with
    `axis_y.position` gets a numeric scale of its own. A column of the wrong kind draws no
    marks.'
  summary: Layer y column of the wrong kind for its axis.
  docs_topic: charts
- code: ERR-BAR-Y-START-NULL
  level: error
  title: Bar y_start column has an empty cell
  template: 'Chart {chart_id!r}: bar y_start column {y_start_field!r} is empty in row {row}.
    Every row needs a start; write 0 for a bar that starts at zero.'
  doc: 'Fired when a bar''s or bar layer''s `y_start:` column holds a NULL. A missing start
    is never read as zero: have the query write an explicit 0 for a bar that starts at zero.'
  docs_topic: charts
- code: ERR-BAR-Y-START-KIND
  level: error
  title: Bar y and y_start are different kinds
  template: 'Chart {chart_id!r}: column {y_field!r} is {y_kind} but column {y_start_field!r}
    is {y_start_kind}. A bar''s start and end sit on one value axis: make them all numeric,
    or all dates.'
  doc: Fired when a bar's `y:` and `y_start:` columns (or a bar layer's, against the chart's
    own) are not the same kind. Both must be numeric, or both dates.
  docs_topic: charts
- code: ERR-LINE-CONNECT-NEEDS-NUMERIC-X
  level: error
  title: Line connect needs a numeric x
  template: 'Chart {chart_id!r} (line): connect needs a numeric x, but {x_field!r} is not.
    Connecting points in another column''s order is for paths over two measures; a category
    or date x already has an order.'
  doc: Fired when a line chart sets `connect:` over an x column that is not numeric. A connected
    scatter walks a numeric x out of order; a date or category x has its own order.
  docs_topic: charts
- code: ERR-LINE-CONNECT-ALONE
  level: error
  title: Line connect does not combine with layers or multiples
  template: 'Chart {chart_id!r} (line): connect draws one path through its own rows, so it
    does not combine with layers or multiples. Remove them, or drop connect.'
  doc: Fired when a line chart sets `connect:` beside `layers:` or `multiples:`. A connected
    scatter is one chart over its own rows.
  docs_topic: charts
- code: ERR-LINE-CONNECT-COLUMN-NOT-FOUND
  level: error
  title: Line connect column not found in the query result
  template: 'Chart {chart_id!r} (line): connect column {field!r} is not in the query result.
    Available columns: {available}.'
  doc: Fired when a line chart's `connect:` names a column missing from its query result.
    Check for a typo, or add the column to the query.
  docs_topic: charts
- code: ERR-LINE-CONNECT-NULL
  level: error
  title: Line connect column has an empty cell
  template: 'Chart {chart_id!r} (line): connect column {field!r} is empty in row {row}. Every
    point needs a place in the path.'
  doc: Fired when a line chart's `connect:` column holds a NULL. A point with no order has
    no place in the path; filter the row out or fill it in the query.
  docs_topic: charts
- code: ERR-LINE-Y-NOT-NUMERIC
  level: error
  title: Line chart y column is not numeric
  template: 'Chart {chart_id!r} (line): y column {y_field!r} is not numeric. Line charts always
    plot x as the dimension and y as the value; use a numeric column for y.'
  doc: Fired when a line chart's `y:` column contains non-numeric data. Line charts always
    use y as the value axis; use a numeric column for y.
  docs_topic: charts
- code: ERR-ANNOTATION-INVALID
  level: error
  title: Annotation cannot be resolved against the chart
  template: 'Chart {chart_id!r}: annotation {index}: {reason}.'
  doc: 'Fired when an annotation does not fit the chart it is on: an anchor whose value does
    not match the axis column''s type, an aggregate or fit the axis cannot take, a missing
    or unknown `series`, a range whose `from` is past its `to`, or text that does not render.'
  summary: Fired when an annotation does not fit the chart it is on.
  docs_topic: charts
- code: ERR-SCATTER-MULTI-Y-NOT-NUMERIC
  level: error
  title: Scatter chart multi-metric y column is not numeric
  template: 'Chart {chart_id!r} (scatter): y: [...] column {y_field!r} is not numeric. A single
    y: column may be categorical (a dot plot), but every measure in a y: [...] list is folded
    onto one numeric axis; use numeric columns.'
  doc: 'Fired when a scatter chart''s y: [a, b] list contains a non-numeric column. A single
    y: column may be categorical (a dot plot), but a list y: folds every measure onto one
    shared numeric axis, so each measure must be numeric.'
  docs_topic: charts
- code: ERR-AREA-ENCODING-SWAPPED
  level: error
  title: Area chart x/y encoding looks swapped
  template: 'Chart {chart_id!r} (area): {reason} Area charts always plot x as the dimension
    and y as the value; there is no orientation knob to rotate an area chart, so a swapped
    x/y silently bakes a broken axis.'
  doc: 'Fired when an area chart''s encoding looks incorrect: either y is non-numeric (should
    be the measure), or x is a numeric measure with stack enabled. Area charts always plot
    x as the dimension and y as the value; there is no orientation knob.'
  docs_topic: charts
- code: ERR-LAYER-AXIS-STYLE-WITHOUT-POSITION
  level: error
  title: A layer styles a y axis it does not have
  template: '{field_path} sets a color or grid style, but no layer on this chart pins `axis_y.position`,
    so every layer shares the base chart''s y axis. Pin `axis_y.position` on a layer to give
    it its own axis, or style the shared axis under `style.axis_y`.'
  doc: A layer's `axis_y.color` and its `axis_y.grid` color, width, dash and opacity style
    that layer's own y axis, which exists only once some layer pins a side.
  summary: A layer styles its own y axis, but no layer pins a side.
  docs_topic: charts
- code: ERR-LAYER-AXIS-TITLE-WITHOUT-POSITION
  level: error
  title: A layer's y-axis title has no axis of its own to land on
  template: '{field_path} sets a title, but no layer on this chart pins `axis_y.position`,
    so every layer shares the base chart''s y axis and a layer title has nowhere to go. Pin
    `axis_y.position` on a layer of a vertical base chart to give it its own axis, or drop
    the layer `axis_y.title`.'
  doc: A layer's `axis_y.title` names that layer's own y axis. A layer only gets its own axis
    when some layer pins `axis_y.position` to a side; until then all layers share the base
    chart's axis, which has a single title slot that several layers could claim. Pin a side
    to split the axes, or remove the layer title.
  summary: Layer `axis_y.title` set on a chart whose layers share one y axis.
  docs_topic: charts
- code: ERR-AXIS-COLOR-AUTO-NO-INK
  level: error
  title: Axis color 'auto' has no single series color to take
  template: '{field_path} is ''auto'', but {reason}, so there is no one color for the axis
    to take. Name a color instead, or give the axis one series.'
  doc: '`color: auto` on a y axis paints its grid lines, tick labels and title in the color
    of the one series drawn against it. An axis that holds several series, or a series colored
    by a field, has no single color.'
  summary: 'Axis `color: auto` on an axis without exactly one series color.'
  docs_topic: charts
- code: ERR-LAYER-OUTSIDE-PINNED-DOMAIN
  level: error
  title: A line layer lies wholly outside the chart's pinned y domain
  template: Chart {chart_id!r} pins axis_y.scale.continuous.domain={domain!r}, but {layer} has
    values only from {low} to {high}, so none of it can be drawn. Widen or drop the chart's
    domain.
  doc: Fired when a chart pins `axis_y.scale.continuous.domain` and a line layer on the same
    y axis has every value outside that range. The layer would paint off the plot, leaving
    it blank. Widen or drop the chart-level domain.
  summary: Fired when a line layer's values all fall outside the chart's pinned y domain.
  docs_topic: charts
- code: ERR-LAYERS-AMBIGUOUS-Y-DOMAIN
  level: error
  title: Chart-level y domain is ambiguous with independent layer scales
  template: Chart {chart_id!r} sets axis_y.scale.continuous.domain={domain!r} but a layer
    pins its y axis to one side, so the chart has two independent y scales and one chart-level
    domain cannot apply to both. Remove the chart-level axis_y.scale.continuous.domain and
    set axis_y.scale.domain on each layer's own axis_y; the base series' domain cannot be
    pinned once a layer sets axis_y.position.
  doc: Fired when a chart sets `axis_y.scale.continuous.domain` at the chart level and any
    layer pins its y axis to a side with `axis_y.position`. The base chart takes the opposite
    side, so the chart has two independent y scales and a single chart-level domain is ambiguous.
    Remove the chart-level `axis_y.scale.continuous.domain` and set `axis_y.scale.domain`
    on each layer's own `axis_y`; the base series' domain cannot be pinned once a layer sets
    `axis_y.position`.
  summary: Fired when a chart sets a chart-level y-axis domain but a side-pinned layer gives
    it two independent y scales.
  docs_topic: charts
- code: ERR-SUPPORT-TABLE-POSITION-INVALID
  level: error
  title: style.support_table.position is invalid for the chart's orientation
  template: '{message}'
  doc: Fired when `style.support_table.position` names a side the chart's own category-axis
    orientation can't place. A horizontal category axis (vertical bar, line, area) only accepts
    `top`/`bottom`; a vertical one (a horizontal bar) only accepts `left`/`right`. The message
    carries the specific value and orientation.
  summary: Fired when `style.support_table.position` names a side the chart's category-axis
    orientation cannot place.
  docs_topic: charts
- code: ERR-SUPPORT-TABLE-LABEL-IGNORED
  level: error
  title: 'support_table per_series label: names nothing in this layout'
  template: '{message}'
  doc: 'Fired when a `per_series:` entry without `by_measure: true` sets `label:` on a chart
    whose strip rows (vertical bar, line, area) or per-series columns (stacked horizontal
    bar) are named by the color field''s series values, so the label would be silently dropped.
    A horizontal grouped bar''s single per_series column still takes its header from `label:`.
    Remove the label; series names come from the color field and legend.'
  summary: Fired when a `per_series:` support_table entry sets `label:` on a layout that names
    its rows or columns by series.
  docs_topic: charts
- code: ERR-BAR-LOG-SCALE-NOT-SUPPORTED
  level: error
  title: Log scale is not supported on bar charts
  template: 'Chart {chart_id!r} (bar): axis_y.scale.continuous.type: log is not supported:
    a bar''s length encodes magnitude from zero, which a log scale makes meaningless. Use
    axis_y.scale.continuous.type: symlog on the bar chart, or switch to a line or area chart
    for a log scale.'
  doc: 'Fired when a bar chart''s y axis is set to `axis_y.scale.continuous.type: log`. A
    bar''s length encodes magnitude from zero, which a log scale makes meaningless. Use `axis_y.scale.continuous.type:
    symlog` on the bar chart, or switch to a line or area chart for a log scale.'
  summary: Fired when a bar chart's y-axis uses a log scale, which magnitude-from-zero bars
    can't represent.
  docs_topic: charts
- code: ERR-TICKS-COUNT-REQUIRES-NON-LOG-SCALE
  level: error
  title: ticks.count is not supported with log scale
  template: 'Chart {chart_id!r}: axis_y.ticks.count is not supported with scale.type: log:
    a target tick count on a log axis is nonsense; Vega-Lite computes log-decade ticks natively.
    Remove ticks.count.'
  doc: 'Fired when `axis_y.ticks.count` is combined with `axis_y.scale.type: log`. A target
    tick count on a log axis is meaningless because Vega-Lite computes log-decade ticks natively.
    Remove `ticks.count`.'
  summary: Fired when a target tick count is combined with a log y-axis scale.
  docs_topic: charts
- code: ERR-LOG-SCALE-REQUIRES-POSITIVE-DATA
  level: error
  title: Log scale requires strictly positive data
  template: 'Chart {chart_id!r}: column {y_field!r} has a value <= 0, but axis_y.scale.type:
    log requires strictly positive data; a log domain is undefined at and below zero. Filter
    out the non-positive rows, or drop the log scale.'
  doc: 'Fired when `axis_y.scale.type: log` is used but the y column contains a value ≤ 0.
    A log domain is undefined at and below zero. Filter out the non-positive rows, or drop
    the log scale.'
  summary: Fired when a log y-axis scale is used but the data contains a value at or below
    zero.
  docs_topic: charts
- code: ERR-LOG-SCALE-REQUIRES-POSITIVE-X-DATA
  level: error
  title: Log x scale requires strictly positive data
  template: 'Chart {chart_id!r}: column {x_field!r} has a value <= 0, but axis_x.scale.type:
    log requires strictly positive data; a log domain is undefined at and below zero. Filter
    out the non-positive rows, or drop the log scale.'
  doc: 'Fired when `axis_x.scale.type: log` is used but the x column contains a value ≤ 0.
    A log domain is undefined at and below zero. Filter out the non-positive rows, or drop
    the log scale.'
  summary: Fired when a log x-axis scale is used but the data contains a value at or below
    zero.
  docs_topic: charts
- code: ERR-MULTIPLES-FIELD-NOT-FOUND
  level: error
  title: multiples partition field not found in the query result
  template: 'multiples field(s) {fields} not found in the query result. Available columns:
    {available}.'
  doc: Fired when `multiples.rows` or `multiples.columns` names a column that is not present
    in the chart's query result. Check for a typo, or add the column to the query.
  summary: Fired when a multiples partition field is not a column of the query result.
  docs_topic: charts
- code: ERR-SORT-FIELD-NOT-FOUND
  level: error
  title: sort.by column not found in the query result
  template: 'sort.by column {field!r} not found in the query result. Available columns: {available}.'
  doc: Fired when `sort.by` names a column that is not present on every row of the chart's
    query result. Without it the chart would render in natural order while claiming to be
    sorted. Check for a typo, or add the column to the query.
  summary: Fired when sort.by names a column missing from the query result.
  docs_topic: charts
- code: ERR-FIELD-LABELS-FIELD-NOT-FOUND
  level: error
  title: field_labels key names no column the chart reads
  template: 'field_labels key(s) {fields} name no column of the chart''s query. Available
    columns: {available}.'
  doc: Fired when a `field_labels` key is neither a column of the chart's query result nor
    a field one of its layers names. The label would never paint. Check for a typo, including
    letter case.
  summary: Fired when a field_labels key names no column the chart reads.
  docs_topic: charts
- code: ERR-FIELD-LABELS-WIDE-COLLISION
  level: error
  title: field_labels gives two wide measures the same label
  template: field_labels makes measures {measures} of `y:` share the label {label!r}, so their
    series cannot be told apart.
  doc: 'Fired when a `field_labels` entry for a `y: [...]` measure equals another measure''s
    label. Derived labels fall back to the raw column name on a collision; an authored label
    never does. Give each measure distinct text.'
  summary: Fired when field_labels gives two wide measures the same label.
  docs_topic: charts
- code: ERR-MULTIPLES-VALUE-COLLISION
  level: error
  title: two distinct multiples values stringify to the same panel key
  template: 'multiples field {field!r}: values {previous!r} and {value!r} both stringify to
    {canonical!r}; rename one to disambiguate.'
  doc: Fired when `multiples.rows` or `multiples.columns` names a column whose distinct values
    collide once canonicalized to a string panel key (e.g. the string `'1'` and the integer
    `1`). Merging them into one panel would silently combine two genuinely distinct groups.
    Rename one value so the two panel keys stay distinct.
  summary: Fired when two distinct multiples partition values canonicalize to the same panel
    key.
  docs_topic: charts
- code: ERR-MULTIPLES-SELF-CROSSED
  level: error
  title: multiples.rows and multiples.columns name the same field
  template: multiples.rows and multiples.columns both name {field!r}. Only the diagonal of
    the resulting grid can ever hold a row; the rest are structurally empty, whatever the
    data says.
  doc: Fired when `multiples.rows` and `multiples.columns` name the same column. Crossing
    a field with itself builds a panel grid where a row of data can only ever land on the
    diagonal (the row's value matches itself); every other cell in the grid is guaranteed
    empty. Name a different column for `rows` or `columns`, or drop one of them and keep a
    single-direction partition.
  summary: Fired when multiples.rows and multiples.columns name the same field.
  docs_topic: charts
- code: ERR-AREA-STACKED-LOG-SCALE-NOT-SUPPORTED
  level: error
  title: Stacked area and log scale are incompatible
  template: 'Chart {chart_id!r} (area): `style.stack: {stack}` with axis_y.scale.type: log
    is not supported: a stacked band''s top encodes a cumulative sum, which a log scale can''t
    represent (the baked domain would be computed from unstacked values and clip the real
    stacked extent). Use `stack: none`, or drop the log scale.'
  doc: 'Fired when a stacked area chart (`style.stack: zero/normalize/center`) is combined
    with `axis_y.scale.type: log`. A cumulative stack top is meaningless on a log scale. Use
    `stack: none`, or drop the log scale.'
  summary: Fired when a stacked area chart is combined with a log y-axis scale.
  docs_topic: charts
- code: ERR-AREA-LOG-SCALE-INDEPENDENT-MULTIPLES
  level: error
  title: Log-scale area and independent-scale multiples are incompatible
  template: 'Chart {chart_id!r} (area): axis_y.scale.type: log with multiples scale: independent
    is not supported: the explicit domain area bakes on a log scale (to avoid Vega-Lite''s
    degenerate log-area rendering) is computed once from every panel''s data combined, so
    it would apply the same domain to every panel regardless of scale: independent. Use multiples
    scale: shared, or drop the log scale.'
  doc: 'Fired when an area chart authors both `axis_y.scale.type: log` and `multiples: {scale:
    independent}`. Area on a log scale needs an explicit baked domain to avoid Vega-Lite''s
    degenerate rendering (see ERR-AREA-STACKED-LOG-SCALE-NOT-SUPPORTED''s sibling note), but
    that domain is necessarily one shared value; baking it would contradict `scale: independent`''s
    promise of a per-panel domain, and suppressing it would silently reintroduce the degenerate
    rendering. Use `scale: shared`, or drop the log scale.'
  summary: 'Fired when a log-scale area chart also authors multiples: {scale: independent}.'
  docs_topic: charts
- code: ERR-AREA-STACKED-MARK-STYLE-CLEARED
  level: error
  title: marks.area.stacked was cleared to null
  template: 'Chart {chart_id!r} (area): `marks.area.stacked` resolved to null. Stacked and
    single-series area charts both need this recipe -- a single-series area takes it in full
    even when the chart itself isn''t stacked -- but a board or chart in this chart''s style
    cascade authored `marks.area.stacked: null` explicitly, which clears the inherited theme
    default instead of leaving it alone. Remove that null override.'
  doc: 'Fired when `marks.area.stacked` resolves to null after the style cascade. Every built-in
    theme declares this key, so the only way to reach null is a board or chart explicitly
    authoring `marks.area.stacked: null` -- which clears the inherited value rather than leaving
    it untouched. Remove the null override.'
  summary: Fired when a board or chart clears the area stacked recipe to null.
  docs_topic: charts
- code: ERR-AREA-STACKED-STROKE-INCOMPLETE
  level: error
  title: marks.area.stacked.stroke is missing, or lacks width, cap or join
  template: 'Chart {chart_id!r} (area): `marks.area.stacked.stroke` must declare `width`,
    `cap` and `join`. Stacked and single-series area charts replace `marks.line.stroke` with
    it wholesale, so a property it omits is dropped rather than inherited and the edge falls
    back to SVG butt/miter, spiking each vertex. Set all three explicitly (`cap: butt` for
    the renderer''s own default).'
  doc: Fired when the area stacked recipe's stroke is null or is missing a width, cap or join,
    usually because a board or chart authored one of them as null. The recipe's stroke replaces
    the top-edge line stroke wholesale rather than merging into it, so an omitted property
    is not inherited. Set width, cap and join explicitly.
  summary: Fired when the area stacked recipe's stroke is null or omits width, cap or join.
  docs_topic: charts
- code: ERR-NO-BOARD-FILES
  level: error
  title: A path holds no board files
  template: 'No board files found in {path}. Pass a `.yml`, `.yaml` or `.md` board file, or
    a folder that holds one. A `.svg.j2` chart template is not a board: validate a board that
    uses it.'
  doc: 'Fired when `dct validate` or `dct describe` is pointed at a path with no board under
    it: a missing or empty folder, or one that holds only chart templates.'
  docs_topic: board
- code: ERR-FILE-NOT-FOUND
  level: error
  title: File not found
  template: 'File not found: {path}. Check the path for typos.'
  doc: Fired when a file path given to a dbt charts verb does not exist on the filesystem.
    Check for typos in the path and ensure the file exists.
  docs_topic: errors
- code: ERR-PATH-OUTSIDE-PROJECT
  level: error
  title: Board path is outside the project
  template: Board path {path} is outside the project root.
  doc: Fired when a board path given to a dbt charts verb resolves outside the project root.
    Pass a path to a board inside the project, or run the verb from the project that owns
    the board.
  docs_topic: errors
- code: ERR-EMPTY-YAML-DOCUMENT
  level: error
  title: YAML document is empty
  template: 'Empty YAML document: {path}.'
  doc: 'Fired when a board file''s content is empty, contains only comments, or parses to
    a null/blank YAML document. A genuinely empty board file needs at least a minimal board
    mapping, or should be removed. A `dct init` scaffold''s `meta.yml`/`meta.yaml` given directly
    to a verb that expects a board is a different case: don''t add a mapping or delete it.
    The defaults file is meant to stay empty or comment-only. Pass a real board file to the
    verb instead.'
  summary: Fired when a board file's content is empty or contains only comments.
  docs_topic: errors
- code: ERR-YAML-SYNTAX
  level: error
  title: YAML syntax error
  template: 'Invalid YAML syntax in {source}{where}: {problem}{quoted_line}'
  fix: 'Fix the line quoted above. The usual cause is a string that contains a colon followed
    by a space, or starts with a special character (`*`, `&`, `!`, `%`, `@`, `[`, `{`): wrap
    the whole value in quotes, for example `title: "Ten largest occupations in 1950: rank
    and workers"`.'
  doc: 'Fired when a board file, or a file it `extends:`, is not valid YAML. The message names
    the file, the line and column, and the offending line. The common authored mistake is
    an unquoted colon inside a title or note, such as `title: Largest in 1950: rank`, which
    YAML reads as a nested mapping; another is a flow sequence holding an unquoted `[` (`palette:
    [category[2]]`; quote it as `palette: ["category[2]"]`). For the colon the rest of the
    report comes from a copy of the file with the line quoted (the file is not changed and
    the board still does not render), so the schema and query errors appear in the same pass;
    any other syntax error is the only one reported until it is fixed.'
  summary: Fired when a board file or an `extends:` file is not valid YAML.
  docs_topic: errors
- code: ERR-NOTHING-TO-RENDER
  level: error
  title: None of the paths given is a board
  template: 'Nothing to render: none of the paths given is a board.'
  doc: Fired when `dct render` has no board left to render after skipping the paths that are
    not boards. Each skipped path gets its own warning saying why. Pass at least one board
    file.
  summary: Fired when none of the paths given to dct render is a board.
  docs_topic: board
- code: ERR-UNKNOWN-WARNING-CODE
  level: error
  title: --ignore-warning names an unregistered code
  template: 'unknown warning code: {code!r}'
  doc: 'Fired when `dct render --ignore-warning` names a code that is not a registered warning
    code: usually a typo or a stale suppression. Check the code against the warning reference.'
  summary: Fired when --ignore-warning names a code that isn't registered.
  docs_topic: errors
- code: WARN-RETIRED-IGNORE-CODE
  level: warning
  title: Ignore list names a retired warning code
  template: '{source}: {code} no longer exists and suppresses nothing'
  fix: Remove it from the ignore list.
  doc: Fired when `dct render --ignore-warning`, a chart's `warnings_ignore` or a query's
    `ignore` names a warning code an earlier release shipped and a later one removed. The
    code can no longer fire, so the entry is dead weight rather than a typo, and the render
    proceeds.
  summary: Fired when an ignore list names a retired warning code.
  docs_topic: board
- code: ERR-IGNORE-ERROR-CODE
  level: error
  title: --ignore-warning names an error code
  template: 'cannot ignore {code!r}: it is an error code, not a warning code'
  doc: Fired when `dct render --ignore-warning` names an error code. Only warnings can be
    suppressed; fix the board to clear an error.
  summary: Fired when --ignore-warning names an error code.
  docs_topic: errors
- code: ERR-TICKS-INTERVAL-MEASURE-AXIS
  level: error
  title: ticks.time_unit is not supported on the measure axis
  template: 'style.axis_y.ticks.time_unit/step is not supported: the measure axis (axis_y)
    is never temporal in dbt charts'' cartesian model, and its tick ladder is computed from
    ticks.count. Use axis_y.ticks.count here; ticks.time_unit/step apply to axis_x.'
  doc: Fired when `style.axis_y.ticks.time_unit` or `step` is set. The measure axis (axis_y)
    is never temporal in dbt charts' cartesian model, and its tick ladder is computed from
    `ticks.count`. Use `axis_y.ticks.count` here; `ticks.time_unit/step` apply to `axis_x`.
  summary: Fired when `ticks.time_unit` or `step` is set on the measure axis, which is never
    temporal.
  docs_topic: charts
- code: ERR-PALETTE-UNKNOWN
  level: error
  title: Palette name is not a theme palette role or a shipped palette
  template: Unknown palette {name!r} (authored as {authored!r}) at {field_path}. Palette roles
    are theme-scoped, resolved only from a theme's `palettes:` block; this name is not a role
    the active theme binds, and not a shipped dbt charts palette.
  doc: 'Fired when an authored `palette:` string names neither a role in the theme''s `palettes:`
    block (`category`, `sequence`) nor a shipped dbt charts palette (`editorial-10`). Roles
    are theme-scoped; board- and chart-level `style:` cannot author one, only a palette name.
    Checked in two places: once the theme cascade is complete (a theme''s own `palettes:`
    binding), and once each board/chart is normalized (every other palette field); both are
    the first point a role name can be told apart from a typo at that scope.'
  summary: Fired when `palette:` names no known theme role or shipped palette.
  docs_topic: charts
  hint: suggest_close_palette
- code: ERR-PALETTE-UNUSABLE
  level: error
  title: A shipped palette cannot be used as written
  template: 'Palette {authored!r} at {field_path} cannot be used as written: {reason}'
  doc: 'Fired when an authored `palette:` names a palette that exists but not in the form
    written: more stops requested than the palette has (`vivid-10:14`), a tone or pattern
    palette where color stops are expected, or a surface the palette cannot carve. The
    reason is the palette resolver''s own message and names what to change. A name that
    matches no palette is ERR-PALETTE-UNKNOWN instead.'
  summary: Fired when a known palette is requested in a form it cannot supply.
  docs_topic: charts
- code: ERR-PALETTE-STYLE-INVALID
  level: error
  title: A board's categorical palette cannot be used as written
  template: 'The categorical palette in `style.charts.color.categorical` cannot be used as written: {reason}'
  doc: 'Fired when a board-level `style.charts.color.categorical` palette or single-series palette names a shipped palette in a form it cannot supply, such as more stops than the palette has (`vivid-10:14`). The reason is the palette resolver''s own message and names what to change.'
  summary: Fired when a board style''s categorical palette is requested in a form it cannot supply.
  docs_topic: charts
- code: ERR-PALETTE-REBIND-UNSATISFIED
  level: error
  title: A palette role is rebound to a palette of the wrong family
  template: '{field_path} is set to {bound!r}, a {family} palette, but this role needs a {required}
    palette.'
  doc: Fired when a board or project layer rebinds `category`, `sequence`, or `diverge` under
    `style.palettes` to a palette of another family. Themes read `category` as an ordered
    categorical stop list and `sequence`/`diverge` as continuous ramps, so each role accepts
    one family, on every theme alike. Bind a categorical palette to `category`, a sequential
    one to `sequence`, and a diverging one to `diverge`.
  summary: Fired when `style.palettes.category`, `sequence`, or `diverge` names a palette
    of the wrong family.
  docs_topic: charts
- code: ERR-UNKNOWN-THEME
  level: error
  title: Theme name is not a built-in theme
  template: 'Unknown theme {theme!r}. Available built-in themes: {available}.'
  doc: 'Fired during board validation when `theme:`, or a plain (non-path) `extends:` entry,
    names something that is not a built-in theme. Without it the name is dropped and the board
    renders on the default theme with no sign the request was ignored. Raised at positions
    where nothing resolves the entry as a board: a standalone or in-memory compile, and any
    nested board. A project board compiled through its file gets ERR-EXTENDS-UNRESOLVED from
    the extends layer instead, which can also report the board lookup it tried.'
  summary: Fired when `theme:` names something that is not a built-in theme.
  docs_topic: board
  hint: suggest_close_theme
- code: ERR-THEME-AND-EXTENDS
  level: error
  title: 'Board sets both theme: and extends:'
  template: 'Cannot set both ''theme: {theme}'' and ''extends:''; ''theme:'' is shorthand
    for ''extends:''. Use one key: extends: {combined}'
  doc: 'Fired when a board or board fragment authors both `theme:` and `extends:`. `theme:
    X` is sugar for `extends: X`, so the two would compete for one slot. List the theme first
    in `extends:`, lowest priority, ahead of the boards it already extends.'
  summary: Fired when a board authors both `theme:` and `extends:`.
  docs_topic: board
- code: ERR-LEGEND-ALIGN-WITH-ENDPOINTS
  level: error
  title: Legend align does not apply to endpoint labels
  template: '`legend.position.align` is set beside `edge: endpoints`, which names each series on
    the chart instead of placing a legend along an edge, so there is nothing to align. Remove `align`,
    or use a side edge (`left`, `right`, `top` or `bottom`).'
  doc: 'Fired when one `legend.position` mapping authors `edge: endpoints` and an `align` other than
    `auto`. Endpoint labels ignore an `align` inherited from another tier or file, but it must still
    name a placement the legend supports.'
  summary: 'Fired when `align` is authored beside `edge: endpoints`.'
  docs_topic: charts
- code: ERR-LEGEND-OVERLAY-WITH-ENDPOINTS
  level: error
  title: Legend overlay does not apply to endpoint labels
  template: '`legend.position.overlay` is set beside `edge: endpoints`, which names each series on
    the chart in a strip of its own instead of placing a legend. Remove `overlay`.'
  doc: 'Fired when one `legend.position` mapping authors `edge: endpoints` and an `overlay` other
    than `auto`. Endpoint labels ignore an `overlay` inherited from another tier or file, but it
    must still name a placement the legend supports.'
  summary: 'Fired when `overlay` is authored beside `edge: endpoints`.'
  docs_topic: charts
- code: ERR-EXTENDS-UNRESOLVED
  level: error
  title: extends entry names neither a theme nor a board
  template: 'Unresolvable `theme:`/`extends:` value {entry!r}: not a built-in theme, and no
    board by that name at the project root. Use a built-in theme, a project-root board name,
    or a relative path such as `./base.yaml`. Available built-in themes: {available}.'
  doc: 'Fired by the extends layer when a board''s `extends:` entry resolves to nothing: not
    a built-in theme, and no matching `.yaml`/`.yml` at the project root. This is the project
    lane''s counterpart to ERR-UNKNOWN-THEME; it fires only where the board lookup was actually
    attempted, so it can offer that lookup as a fix.'
  summary: Fired when an `extends:` entry names neither a theme nor a board.
  docs_topic: board
  hint: suggest_close_extends
- code: ERR-FORMAT-INVALID
  level: error
  title: Format spec is not a predefined name, a style.formats alias, or a valid d3-format/d3-time-format
    spec
  template: 'Unknown {kind_noun} format {spec!r} at {field_path}: {explanation}'
  doc: Fired when an authored `format:` string is not one of the engine's predefined format
    names (e.g. `currency`, `number`, `percent_number`), not a key defined in `style.formats`,
    and fails to parse as a d3-format spec. Check for typos against the predefined names or
    your `style.formats` keys, or use a valid d3-format spec (https://d3js.org/d3-format).
    In a slot that accepts a raw strftime spec (`%b %Y`), the same code also fires for a directive
    the engine does not implement (`%K`); the message names the accepted directives.
  summary: Fired when `format:` is not a predefined name, alias, or valid spec.
  docs_topic: charts
  hint: suggest_close_format
- code: ERR-REGIONAL-NESTED-MISMATCH
  level: error
  title: A nested board's regional differs from its root board's
  template: '{board} sets regional {authored}, but the board it is nested in uses {root}.
    A board and everything nested in it write numbers and dates one way; remove the nested
    `regional:` or make it match.'
  doc: Fired when a nested board (inline or imported) authors a `regional:` number locale,
    time locale or currency that differs from the root board's. One page reads numbers and
    dates in one locale and one currency, so nested boards take the root's `regional:`. Set
    it on the root board or in `charts/meta.yml`.
  summary: Fired when a nested board's `regional:` differs from its root's.
  docs_topic: charts
- code: ERR-LINKS-NESTED
  level: error
  title: A nested board authors links
  template: '{board} sets `links:`, but only the root board does. A board and everything nested
    in it link and open links one way; move `links:` to the root board.'
  doc: Fired when a nested board (inline or imported) authors a `links:` block. `links.auto`
    and `links.open` apply to the whole page, so they are set once, on the root board or in
    `charts/meta.yml`.
  summary: Fired when a nested board authors `links:`.
  docs_topic: charts
- code: ERR-FONT-UNKNOWN
  level: error
  title: Font name is not an entry in style.fonts
  template: '{message}'
  doc: 'Fired when a font slot or a `style.fonts` entry names a font (`font: label`, `font:
    {extends: label}`, `fonts.h2: {extends: heading}`) that `style.fonts` does not define.
    The message lists the known names. Define the font under `style.fonts`, or fix the name.'
  summary: Fired when a font name is not defined in `style.fonts`.
  docs_topic: charts
- code: ERR-FONT-REGISTRY
  level: error
  title: style.fonts entries do not resolve
  template: '{message}'
  doc: Fired when `style.fonts` entries extend one another in a cycle (`a` extends `b` extends
    `a`; the message names the path), when `heading` or `section` sets or inherits a `size`
    (they take the `sizes` ramp, never `size`), or when any other font sets `sizes`. Break
    the cycle, extend a font that sets no size, or use the field the font takes.
  summary: Fired when `style.fonts` entries form a cycle or set the wrong size field.
  docs_topic: charts
# These members hold whole-number values, so a bare d3 percent spec
# paints them 100x too large: the remedy names the division, never
# ".1%" on its own.
- code: ERR-FORMAT-NATIVE-IN-VEGA-SLOT
  level: error
  title: Native formatter used in a Vega-rendered format slot
  template: 'Format {spec!r} at {field_path} is a native formatter with no Vega arm and cannot
    be used in Vega-rendered slots (axis labels, mark value labels, support_table, heatmap
    and map tooltips). Move it to a table cell (or a KPI value, for the percent names), or
    transform the value in the query to match a plain d3 spec (for a whole-number percent,
    divide by 100 and then use a d3 percent spec such as ".1%"). Valid alternatives: {available}.'
  doc: 'Fired when a native name appears in a Vega-rendered format slot it cannot paint: `percent_number`,
    `percent_number_delta` and `percentage_points_delta` anywhere Vega paints (axis label,
    mark value-label format), and every native (`duration` and `bytes` too) in a support_table
    format or a heatmap or map tooltip. These names bypass d3 entirely and are only valid
    in Python-rendered slots (KPI headline and table cells). To keep the value in a Vega-rendered
    slot, transform it in the query to match a plain d3 spec: for a whole-number percent,
    divide by 100 and then use a d3 percent spec such as `.1%`.'
  summary: Python-only native formatter used in a Vega-rendered slot.
  docs_topic: charts
# No hint_generator: only an exact predefined name from the other half
# reaches this raise, so the input domain is the vocabulary itself and no
# member of it is a near-miss for the other half. The message names the
# legal values outright instead.
- code: ERR-FORMAT-KIND-MISMATCH
  level: error
  title: A redefined format name has the wrong kind
  template: 'Format {spec!r} at {field_path} is not a {kind} format. This name takes only
    a {kind} spec; the engine''s {kind} names are: {available}. {escape_hatch}'
  doc: 'Fired when `style.formats` redefines an engine format name as a spec of the other
    kind: a number name (`currency`, `percent`) must stay a number spec and a date name (`date_short`)
    a strftime spec, because every slot that reads the name expects its kind. A number spec
    baked onto a date axis paints garbage tick labels rather than failing. A plain `format:`
    slot is judged by the column it paints and takes either.'
  summary: An engine format name redefined as a spec of the other kind.
  docs_topic: charts
- code: ERR-FORMAT-TEXT-IN-VEGA-SLOT
  level: error
  title: Text format name used in a Vega-rendered format slot
  template: Format {spec!r} at {field_path} is a text format and cannot be used in Vega-rendered
    slots (axis labels, mark value labels, support_table). Use it on a table column or KPI
    value; a number or date slot takes a number or time name or a d3 spec.
  doc: Fired when `email` or `url` appears in a slot Vega paints. They name text a table cell
    or KPI value links, and have no number or date spec for Vega to apply.
  summary: '`email` / `url` is not a number or time format for a Vega slot.'
  docs_topic: charts
- code: ERR-FORMAT-TEXT-REDEFINED
  level: error
  title: A text format name cannot be redefined
  template: '`{field_path}` redefines the engine''s text format {name!r}. {name!r} is a text
    format with no spec; it cannot be redefined.'
  doc: Fired when `style.formats` has a key named `email` or `url`. Those names format a value
    as itself and mark the column as an email address or a web URL, so a table cell or KPI
    value can link it. They carry no spec for an alias to replace. Pick another alias name
    for your own spec.
  summary: '`style.formats.email` / `style.formats.url` cannot be redefined.'
  docs_topic: charts
- code: ERR-QUERY-FORMAT-SPEC
  level: error
  title: 'A query''s formats: value is a format spec, not a format name'
  template: 'Query {query!r} formats.{column} is a format spec ({spec!r}), not a format name.
    Add `{column}_format: {spec!r}` under `style.formats`, then write `{column}: {column}_format`
    here.'
  doc: 'Fired when a query''s `formats:` value is a d3 or strftime spec (`$,.0f`, `%b %Y`)
    instead of a name. A query says what a column means by naming a format: an engine format
    (`currency`, `percent`, `year`, ...) or one the board defines in `style.formats`. The
    spec itself belongs in `style.formats`, where one definition restyles every column that
    names it.'
  summary: 'A query''s formats: value is a spec, not a format name.'
  docs_topic: queries
- code: ERR-QUERY-FORMAT-UNKNOWN
  level: error
  title: 'A query''s formats: value names a format the board does not have'
  template: 'Query {query!r} formats.{column} names {spec!r}, which is neither an engine format
    nor defined in style.formats. Available: {available}'
  doc: Fired when a query's `formats:` value is not an engine format name and not a key in
    the rendering board's merged `style.formats`. A query imported into another board is checked
    against that board's names, so a shared query naming a format of your own needs it defined
    in every board that imports it.
  summary: 'A query''s formats: value names a format the board lacks.'
  docs_topic: queries
  hint: suggest_close_format
- code: ERR-FORMAT-AFFIX-TIME-UNSUPPORTED
  level: error
  title: A FormatConfig prefix/suffix/notation is a number-format feature only
  template: Format at {field_path} combines a prefix/suffix/notation with time-format spec
    {spec!r}. A temporal axis paints through a date formatter that has no place for an affix.
    Drop the prefix/suffix/notation, or move a prefix/suffix to a number slot, a KPI value,
    or a table column; notation never applies to a date.
  doc: 'A prefix, suffix or notation next to a strftime spec (''%b %Y'') is rejected on a
    temporal axis''s format: it paints through a date formatter, which has no place for an
    affix. Author a prefix/suffix on a number slot (`axis_y.labels.format`), or on a KPI value
    or table column format, which paint it around the date (`FY Jan 2026`). `notation` only
    affects an SI number spec; it does nothing to a date anywhere, so drop it.'
  summary: FormatConfig affix on a time-format spec.
  docs_topic: charts
- code: ERR-FORMAT-GRAIN-NAME-NOT-REDEFINED
  level: error
  title: An engine date grain name used as a format without being redefined
  template: 'Format {spec!r} at {field_path} names the engine''s own date axis labels. Replace
    {spec!r} with the strftime spec "{replacement}". To relabel that grain on every chart
    instead, redefine it in `style.formats` (`{spec}: "{replacement}"`).'
  doc: '`date_year`, `date_quarter`, `date_month` and `date_week` mean the engine''s own labels
    for a grain, which no single format expresses. They only take effect once a board redefines
    one in `style.formats`; used in a slot without that, the name would silently print something
    else, so it is rejected.'
  summary: Engine date grain name used in a slot without being redefined.
  docs_topic: charts
- code: ERR-FORMAT-SIGN-PLACEMENT-TABLE-UNSUPPORTED
  level: error
  title: A table column keeps the sign with the digits
  template: Format at {field_path} sets sign_placement, but a table column paints its prefix
    in its own lane and keeps the sign with the digits ('€  −500'). Drop sign_placement from
    this column's format.
  doc: A table column paints the prefix in a lane of its own, aligned down the column, and
    the sign beside the digits (`€  −500`), so `sign_placement` has nothing to move there
    and is rejected. Drop it, or give the column a format without it.
  summary: sign_placement on a table column.
  docs_topic: charts
- code: ERR-FORMAT-SIGN-BEFORE-ANCHORED-PREFIX
  level: error
  title: A sign cannot lead a prefix that paints on one value only
  template: 'Format at {field_path} sets sign_placement: before_prefix, but its prefix is
    anchored on one value: the anchor would read ''−EUR 50'' beside a bare ''−40''. Drop sign_placement
    (the anchor then reads ''EUR −50''), or set repeat: every.'
  doc: 'Where an authored prefix paints on one value of an axis or support_table row (`repeat:
    anchor`, or that surface''s default), the sign follows the prefix (`EUR −50`, `€−50`)
    so the anchor''s digits line up with the bare `−40` beside it. `sign_placement: before_prefix`
    there is rejected; drop it, or set `repeat: every` to put the prefix on every value.'
  summary: 'sign_placement: before_prefix on an anchored prefix.'
  docs_topic: charts
- code: ERR-GEOSHAPE-SHADING-WITHOUT-LOOKUP
  level: error
  title: A geoshape shades from a column but has no lookup
  template: Geoshape shades from column {value_field!r}, but {field_path} is not set, so nothing
    joins the data to the map. Set `lookup:` to the data column that matches the geo source's
    {geo_join_key!r} key.
  doc: A choropleth shades each region by joining a data column to the geo source's key property.
    `value:` (or a data-driven `color:`) without `lookup:` has nothing to join on and would
    render an unshaded base map. Set `lookup:` to the column holding the region identifiers,
    or drop `value:`/`color:` to draw a plain base map.
  summary: Geoshape `value:`/`color:` set without `lookup:`.
  docs_topic: charts
- code: ERR-GEO-PROJECTION-REQUIRED
  level: error
  title: A map has no projection and no geo source to take one from
  template: 'Chart {chart_id!r} is a {chart_type} with no {field_path}, and its geo source
    (if any) sets none. Set `projection:` (for example `projection: mercator`) or set `geo_source:`
    to a source that has one. See {maps_docs_url} for the available projections.'
  doc: A map is drawn through a projection, and dbt Charts picks none on its own. A built-in
    `geo_source` (us-states, world-countries, ...) carries the projection suited to its region;
    a chart with no such source, such as a point_map without a basemap or a geoshape read
    from a raw URL, must say which projection to use. Set `projection:` to one of Vega's projection
    names, or to an object with `type` plus parameters like `center` and `scale`.
  summary: Map chart without `projection:` and without a built-in `geo_source`.
  docs_topic: charts
- code: ERR-LABELS-ANCHOR-UNSUPPORTED
  level: error
  title: '`labels.visible` anchors need the chart''s own series'
  template: Chart {chart_id!r} sets {field_path} to anchors that pick marks from each series,
    which is not supported on {where}. Use `true` to label every mark.
  doc: '`first`, `last`, `min` and `max` on point, line or bar value labels print those marks
    of each series. A scatter chart has no ordered series and a layer has no series of its
    own, so neither takes an anchor. A bar chart has a first and last bar only on a time axis;
    a categorical axis takes `min` and `max`. A grouped bar takes none, and a stacked bar''s
    anchors need `stack: zero`, no `labels.field` and no visible `total_label`. Set `visible:
    true`, use `min` or `max`, or remove the key.'
  summary: '`labels.visible` anchors on a scatter chart, a layer, a grouped bar, or `first`/`last`
    on a categorical bar axis.'
  docs_topic: charts
- code: ERR-BAR-ZERO-BASELINE-CROPPED
  level: error
  title: A bar chart cannot drop its zero baseline
  template: 'Chart {chart_id!r} sets {field_path} to false, but a bar''s length is measured
    from zero, so a bar cropped away from it misstates the quantity (and paints nothing).
    Remove axis_y.scale.continuous.zero, or use `type: line` to zoom into a range.'
  doc: 'A bar encodes its value as length from the zero baseline, so `style.axis_y.scale.continuous.zero:
    false` on a bar chart would crop the bars and misstate the values. Remove the key to keep
    the zero baseline, or use `type: line` for a zoomed range. A floating bar (`y_start:`)
    has no zero baseline and is exempt.'
  summary: '`zero: false` on a bar chart without `y_start`.'
  docs_topic: charts
- code: ERR-PIE-TOTAL-WITHOUT-HOLE
  level: error
  title: A pie total needs a donut hole to sit in
  template: '{field_path} is set, but this pie has no hole, so the total would print over
    the wedges. Set `style.inner_radius` above 0 to make it a donut, or remove `total:`.'
  doc: '`total:` draws the sum of the slice values at the center of the chart, which is the
    hole of a donut. A solid pie has no hole, so the text would overlap the wedges. Set `style.inner_radius`
    above 0, use `type: donut`, or remove `total:` (`total.visible: false` is accepted on
    a solid pie).'
  summary: Pie `total:` authored on a chart with no hole.
  docs_topic: charts
- code: ERR-FORMAT-ALIAS-CYCLE
  level: error
  title: style.formats aliases point at each other in a circle
  template: 'style.formats.{name} leads into a circle: {chain}. Give one of them a d3 spec
    of its own.'
  doc: 'A `style.formats` entry whose target is another entry''s name (`currency: currency_whole`)
    resolves through that entry. When the entries lead around a circle, no format is ever
    reached. Break the circle by giving one entry a literal d3 spec.'
  summary: style.formats aliases form a cycle.
  docs_topic: charts
- code: ERR-FORMAT-AFFIX-NOMINAL-AXIS-UNSUPPORTED
  level: error
  title: A FormatConfig prefix/suffix/notation cannot reach a categorical axis
  template: '{field_path} authors a prefix/suffix/notation, but the {axis} channel resolves
    to a {channel_type} scale, whose tick labels paint from the plain format string. Drop
    the prefix/suffix/notation, or author a plain spec.'
  doc: An affix applies to a quantitative axis only. A categorical (nominal or ordinal) axis
    paints its tick labels from the plain format string, so a prefix, suffix or notation there
    cannot paint. Remove it, or author the affix on the measure axis.
  summary: FormatConfig affix authored on a nominal/ordinal axis.
  docs_topic: charts
- code: ERR-FORMAT-TIME-DIRECTIVE-UNSUPPORTED
  level: error
  title: strftime directive in a Vega-rendered time format cannot be measured
  template: 'Format {spec!r} at {field_path} uses {directives}, which dbt Charts cannot render
    identically to what Vega paints on the axis: either it is not part of d3-time-format''s
    directive set at all (Vega paints the literal letter), or Python renders it through the
    host''s C locale or local timezone rather than d3''s UTC/en-US output. This slot is baked
    onto a Vega-painted axis, whose label width is also measured from this same spec -- a
    mismatch here is a wrong render that looks right until the label overlaps its neighbor.
    Supported directives: {available}.'
  doc: Fired when an authored Vega-painted time slot (an axis `labels.format`) uses a strftime
    directive dbt Charts cannot render byte-identical to what Vega's `utcFormat` paints. `%C`/`%k`/`%l`/`%z`
    and most other letters are not d3-time-format grammar at all -- Vega paints the literal
    letter, not a computed value. `%Z` is real d3 grammar too but empty on a naive datetime,
    unlike d3's `+0000`-style offset. `%s` is real d3 grammar but Python's value follows the
    host's local timezone rather than a true UTC epoch count; `%Q` (epoch milliseconds) is
    the supported equivalent. A format string outside a Vega-painted slot (a table column,
    the footer timestamp) is unaffected -- those render through Python directly, so no measure-vs-paint
    divergence is possible there.
  summary: A time-format directive Vega paints differently than dbt Charts measures.
  docs_topic: charts
# ──────────────────────────────── Warning codes ───────────────────────────────
# Compile-time authoring warnings declared here in the leaf so the registry
# is complete on import of core.diagnostics. Emitters import their
# constants back rather than declaring codes in-module.
- code: WARN-DEFAULTS-FILE-GIVEN-AS-BOARD
  level: warning
  title: A defaults file was given to dct render
  template: '{path} holds defaults for the boards beside it; skipped.'
  fix: Nothing to fix when a glob picked it up. To see its effect, render a board in the same
    directory.
  doc: Fired when a path given to `dct render` is a meta.yml or meta.yaml file. That file
    holds defaults the boards in its directory inherit, and has nothing of its own to draw.
    A glob like `charts/*.yml` picks it up alongside the boards, so it is skipped and the
    boards render.
  summary: Fired when a meta.yml defaults file is given to dct render.
  docs_topic: board
- code: WARN-SCHEMA-MIGRATED
  level: warning
  title: Board YAML uses retired syntax
  template: '{message}'
  fix: Run `dct migrate` to rewrite the file, or update the YAML by hand where the message
    says `dct migrate` cannot.
  doc: Fired when a board, meta.yml, or `extends:` file uses syntax from an older dbt charts
    release. The board is migrated in memory and still renders, but the file on disk is stale.
    When migration could not finish, the message says so, and errors reported alongside it
    may name retired syntax.
  summary: Fired when a board uses retired syntax that was migrated in memory.
  docs_topic: board
- code: WARN-UNREFERENCED-QUERY
  level: warning
  title: Query is defined but nothing reads it
  template: Query `{query}` is not used by any chart, variable, text or query; remove it.
  fix: Delete the query, or reference it from a chart or variable.
  doc: Fires at compile time for a query defined in the board tree that no chart (or layer),
    variable option list or `enabled`/`visible` probe, board title or text, or other query's
    `{{ queries.<name> }}` reads. A chart-focused board is judged against the unfocused one.
    Emitted by `compile/validate/board_warnings.py`.
  summary: Fired when a query is defined but no chart, variable, text or query reads it.
  docs_topic: queries
  redundant: true
- code: WARN-UNREFERENCED-CHART
  level: warning
  title: Chart is defined but not placed in any layout
  template: Chart {chart_id!r} is defined but not referenced in any layout (rows/cols/grid/tabs).
    It will not appear in the rendered dashboard.
  fix: Add the chart to a layout block, or delete it if it is no longer needed.
  doc: 'Fires at compile time for charts that are defined somewhere in the board tree but
    never placed in any layout (rows/cols/grid/tabs). The board still compiles because content-only
    boards are valid; this warning surfaces lazy authoring: an author defined a chart and
    forgot to display it. Emitted by `compile/validate/board_warnings.py`.'
  docs_topic: charts
  redundant: true
- code: WARN-INHERITED-LAYOUT-REPLACED
  level: warning
  title: A board's own layout or tags replace the inherited ones
  template: '`{field}:` {replacer} replaces {inherited} inherited from {source}.'
  fix: To keep the inherited items, move the shared parts into a partial and import it from
    both boards.
  doc: Fired when a `meta.yml`, an extended board or the board itself sets `rows:`, `cols:`,
    `grid:`, `tabs:` or `tags:` over a non-empty value a lower layer set. The closer value
    replaces it; nothing is appended.
  summary: Fired when a board restates a layout or tag list that a meta.yml or extended board
    already sets.
  docs_topic: layout
- code: WARN-RESTATED-STYLE
  level: warning
  title: Authored style equals the value it inherits
  template: '`{path}: {value}` is already {source}; remove it.'
  fix: Delete `{path}`. Keep a key only to override a different inherited or inferred value.
  doc: 'Fires when an authored style value equals the value the same key resolves to without
    it. That value comes from the cascade: shipped defaults, theme, `extends:`, meta.yml,
    parent boards, or the board''s style for the chart type. Comparison is exact, leaf by
    leaf, on unresolved values, so `8` against `8.5`, or a color token against its hex, never
    warns. Emitted by `compile/restated.py`.'
  docs_topic: board
  redundant: true
- code: WARN-RESTATED-INFERRED
  level: warning
  title: Authored value equals the one the engine infers
  template: '`{path}: {value}` is already {source}; remove it.'
  fix: Delete `{path}`. Keep a key only to override a different inherited or inferred value.
  doc: 'Fires when an authored value equals what the engine would infer without it: a variable''s
    input type, label or schema default, a table header derived from the column name, a `source:`
    the enclosing board already sets, or an `options.static` list that is every value of the
    column the variable filters. Emitted by `compile/restated.py`.'
  summary: Fired when an authored value equals what the engine would infer without it.
  docs_topic: board
  redundant: true
- code: WARN-RESTATED-FORMAT
  level: warning
  title: Authored format equals the query's declared format
  template: '`{path}: {value}` is already {source}; remove it.'
  fix: Delete `{path}`. Keep a key only to override a different inherited or inferred value.
  doc: Fires when a chart or table column names the same format its query already declares
    for that column in `formats:`. Emitted by `compile/restated.py`.
  docs_topic: board
  redundant: true
- code: WARN-FLAT-COLS-UNSIZED-OVERFLOW
  level: warning
  title: 'Flat cols: row has too many unsized non-KPI cells'
  template: 'cols: has {growable_count} unsized non-KPI cells (max recommended {max_unsized}).
    Each inherits the row''s full vertical budget, so a wide flat row makes row height unpredictable.
    KPI cards are height-stable and don''t count.'
  fix: |-
    Nest cells into sized rows-in-cols groups instead, e.g.:
      cols:
      - width: "17%"
        rows:
          - kpi_a
          - kpi_b
      - width: "55%"
        rows:
          - hero
  doc: Fires when a flat `cols:` row has more unsized non-KPI cells than the recommended limit.
    Each unsized cell inherits the row's full vertical budget, making row height unpredictable
    with many columns. KPI cards are carved out because they are height-stable. Emitted by
    `compile/validate/authoring_warnings.py`.
  docs_topic: layout
- code: WARN-ADJACENT-TEXT-ROWS
  level: warning
  title: Consecutive text-only rows each flow into their own columns
  template: '{count} text-only rows in a row: each is measured and flowed on its own, so the
    column grid restarts at every one; the column edges do not line up, and whichever block
    half-fills its last column leaves a gap mid-page.'
  fix: Merge them into one `- text:` block. Prose in a single block flows through one set
    of columns and fills them evenly; the headings that separated the rows still separate
    the sections inside it.
  doc: 'Fires when two or more consecutive `rows:` items are body prose and nothing else.
    Every prose block picks its own column count from its own line count and balances its
    own lines, with no flow between blocks, so stacking them renders unrelated grids rather
    than one continuous passage. One diagnostic per run, marking the second row of it; a run
    of four rows is one authoring decision, not three. A `title:` on the row does not exempt
    it: `- title:` + `text:` is how a section of prose is written, and two of those fragment
    the same way, so the fix is to merge them and let the later titles become headings inside
    the merged block. Four shapes do not participate, and each of them also ends a run rather
    than being skipped over; a row between two passages is something the author put there.
    They are: a row holding a layout of its own (a section, not a block of prose); a row carrying
    anything only a slot can carry: `style:`, `visible:`, a `details:` disclosure, an authored
    height, an `extends:` theme, since a merged block has one of each and merging would have
    to discard one; a row with no flowing prose in it, a markdown table or a code block on
    its own, because merging one of those into a prose column squeezes it to the measure;
    and prose too short to reach a second column, which is one column wide at any board width
    and so cannot misalign against anything; a caption rather than a passage. A `cols:` layout
    never fires: prose side by side is an authored spread. A row imported from another file
    or generated by a `foreach` is not reported either; it has no authored coordinates to
    mark, and the merge it would ask for is not the author''s to make here. Emitted by `compile/validate/board_warnings.py`.'
  docs_topic: layout
- code: WARN-LABEL-TITLE-CASE
  level: warning
  title: Authored label is in Title Case
  template: '{text!r} capitalizes its words like a heading; labels print as written, so it
    will show in Title Case.'
  fix: Write the label in sentence case, keeping proper nouns and acronyms capitalized. Leave
    it as is if the capitals are proper nouns.
  doc: 'Fires when an authored `label`, `x_label`, `y_label` or `field_labels` entry is shaped
    like a headline: its second word is a plain capitalized word, every later word that is
    not a small word (`by`, `of`, `per`, ...) is one too, and at least two words after the
    first are capitalized (`Avg Order Value`, `Revenue By Region`). `Sales in North America`
    and `Griddle Royale launched in March` do not fire. Subtitles and query data are never
    checked. Headings are title-cased for you; every other label is sentence case, and an
    authored label prints exactly as typed. Acronyms (`ARR`) and mixed-case words (`iOS`)
    are not plain capitalized words. Emitted by `compile/validate/authoring_warnings.py`.'
  summary: Fired when an authored label is shaped like a headline in Title Case.
  docs_topic: styling
- code: WARN-HEADING-TRAILING-PERIOD
  level: warning
  title: Heading ends with a period
  template: Title {text!r} ends with a period; headings do not take one.
  fix: Delete the trailing period from the title.
  doc: Fires when a board, section, tab, or chart `title:` ends with a period; axis and legend
    titles are labels and are not checked. Headings are title-cased and carry no closing punctuation;
    the engine never strips an authored period for you. An ellipsis does not count. Emitted
    by `compile/validate/authoring_warnings.py`.
  docs_topic: styling
- code: WARN-HEADING-MARGIN-REDEFINED
  level: warning
  title: Authored heading margin now sizes fewer headings
  template: '`style.text.heading.{key}` no longer sets the space around every heading: {meaning}'
  fix: Delete the key to take the theme's spacing, or keep it for the levels it still sizes.
    `style.text.paragraph` sets the gap the other levels take.
  doc: Fires when a board authors `style.text.heading.margin_top` or `margin_bottom`. Both
    used to set the space above and below every markdown heading and below every board and
    section title. Now `margin_top` sets the space above H1 and H2 only and `margin_bottom`
    the space below H2 to H6 only; H3 to H6 take the paragraph gap above them, H1 takes it
    below, and a board or section title takes it below from `style.text.paragraph`. The authored
    value is unchanged and valid, so the board renders differently with nothing else to tell
    the author. Emitted by `compile/validate/authoring_warnings.py`.
  summary: Fired when a board authors a heading margin that now sizes fewer levels.
  docs_topic: styling
# Location-neutral on purpose: the mark sits on the heading when the
# prose is the board's own `text:`, but on `title:` when it came from
# a layout slot, and the CLI shows no mark at all. "Delete this line"
# would be wrong in two of those three.
- code: WARN-DOUBLE-HEADER
  level: warning
  title: Board title is repeated by a heading at the top of the body
  template: Board title {title!r} is followed immediately by a level-{level} markdown heading
    {heading!r}; the board renders both, so the dashboard headers itself twice.
  fix: Delete the heading line from the body; `title:` already renders as the board header.
    If you would rather keep the heading, drop `title:` instead and let it be the header.
  doc: 'Fires when a board sets `title:` and the first block of its body markdown is a heading
    that either is level 1 (a document has one document title) or repeats the board title.
    The board prints the board title as its header and the markdown heading directly beneath
    it. A heading further down the body, or a lower-level heading with different text (`##
    Overview` under `title: Sales`), is ordinary section structure and does not fire. Heading
    detection uses the same markdown parser that renders the text, so a fenced code block
    opening with a `#` comment is not mistaken for a heading. Checked on the board itself,
    not on nested boards; a section card pairing its title with a styled body heading is a
    deliberate pattern. Emitted by `compile/validate/board_warnings.py`.'
  docs_topic: board
  redundant: true
- code: WARN-BODY-HEADING-NO-TITLE
  level: warning
  title: Text opens with a heading but the board has no title
  template: Text opens with the markdown heading {heading!r} and this board has no `title:`,
    so the heading renders as prose rather than a section title.
  fix: 'Set `title: {heading}` and delete the heading line from the text; section titles belong
    on the board, not in the markdown. If this text isn''t a new section, it shouldn''t be
    its own row: merge it into the text before it.'
  doc: 'Fires when a board or `rows:` item has no `title:` and its `text:` opens with a markdown
    heading at any level. A prose row is a section, and a section''s title is the board''s
    `title:`: it renders above the columns at the title size and spacing, where a markdown
    heading renders inside the prose. Headings further down a block stay in the markdown.
    A `cols:` or `grid:` cell is not checked, because its opening heading titles the card
    beside its neighbors, and neither is a tab pane''s own text, which opens under its tab
    label. Heading detection uses the same markdown parser that renders the text, so a fenced
    code block opening with a `#` comment is not mistaken for a heading. Emitted by `compile/validate/board_warnings.py`.'
  docs_topic: board
- code: ERR-AXIS-COLUMN-REQUIRES-TABULAR-FONT
  level: error
  title: A column-forming quantitative axis needs a tabular label font
  template: 'Chart {chart_id!r}: axis label font {family!r} does not guarantee tabular figures,
    but its tick ladder compacts to a shared magnitude and forms a column; the digits only
    stack into a column when every digit shares one advance, which a proportional font does
    not give, so the column would misalign silently. A quantitative axis takes its label font
    from the `numeral` slot (style.fonts.numeral), any other axis from the `label` slot (style.fonts.label);
    one of those slots, or an axis override (style.axis_y.labels.font.family on this chart,
    style.charts.axis_quantitative.labels.font.family on the board), carries this family.'
  fix: Put the body typeface on `style.fonts.body` (and `style.fonts.heading`), and leave
    `style.fonts.label` and `style.fonts.numeral` on a tabular family (e.g. 'dbt Sans Tabular').
    To keep a different family on the axis itself, set a tabular one on `style.axis_y.labels.font.family`
    for this chart, or on `style.charts.axis_quantitative.labels.font.family` to cover every
    chart.
  doc: Fired at resolve when a column-forming quantitative axis (a vertical ruler) resolves
    a shared magnitude scale but its label font is not vendor-registered as tabular. Ticks
    that carry no magnitude suffix are padded to the width of the one that does, so their
    digits stack under it; that column only holds when every digit shares a single advance,
    which is what a tabular board guarantees and a proportional one does not. A horizontal
    ruler is exempt (its ticks form no column) regardless of font.
  summary: Fired when a compacting quantitative axis that forms a column resolves to a non-tabular
    label font.
  docs_topic: charts
- code: WARN-SINGLE-CHART-REDUNDANT-TITLE
  level: warning
  title: Single-chart board has both a board title and a chart title
  template: Board title {title!r} sits above a single chart that carries its own title {chart_title!r};
    two headers for one chart.
  fix: Remove the board's `title:` and keep the chart's `title:`.
  doc: 'Fires when a board''s whole content is one chart and both the board and the chart
    carry a title, so the board stacks two headers over a single piece of content. A one-chart
    board is headed by its chart, so the board''s `title:` is the one to remove. Does not
    fire when only one of the two is titled, when the board holds more than one chart, or
    when body prose sits between the two titles. KPI and callout charts are excluded: a KPI
    labels itself with `label:` and a callout''s title is a prose lead-in, so neither stacks
    a chart header under the board''s. Checked on the board itself, not on nested section
    boards. Emitted by `compile/validate/board_warnings.py`.'
  docs_topic: board
  redundant: true
- code: WARN-HTML-POLICY-CAPPED
  level: warning
  title: Board html_policy downgraded by deployment ceiling
  template: Board requested html_policy={requested!r} but the {ceiling_source} ceiling is
    {ceiling!r}; effective policy is {effective!r}. Raw HTML in this board will be treated
    as {effective!r}.
  fix: Either lower the board's `html_policy:` to {effective!r} to match what is actually
    rendered, or raise the deployment ceiling (DCT_HTML_POLICY_CEILING or html_policy_ceiling
    in dbt_charts.yml) if the deployment operator permits it.
  doc: Fires when a board's authored `html_policy` is above the effective deployment ceiling
    (set by DCT_HTML_POLICY_CEILING env var or `html_policy_ceiling` in dbt_charts.yml).
    The board compiles successfully but the policy is downgraded at normalize time; this warning
    makes the downgrade visible so the author knows their html_policy setting is not being
    honored. Emitted by `compile/compiler.py`.
  summary: Fired when the board's html_policy exceeds the deployment ceiling and is silently
    downgraded to the ceiling value.
  docs_topic: board
  redundant: false
- code: ERR-MULTI-Y-COLOR-CONFLICT
  level: error
  title: 'Multi-y chart''s color: must name a column'
  template: 'Chart {chart_id!r} ({chart_type}): y: [...] folds measures into a color series,
    and color: {color_field!r} is bound to a gradient or conditional scale, which names no
    series to cross them with. Bind color: to a plain column (each of its values x each measure
    becomes a series) or drop it.'
  doc: 'Fired when a bar, area, line, or scatter chart authors y: [a, b] together with a color:
    that is not a plain series column -- a gradient or a conditional scale. A column composes
    with the fold: the series become `<value> - <measure>` composites, one per dimension value
    per measure.'
  docs_topic: charts
- code: ERR-MULTI-Y-LAYERS-CONFLICT
  level: error
  title: 'Multi-y chart cannot also have layers:'
  template: 'Chart {chart_id!r} ({chart_type}): y: [...] folds measures into a color series
    automatically -- overlay layers: are not supported with multi-y charts. Keep a single
    y field and overlay the other measures as layers: entries instead.'
  doc: 'Fired when a bar, area, line, or scatter chart authors both y: [a, b] and layers:
    at the same time.'
  docs_topic: charts
- code: ERR-WIDE-MEASURE-NAME-CONTAINS-SEPARATOR
  level: error
  title: Wide measure name contains the dimension composite separator
  template: 'Chart authors y: [...] with color: as a dimension, and measure column {measure!r}
    contains the {separator!r} composite separator, so the composite series name cannot be
    split back into a dimension value and a measure. Rename the measure column, or alias it
    in the query.'
  doc: 'A wide chart authoring a list of y: measures can also author color: as a dimension
    the measures cross with. Fires when one of the measure column names itself contains the
    separator the `<dimension value> - <measure>` composite string uses. The composite cannot
    be split back apart unambiguously in that case, so the measure column must be renamed,
    or aliased in the query, to avoid the separator.'
  summary: Fired when a wide-measure chart's own measure column name contains the dimension
    composite separator.
  docs_topic: charts
- code: ERR-CATEGORY-COLOR-PIN-DUPLICATE
  level: error
  title: Two category_colors pins name the same color
  template: '`style.charts.category_colors.{field}` pins both `{first_value}` and `{second_value}`
    to `{color}`: two categories cannot share a swatch. Give one of them a different color.'
  doc: Fired when two values pinned under `style.charts.category_colors.<field>` resolve to
    the same color (case-insensitively), which would seat two categories on one swatch. Give
    one of the pins a different color.
  summary: Fired when two category_colors pins resolve to the same color.
  docs_topic: charts
- code: ERR-CATEGORY-COLOR-PALETTE-EXHAUSTED
  level: error
  title: An authored category_colors field has more values than the palette has swatches
  template: '{value_count} values for `{field}` need a palette swatch, but the board''s categorical
    palette has {swatch_count}. Pick a wider palette, or pin the extra values in `style.charts.category_colors.{field}`
    to a color outside it (a variant like `category[3].light`, or a hex).'
  doc: Fired when an authored `style.charts.category_colors.<field>` field has more values
    needing a palette swatch (unpinned values plus pins naming a palette color) than the board's
    categorical palette has. Pins to a color outside the palette (a variant or a hex) need
    no swatch. Two categories must never share a swatch, so an authored field raises instead
    of silently declining to bind (an unauthored field just declines). Pick a wider palette,
    or pin the extra values to colors outside it.
  summary: Fired when an authored category_colors field outgrows the palette's swatch count.
  docs_topic: charts
- code: WARN-AREA-ZERO-BASELINE-CROPPED
  level: warning
  title: An area chart's zero baseline is cropped
  template: Chart {chart_id!r} sets axis_y.scale.continuous.zero to false, so the area's fill
    starts above zero and overstates the change.
  fix: 'Remove axis_y.scale.continuous.zero to keep the zero baseline, or use `type: line`
    to zoom into a range. If the crop is deliberate, add WARN-AREA-ZERO-BASELINE-CROPPED to
    the chart''s warnings_ignore.'
  doc: 'An area''s fill encodes magnitude from the zero baseline, so `style.axis_y.scale.continuous.zero:
    false` shows a cropped fill that overstates change. A zoomed area is sometimes deliberate,
    so this warns instead of failing and can be suppressed with `warnings_ignore`.'
  summary: 'Fired when an area chart authors `zero: false` on its y axis.'
  docs_topic: charts
- code: WARN-AXIS-ALIGN-DISCARDED
  level: warning
  title: Authored axis_y.labels.align has no effect on a house-format quantitative axis
  template: 'Chart {chart_id!r}: axis_y.labels.align = {authored_align!r} has no effect: the
    format alias {format_alias!r} forces label.align = ''right'' on right-edge quantitative
    axes for correct digit alignment.'
  fix: Remove axis_y.labels.align from this chart. To opt out of forced alignment, use a literal
    d3 format spec (e.g. '.1%') instead of the alias.
  doc: Fired when a chart authors axis_y.labels.align alongside a house-rule format alias
    (percent, currency, etc.) on a right-edge quantitative axis. The alias forces label.align
    = 'right' for place-value alignment; the authored align value is silently discarded.
  summary: Fired when a chart authors axis_y.labels.align alongside a house-rule format alias
    on a right-edge quantitative axis.
  docs_topic: charts
- code: WARN-FORMAT-UNUSED-NAME
  level: warning
  title: style.formats name is defined but nothing uses it
  template: '`style.formats.{name}` is defined but nothing uses it.{did_you_mean} To restyle
    an engine format, redefine its name (`number`, `currency`, `date_short`, ...).'
  fix: Name it in a `format:` slot, redefine an engine name instead, or delete it.
  doc: Fires at compile time for a name this board file's own `style.formats` defines that
    no format slot on the board references and that is not an engine format name. The engine's
    names are the keys that restyle every chart (`number`, `currency`, `percent`, `date_short`,
    ...). A name inherited from `meta.yml` or `extends` never warns here, since a sibling
    board may use it. Emitted by `compile/validate/board_warnings.py`.
  summary: A style.formats name is defined in a board file that nothing uses.
  docs_topic: charts
- code: ERR-LINK-SCHEME-UNSAFE
  level: error
  title: Link uses a URL scheme dbt Charts does not allow
  template: 'Link {link!r} at {field_path} uses scheme {scheme!r}. Use a board path (/, ./,
    ?, #) or http, https, mailto.'
  doc: 'Fired when an authored link (chart link, table column link/header_link, or footer
    link) resolves to a URL scheme other than http, https, or mailto. A board path (starting
    with /, ./, ../, ?, or #) is always allowed; any other scheme — javascript:, data:, vbscript:,
    or an editor deeplink like vscode:// — is rejected so a link can never execute script
    or navigate somewhere unexpected.'
  summary: Fired when a link resolves to a disallowed URL scheme.
  docs_topic: charts
- code: ERR-LINK-SCHEME-UNANCHORED
  level: error
  title: Link template starts with data, so its scheme is unknown
  template: 'Link {link!r} at {field_path} begins with a template. Start it with /, ?, # or
    https:// so data cannot choose the scheme.'
  doc: Fired when a chart or footer link's literal text before its first `{{` template placeholder
    does not itself fix a safe scheme — the query row or variable value filling the template
    would then decide what scheme the browser navigates to. Start the link with a board path
    or a fixed https:// prefix instead.
  summary: Fired when a link template's scheme is decided by data.
  docs_topic: charts
- code: WARN-LINK-TARGET-NOT-FOUND
  level: warning
  title: A board link names a board that does not exist
  template: Link {link!r} at {field_path} points at {slug!r}, which is not a board in this
    project.
  fix: Write the slug of an existing board as a root-relative path, such as '/user-360'.
  doc: Fired by validation when a chart, table-column or footer `link:` resolves to a board
    that no board file in the project (installed packages included) provides. The board still
    saves and renders, but clicking the link lands on a 404. Links to other sites, variable-only
    links, links the built-in data views serve, and links whose path holds a `{{ }}` template
    are not checked.
  summary: Fired when a board link points at no board in the project.
  docs_topic: charts
- code: ERR-NAME-INVALID
  level: error
  title: Name is not an identifier
  template: '{kind} {name!r} at {path} must be a valid identifier: letters, digits and
    underscores, not starting with a digit.'
  doc: Fired when a chart, query or variable name is not a valid identifier. Names are
    referenced as bare words in layouts, queries and Jinja templates, so a name with a
    space, hyphen, dot, leading digit or leading `@` never worked reliably, so this catches
    it at compile instead of a confusing failure later.
  summary: Fired when a chart, query or variable name is not a valid identifier.
  docs_topic: variables
- code: ERR-COLOR-TOKEN
  level: error
  title: Style color token does not resolve
  template: 'Color token in {scope} does not resolve: {reason}'
  doc: 'Fired when a color in a `style:` block is a palette token (`palette.slot`, `role.alias`,
    `role[N]`) that no palette or theme role resolves: a misspelled palette, an alias or slot
    the palette lacks, or a role the theme does not bind. A bad token in a chart''s own style
    names the chart, and other charts on the board render normally; one in board style names
    the field.'
  summary: Fired when a style color token matches no palette or theme role.
  docs_topic: charts
- code: ERR-STYLE-CSS-VALUE-INVALID
  level: error
  title: A style value for markdown text is not valid CSS
  template: 'Invalid style value for markdown text: {detail}.'
  doc: 'Fired when a font color, weight, style or decoration that styles markdown text (prose,
    callouts, table cells) contains a character that could close the CSS declaration or open
    a new rule: one of `<>;{}"''\*` or a control character. Use a plain CSS value such as
    a hex color, `oklch(...)`, `var(--x)`, or `bold`.'
  summary: A style value written into CSS contains characters that break out of it.
  docs_topic: charts
- code: ERR-CUSTOM-TEMPLATE
  level: error
  title: Custom chart template is missing or invalid
  template: 'Chart {chart_id!r} (custom): {reason}'
  doc: 'Fired when a `type: custom` chart''s template cannot be loaded: `template:` names
    no `templates/<name>.svg.j2` file in the project, the board has no project to read it
    from, the `{#--- ... ---#}` header is not valid YAML or declares an unknown param type,
    or the Jinja source has a syntax error.'
  summary: Fired when a custom chart's template is missing, unparseable, or has a bad header.
  docs_topic: charts
- code: ERR-CUSTOM-FIELDS
  level: error
  title: Custom chart channels or options do not match the template
  template: 'Chart {chart_id!r} (custom): {reason}'
  doc: 'Fired when a `type: custom` chart''s channels (`x`, `y`, `color`, ...) or `options:`
    disagree with what its template declares in its header: an undeclared channel or option,
    a required one left out, a list on a channel without `multiple: true`, a value of the
    wrong type, or a color option that is not a color. A template with no header accepts no
    channels and no options.'
  summary: Fired when a custom chart's channels or options are undeclared, missing, or the
    wrong type.
  docs_topic: charts
- code: ERR-MARKDOWN-NOT-BOARD
  level: error
  title: Markdown file is not a board
  template: 'Not a dbt Charts board file: markdown files outside charts/ must declare a top-level
    ''board:'' key in their YAML frontmatter, or hold a `charts` fence and be named directly'
  doc: Fired when a markdown file outside `charts/` is compiled as a board but its frontmatter
    has no top-level `board:` key. Under `charts/` every markdown file is a board by path
    convention. Elsewhere the `board:` key opts a page in, and so does a `charts` fence in
    a file named directly, as in `dct render post.md`; a file found by listing a folder needs
    the `board:` key. Add a `board:` block to the frontmatter, name the file, or move it under
    `charts/`.
  docs_topic: board
- code: ERR-MARKDOWN-PARSE
  level: error
  title: Markdown board cannot be parsed
  template: 'Markdown board cannot be parsed: {detail}'
  doc: 'Fired when a markdown board''s frontmatter or body cannot be turned into a board:
    the opening `---` has no closing delimiter, the frontmatter is not a YAML mapping, or
    `board:` is not a mapping. YAML syntax errors inside the frontmatter report ERR-YAML-SYNTAX
    instead.'
  docs_topic: board
- code: ERR-QUERY-REF-INVALID
  level: error
  title: Query reference is not file#query
  template: 'Invalid external query reference: ''{ref}''. Expected format: ''path/to/file.yml#query_name''. Write the file path, a `#`, then the name of a query that file declares.'
  fix: Write the reference as the file path, a `#`, then the query name, for example `queries/sales.yml#revenue`.
  doc: Fired when a `query:` that reads another file, or a chart ref, names no file or no query around its `#`.
  docs_topic: queries
- code: ERR-QUERY-NOT-IN-FILE
  level: error
  title: Query is not declared in the referenced file
  template: 'Query ''{name}'' not found in ''{file}''. Available queries: {available}. Name one of them after the `#`, or declare ''{name}'' under `queries:` in ''{file}''.'
  fix: Name a query the file declares under `queries:`, or declare it there.
  doc: Fired when a `file#query` reference names a query that the file's `queries:` section does not declare.
  docs_topic: queries
- code: ERR-CHART-REF-QUERY-UNDECLARED
  level: error
  title: Chart ref needs a query its file does not declare
  template: 'Chart ref ''{chart_ref}'' requires query ''{name}'', which is not declared in {file}''s queries: section. Declare ''{name}'' under `queries:` in {file}, or point the chart at a query that file declares.'
  fix: Declare the query under `queries:` in the file the chart ref reads, or point the chart at a query that exists.
  doc: Fired when a chart read from another file names a query that file does not declare.
  docs_topic: queries
- code: ERR-QUERY-REF-CYCLE
  level: error
  title: Query references form a cycle
  template: 'Circular query reference while resolving chart ref ''{chart_ref}'': ''{name}'' in {file} depends on itself. Change ''{name}'' in {file} so it no longer reads itself, directly or through other file references.'
  fix: Break the cycle so no query reads itself through the file references.
  doc: Fired while resolving a chart ref when a query in another file reads, directly or through other file references, the query being resolved.
  docs_topic: queries
- code: ERR-FILE-SOURCE-INVALID
  level: error
  title: Inline file source is invalid
  template: 'Query {query!r}: inline file source {source!r} is invalid: {reason}. Name a file whose stem is a valid SQL identifier (letters, digits and underscores), or declare the source under `sources:` in dbt_charts.yml.'
  fix: Name a file whose stem is a valid SQL identifier, or declare the source under `sources:` in dbt_charts.yml.
  doc: Fired when a query's inline file source cannot be read as a source, for example because the file's stem is not a valid SQL identifier.
  docs_topic: queries
- code: ERR-BOARD-SOURCE-INVALID
  level: error
  title: Board-level source is not a name
  template: 'Invalid board-level `source:` in {file}: expected a source name string, got {got}. Write `source:` as the name of a source declared under `sources:` in dbt_charts.yml.'
  fix: Write `source:` as the name of a source declared under `sources:` in dbt_charts.yml.
  doc: Fired when a board's `source:` is a list, a mapping or another value that is not a source name.
  docs_topic: board
- code: ERR-EXTENDS-CYCLE
  level: error
  title: extends chain returns to a file
  template: 'Circular extends: {file} is already in the extends chain. Remove the `extends:` entry that leads back to {file}.'
  fix: Remove the `extends:` entry that leads back to a file already in the chain.
  doc: Fired when the `extends:` chain of a board reaches a file or theme it is already folding.
  docs_topic: board
- code: ERR-META-OUTSIDE-BOARDS-ROOT
  level: error
  title: Board directory is outside the boards root
  template: directory {dir!r} is not under boards_root {root!r}. Keep the board under the boards root, or set the boards root to a folder that holds it.
  fix: Keep boards under the boards root, or point the boards root at a folder that holds them.
  doc: Fired when a board's directory is not under the boards root that bounds the `meta.yml` walk.
  docs_topic: board
  summary: Fired when a board's directory is not under the boards root that bounds the `meta.yml` walk.
- code: ERR-EXTENDS-INVALID
  level: error
  title: An extends file is not a board patch
  template: 'extends: {file} is invalid: {reason}. Fix {file} so it is valid YAML holding only board keys.'
  fix: Fix the named file so it is valid YAML holding board keys only.
  doc: Fired when a file a board extends, or a `meta.yml` above it, does not parse as YAML or holds keys a board patch does not accept.
  docs_topic: board
  summary: Fired when a file a board extends is not valid YAML or holds keys a board does not accept.
- code: ERR-TAB-TITLE-EMPTY-SLUG
  level: error
  title: Tab title has no letter or digit
  template: Tab title '{title}' produces an empty slug. Tab titles must contain at least one alphanumeric character. Give this tab a title with a letter or digit.
  fix: Give the tab a title with at least one letter or digit.
  doc: Fired when a tab's title slugs to nothing, so the tab could not be selected by name.
  docs_topic: layout
- code: ERR-TAB-TITLE-DUPLICATE-SLUG
  level: error
  title: Two tab titles share a slug
  template: Duplicate tab slug '{slug}'. Tab titles must produce unique slugs (after lowercasing and replacing spaces with _). Retitle one of the tabs that slugs to '{slug}'.
  fix: Retitle one of the tabs so the slugs differ.
  doc: Fired when two tabs of one layout have titles that slug to the same name.
  docs_topic: layout
- code: ERR-VALUES-ROW-SHAPE
  level: error
  title: A values row has the wrong number of cells
  template: 'query ''{query}'': values row {row} does not have one cell per column. Rows count from 0; give each row of `values:` exactly one cell per entry of `columns:`.'
  fix: Give each row of `values:` exactly one cell per entry of `columns:`.
  doc: Fired when a row of a values query is shorter or longer than its column list.
  docs_topic: queries
- code: ERR-CARD-GAP-NESTED
  level: error
  title: card_gap is set on a nested board
  template: card_gap can only be set on the root board, not on nested boards. Remove `card_gap:` from the nested board and set it on the root board instead.
  fix: Move `card_gap:` to the root board.
  doc: Fired when a board nested in another sets `card_gap`; only the root board does.
  docs_topic: board
- code: ERR-HTML-POLICY-CEILING-INVALID
  level: error
  title: The project config does not give a usable html_policy_ceiling
  template: '{message}'
  fix: Make dbt_charts.yml a YAML mapping, and set its `html_policy_ceiling:` to one of the html_policy tiers.
  doc: Fired when the project's `dbt_charts.yml` cannot be read as a YAML mapping, or its `html_policy_ceiling` is not one of the tiers.
  docs_topic: board
  summary: Fired when the project config is not a YAML mapping or its html policy ceiling is not a tier.
- code: ERR-VARIABLE-CYCLE
  level: error
  title: Variables depend on each other in a cycle
  template: 'Circular variable dependency detected: {cycle}. Variables cannot depend on each other in a cycle. Check the options queries for these variables.'
  fix: Make the options query of one variable stop reading the other.
  doc: Fired when the options queries of variables read each other's values in a cycle.
  docs_topic: variables
- code: ERR-QUERY-NAME-RESERVED-WORD
  level: error
  title: A query named like a SQL reserved word is composed as a table alias
  template: Query '{name}' is referenced via {{{{ queries.{name} }}}}, but '{name}' is a SQL reserved word and cannot be used as a table alias. Rename the query to a non-reserved identifier, and update the references to it.
  fix: Rename the query to a name that is not a SQL reserved word.
  doc: Fired when a query that another query composes through a `queries.NAME` reference is named like a SQL reserved word, because the composed query becomes a table alias.
  docs_topic: queries
  summary: Fired when a query that another query composes is named like a SQL reserved word.
- code: ERR-SETUP-SQL-COMPOSES-QUERY
  level: error
  title: setup_sql composes another query
  template: 'Query ''{query}'': setup_sql must not contain {{{{ queries.X }}}} references. setup_sql is for non-nestable setup statements (CREATE TEMP FUNCTION, etc.). Move the reference into the query''s `sql:`.'
  fix: Move the `queries.X` reference out of `setup_sql:` and into `sql:`.
  doc: Fired when a query's `setup_sql` contains a `queries.X` reference; setup statements run untranslated, ahead of every query.
  docs_topic: queries
  summary: Fired when a query's setup_sql composes another query.
- code: ERR-CHART-SOURCES-AMBIGUOUS
  level: error
  title: A chart is placed in boards with different sources
  template: Chart '{chart}' is placed in boards with different sources, so its inline query has no one source. Declare the query by name under `queries:` and point the chart at it, or place the chart in boards that share one source.
  fix: Declare the chart's query by name under `queries:`, or place the chart in boards that share a source.
  doc: Fired when a chart that declares its query inline is placed in boards whose `source:` differ, so the inline query has no single source to run against.
  docs_topic: queries
- code: ERR-VARIABLE-TABLE-INVALID
  level: error
  title: A variable's column binding names a table that is no SQL identifier
  template: '{field_path}: table name {table!r} is not a valid SQL identifier. Use only letters, digits, and underscores, optionally schema-qualified (e.g. ''gis.fact_sales'').'
  fix: Write the table half of `table.column` with letters, digits and underscores, optionally schema-qualified.
  doc: Fired when the table half of a variable's `column:` or `options` binding is not a bare SQL identifier, or a dotted chain of them, because it is interpolated into the options query.
  docs_topic: variables
  summary: Fired when the table half of a variable's column binding is not a SQL identifier.
- code: ERR-VARIABLE-COLUMN-INVALID
  level: error
  title: A variable's column binding names a column that is no SQL identifier
  template: '{field_path}: column name {column!r} is not a valid SQL identifier. Use only letters, digits, and underscores.'
  fix: Write the column half of `table.column` with letters, digits and underscores.
  doc: Fired when the column half of a variable's `column:` or `options` binding is not a bare SQL identifier, because it is interpolated into the options query.
  docs_topic: variables
- code: ERR-QUERY-SHAPE-INVALID
  level: error
  title: A query breaks the shape its type allows
  template: '{message}'
  fix: 'Change the query to the keys its type allows: `sql`, `values` or `schema`, one body only.'
  doc: Fired when a query sets keys its type does not take, sets keys that exclude each other, or leaves out a key its type requires. The message names the query and the keys.
  docs_topic: queries
- code: ERR-INCREMENTAL-NOT-SQL
  level: error
  title: Incremental refresh is set on a query that is not SQL
  template: 'Query ''{query}'': incremental refresh is only supported for SQL queries. Remove `incremental:` from this query, or make it a SQL query.'
  fix: Remove `incremental:` from the query, or make it a SQL query.
  doc: Fired when a values or schema query names an `incremental:` watermark column; only SQL queries refresh incrementally.
  docs_topic: queries
