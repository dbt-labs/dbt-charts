- code: ERR-INVALID-DEFAULT-THEME
  level: error
  title: Invalid theme name in configuration
  template: '{source} ({theme!r}) is not a valid theme name. Available built-in themes: {available}.'
  doc: Fired when the configured default theme name is not a recognized built-in theme. Check
    the available theme names and correct the configuration.
  docs_topic: board
  hint: suggest_close_theme
# No hint_generator — the inner uvicorn exception message is opaque; the
# rendered {detail} is the actionable signal on its own.
- code: ERR-STARTUP-FAILED
  level: error
  title: Server failed to start
  template: 'Server failed to start: {detail}.'
  doc: Fired when the uvicorn server process fails to start. The detail carries the inner
    error message from uvicorn.
  docs_topic: errors
- code: ERR-DBT-PROFILES-FORBIDDEN
  level: error
  title: dbt profiles are off limits
  template: Boards and agents can't read or change dbt profiles ({path}).
  doc: Fired when a Cloud agent file tool reads, writes, edits, moves or deletes a profiles.yml
    outside the board folders, or when a board imports one. A committed dbt profile can hold
    warehouse credentials, so Cloud never serves it to a board compile or an agent, and omits
    it from file searches. The refusal is by name, before any lookup, so it says nothing about
    whether the file exists.
  summary: Fired when a board import or agent file tool touches a dbt profiles file.
  docs_topic: errors
- code: ERR-BOARD-ALIAS
  level: error
  title: A board alias can't be served
  template: 'Alias {alias!r} {reason}'
  doc: Fired when an entry in a board's `aliases:` can't become a redirect, because it isn't
    absolute, shadows a real board, is claimed by another board too, or matches the same URLs
    as another parameterized alias. Only the boards involved fail; the rest of the project
    keeps serving. Two boards claiming one alias both fail and neither gets the redirect, so
    remove the alias from all but one board.
  summary: A board's `aliases:` entry is malformed or claimed twice.
  docs_topic: board
