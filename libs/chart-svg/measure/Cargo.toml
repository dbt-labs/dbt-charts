[package]
name = "measure"
version = "0.0.1"
edition = "2021"
description = "Text measurement from the shipped TTFs: `FontBook` and the `Measure` handle layout receives. Only layout code takes it; `scene` and `print` never see it."

[dependencies]
mdsvg = { path = "../mdsvg" }
rustybuzz = "0.20"
ttf-parser = "0.25"
