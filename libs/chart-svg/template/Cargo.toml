[package]
name = "template"
version = "0.0.1"
edition = "2021"
description = "The one shared minijinja environment for all user text: syntax, sandbox and limits, plus parse-only analysis (diagnostics with spans, dependencies). Compile never renders."

[dependencies]
# `unstable_machinery` carries no semver guarantee: the exact pin is the contract.
minijinja = { version = "=2.24.0", features = ["unstable_machinery", "custom_syntax", "fuel", "unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
