[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.format]
# Self-contained config (no extend): mirror the root's Markdown-fence exclusion.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "C4", "SIM", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204"]
ignore = [
    "E501",  # Line too long - handled by formatter
    "E402",  # Module level import not at top - needed for sys.path manipulation
    "N802",  # Function name should be lowercase - HTTP handler methods (do_GET, etc.)
    "B017",  # pytest.raises(Exception) - acceptable in tests
]
