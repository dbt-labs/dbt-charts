# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
title: Monthly Recurring Revenue
notes: Single-metric bignum pattern — hero KPI with prior-period delta support row

queries:
  hero:
    notes: Current MRR and month-over-month growth rate
    columns: [mrr, delta_pct]
    values:
      - [1840000, 0.142]

charts:
  mrr_kpi:
    notes: Hero MRR metric with month-over-month delta
    type: kpi
    query: hero
    label: Monthly Recurring Revenue
    value: mrr
    style:
      value:
        format: currency
      support:
        format: percent_delta
        tone: positive
    support:
      value: delta_pct
      label: vs last month
      glyph: "▲"

rows:
  - mrr_kpi
