[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Duplicates a subset of the root [dependency-groups].dev: the root group
# covers running the whole monorepo from the workspace root, but dbt-charts/
# also ships standalone (exported as its own repo root by
# dbt-charts/oss/copy.bara.sky), where there is no root to inherit from.
# Keep this scoped to exactly what dbt-charts/tests and mod.just use.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution; `test` recipe runs -n auto
    "pytest-timeout>=2.2.0",  # Kill hung tests
    "filelock>=3.0",  # FileLock for xdist fixture TOCTOU guard (tests/integration/conftest.py)
    "packaging>=22",  # PEP 440 parsing (tests/core/test_packaging_metadata.py)
    "dbt-core==1.11.8",  # Match the monorepo lock for the dbt-internal-API canaries
    "dbt-adapters==1.22.10",  # Match the monorepo adapter API surface
    "dbt-duckdb==1.10.0",  # Match the monorepo DuckDB adapter
    "dbt-databricks==1.12.0",  # Databricks credential-isolation tests
    "dbt-bigquery==1.11.1",  # BigQuery profile and adapter tests
    "dbt-postgres==1.10.0",  # PostgreSQL adapter tests
    "dbt-redshift==1.10.1",  # Redshift adapter tests
    "dbt-snowflake==1.11.5",  # Snowflake adapter tests
    "dbt-trino==1.10.2",  # Trino adapter tests
    "dbt-athena==1.10.2",  # Athena adapter tests
    "dbt-clickhouse==1.10.3",  # ClickHouse adapter tests
    "google-cloud-bigquery>=3.33.0",  # BigQuery warehouse-check tests
    "markdown>=3.0",  # Markdown reference and fence tests
    "mcp>=1.0.0,<2",  # MCP server tests
    "brotli>=1.2.0",  # FontTools WOFF2 inspection tests
    "openai>=1.0.0",  # OpenAI client construction tests
    "ruff>=0.16.2",  # Static-rule tests invoke Ruff directly
    "pymdown-extensions>=10.0",  # Markdown superfence integration tests
    # >=1.17: earlier releases silently drop extra_checks, disable_error_code,
    # and several enable_error_code entries below (exhaustive-match needs
    # 1.17+ specifically) rather than erroring, so a looser floor would pass
    # green while checking less than this config says it does.
    "mypy>=1.17",  # Type checking (see [tool.mypy] below)
    "types-pyyaml>=6.0",  # Type stubs for PyYAML (core/utils.py, core/compile/parse/source_map.py)
    "tach==0.35.0",  # Import-boundary enforcement; see tach.toml. Matches the root pin.
    "vulture>=2.16",  # Dead-code finder; see [tool.vulture] below. Matches the root pin.
    "pyright==1.1.411",  # CI gate on rules mypy structurally can't catch; see oss/pyrightconfig.json. Matches the root pin.
]

[project]
name = "dbt-charts"
dynamic = ["version"]
description = "dbt charts - dbt-native dashboard and visualization layer"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Fivetran, Inc."}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # typer 0.26 dropped click as a transitive dependency, reshaping the
    # TyperGroup hierarchy that cli/main.py._RootHelpGroup subclasses. The
    # override of list_commands/format_help in _RootHelpGroup relies on the
    # click-derived base being present; 0.26+ removes it and breaks every
    # `dct` command with AttributeError at startup.
    "typer>=0.12,<0.26",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.5.0",
    # Backport of stdlib importlib.resources — as_file() gains directory support
    # only in 3.12+; dbt_charts targets 3.10+. Used by
    # core/fonts.py:get_fonts_dir() to materialize a persistent real directory
    # for foreign libs (StaticFiles, vl-convert, fontTools/PIL), and by
    # agent_api/init.py for the Traversable type of the template walk.
    "importlib_resources>=6.0",
    "jinja2>=3.1.6",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "vl-convert-python>=1.9.0",
    "pygments>=2.0.0",
    "fonttools>=4.0",
    # PIL.ImageFont.getlength is used during compile-time title-width
    # measurement (core/compile/sizing._measure_title_single_line_width).
    "pillow>=9.0.0",
    # plotext 6.0.0 reshaped its API and dropped the module-level functions
    # core/render/terminal_charts.py calls (clear_data, clear_figure, plotsize,
    # theme, title, bar, plot, scatter, xticks, build — not a rename, several
    # have no 6.x module-level equivalent). The import is unguarded, so
    # `dct render --format terminal` raises AttributeError under 6.x — a runtime
    # break for wheel consumers, not just a type-checker complaint, which is why
    # this cap is a published bound (unlike the type-only openai/sqlglot caps in
    # [tool.uv] below).
    "plotext>=5.0.0,<6",
    "rich>=13.0.0",
    "sqlglot>=28.0.0",
    "duckdb>=1.0.0",  # SET file_search_path (duckdb_adapter relative-path resolution)
    # core/execute/file_source_materializer.py parses CSV/Parquet file sources
    # via pyarrow.csv / pyarrow.parquet — load-bearing, not optional. No
    # upper bound here (see [tool.uv] constraint-dependencies below for why
    # pyarrow itself is still capped for dev/type-checking resolution) — a
    # published bound would restrict every consumer's install just to quiet
    # a type checker.
    "pyarrow>=14.0.0",
    "tomli-w>=1.0.0",
    'tomli>=2.0.0; python_version < "3.11"',
    # dbt_macro_loader.py and dbt_adapter_factory.py reach into dbt-internal
    # API (MacroParser, MacroManifest, FACTORY internals,
    # generate_runtime_macro_context) to bootstrap dbt manifests/macro
    # contexts — capped below the next major since that API can be reshaped
    # without warning. dbt_manifest.py imports nothing from dbt: it reads the
    # manifest as plain JSON.
    # Canaries: test_dbt_macro_loader.py, test_dbt_adapter_factory.py.
    "dbt-core>=1.8,<2",
    "dbt-adapters>=1.20,<2",
    "dbt-common>=1.0",
    # core/execute/adapters/dbt_adapter_factory.py monkeypatches
    # dbt.adapters.duckdb.environments.Environment.initialize_db (a classmethod
    # swap, not a public API) to force read-only introspection connections.
    # Capped below the next major since that internal shape can move without
    # warning.
    "dbt-duckdb>=1.10,<2",
    # dbt's manifest serialization runs through mashumaro's msgpack mixin —
    # required at runtime for cache load/store even though the AST audit
    # only sees `import msgpack` deep inside the mashumaro dependency.
    "msgpack>=1.0.0",
    "titlecase>=2.4",
    # core/serve/server.py's /__livereload SSE endpoint imports watchfiles.awatch
    # to push browser reloads on file changes. Not pulled transitively (uvicorn is
    # declared without the [standard] extra) — load-bearing, not optional.
    "watchfiles>=1.1.1",
    "jsonschema>=4.0",
    # mdsvg is a peer package built into the dbt_charts wheel (see the
    # [tool.hatch.build.targets.wheel.force-include] entries below) rather
    # than declared as a separate PyPI package, so its runtime dependency
    # nh3 must be declared here explicitly.
    "nh3>=0.3.3",
]

[project.optional-dependencies]
# `dbt-adapters` provides the generic adapter interface only; each warehouse
# adapter ships in its own package.
bigquery = [
    "dbt-bigquery>=1.10,<2.0",
    "google-cloud-bigquery>=3.33.0",
]

snowflake = [
    "dbt-snowflake>=1.10,<2.0",
]

redshift = [
    "dbt-redshift>=1.10,<2.0",
]

databricks = [
    "dbt-databricks>=1.10,<2.0",
]

postgresql = [
    "dbt-postgres>=1.10,<2.0",
]

spark = [
    "dbt-spark>=1.10,<2.0",
]

trino = [
    "dbt-trino>=1.9,<2.0",
]

athena = [
    "dbt-athena>=1.10,<2.0",
]

clickhouse = [
    "dbt-clickhouse>=1.10,<2.0",
]

mcp = [
    # Capped at 1.x: `ai/mcp/server.py` uses the low-level decorator API
    # (`@server.list_resources()`, `@server.call_tool()`, ...), which mcp 2.0
    # removed from `mcp.server.Server`. Under 2.x the import still succeeds and
    # `dct mcp serve` dies at startup before it can speak the protocol, so the
    # client only ever sees an opaque -32000. Lift the cap with the port.
    "mcp>=1.0.0,<2",
]

server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

mkdocs-plugin = [
    "mkdocs>=1.4.0",
]

[project.scripts]
dct = "dbt_charts.cli.main:app"

# Duplicates a subset of the root [tool.pytest.ini_options]: the root config
# covers running the whole monorepo (testpaths across every package, Django
# settings for apps/cloud, namespace-package handling to avoid module-name
# collisions between different packages' tests/ directories). dbt-charts/ also
# ships standalone, where there is no root to inherit from — and pytest
# resolves ini options from the nearest pyproject.toml to the invoked path,
# so a [tool.pytest.ini_options] here fully shadows the root's for any
# dbt-charts-scoped run rather than layering on top of it. Keep this
# self-sufficient, not partial: everything dbt-charts/tests actually needs to
# collect and pass, whether run from here, standalone, or dbt-charts-scoped
# inside the monorepo.
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: dbt-charts/tests/ has no __init__.py (AGENTS.md forbids
# adding one), so conftest.py's relative imports (`from ._paths import ...`)
# need importlib's namespace-package-aware resolution instead of prepend
# mode's __init__.py walk. loadgroup: xdist_group markers
# (test_no_path_mutation.py, test_wheel_asset_inventory.py,
# test_packaging_mdsvg.py, test_oss_install_smoke.py) pin specific tests to
# one worker for isolation; the default --dist=load ignores that marker.
addopts = "--import-mode=importlib --dist=loadgroup"
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests as requiring network access (deselect with '-m \"not network\"')",
    "windows: opt-in — test asserted Windows-safe; the release-gating Windows subset is exactly `-m windows`",
    "docs_derived: computed from apps/docs/** content (e.g. DOCS_DIR); selected by docs.yml's docs lane, whose path filter — unlike the main test matrix — includes apps/docs/**",
]

# uv's default rebuild cache keys (pyproject.toml/setup.py/setup.cfg) don't
# cover src/dbt_charts either — that stays live because it's an editable
# `packages` entry, resolved by a `.pth` redirect, not a cached build output.
# The cross-tree force-included libs/d3-format/libs/markdown-svg source has
# no such redirect (force-include always copies), so an edit there doesn't
# invalidate the cached build on its own — `uv sync` would keep serving the
# stale site-packages copy. Declaring their source globs here makes plain
# `uv sync` pick up edits too.
[tool.uv]
# Dev/type-checking resolution only (type-only breaks — a *runtime* API break
# is a published [project] bound instead, see plotext above). uv only honors
# constraint-dependencies from the workspace root, so these entries protect
# the standalone export, where dbt-charts is its own root. The root
# pyproject.toml carries the same numpy/pyarrow/openai ceilings for the
# monorepo's shared lock; sqlglot appears only here because libs/asql already
# bounds it for the monorepo but isn't in the export.
constraint-dependencies = [
    # Transitive only (duckdb's stub surface pulls it in) — no direct
    # import in src/dbt_charts needs it. numpy>=2.5 ships __init__.pyi with
    # unconditional PEP 695 `type` statements, which mypy cannot parse
    # under python_version = "3.10" (that syntax needs 3.12+ regardless of
    # the *running* interpreter) — dying before it checks a single file.
    # Capped at the last release before that stub change so `[tool.mypy]`
    # below can target 3.10 without vendoring a numpy pin the rest of the
    # dependency tree doesn't otherwise need.
    "numpy<2.5",
    # A direct import (core/execute/{cache_composition,
    # file_source_materializer,trivial_local_cache}.py). pyarrow>=25
    # dropped the py.typed marker pyarrow<25 shipped — capped at the last
    # typed release so pyright's reportMissingTypeStubs (and mypy's
    # disallow_untyped_calls, which stops seeing anything to flag once the
    # module is untyped Any) both keep checking these modules for real,
    # instead of a per-import suppression that would silently swallow the
    # next unrelated typing regression too.
    "pyarrow<25",
    # openai>=3 swapped its HTTP transport from httpx to the separate httpx2
    # fork, so its exception constructors (APITimeoutError, RateLimitError, …)
    # now type their request/response params as httpx2.Request/Response. The
    # ai tests build those exceptions from plain httpx.Request/Response for
    # error-classification coverage, which then fails pyright ("httpx._models
    # is not assignable to httpx2._models"). oss/uv.lock holds the export on
    # the 2.x line today; this ceiling is what keeps the next re-lock from
    # walking into 3.x before those mocks are ported off httpx.
    "openai<3",
    # sqlglot 30.x reshaped its expression type surface (Expr vs Expression,
    # Query no longer assignable where an Expression is expected) and breaks
    # core/column_refs.py under pyright. libs/asql already bounds the monorepo
    # to sqlglot 28.x (>=28.0.0,<29.0.0) but isn't in the OSS export, so this
    # entry is what keeps a re-lock of oss/uv.lock on that same 28.x line the
    # monorepo type-checks against.
    "sqlglot<29",
]
cache-keys = [
    { file = "pyproject.toml" },
    # `**/*` not `**/*.py`: force-include copies the whole tree, so a non-Python
    # file moves the render without moving a .py-globbed key -- and the visual
    # suite's freshness guard would then fire in CI with a remedy no runner can
    # act on. See dbt-charts/tests/visual/freshness.py.
    { file = "libs/d3-format/src/d3_format/**/*" },
    { file = "libs/markdown-svg/src/mdsvg/**/*" },
]

# Duplicates a subset of the root [tool.vulture]: the root config scans the
# whole monorepo; this one is what the standalone export runs (`just lint`,
# cwd = repo root there). Not used from inside the monorepo — the root
# config already covers dbt-charts/ from its own [tool.vulture].paths.
[tool.vulture]
min_confidence = 80
sort_by_size = true
paths = ["src", "tests", "scripts", "vulture-whitelist.py"]
exclude = [
    "**/.venv/**",
    "**/build/**",
    "**/__pycache__/**",
]
# Ported from the root [tool.vulture].ignore_names entry for this exact test:
# the fixture activates its mock/setup as a side effect, the test body never
# reads the returned value.
ignore_names = ["patch_mcp_clients"]  # tests/cli/test_mcp_init.py
ignore_decorators = [
    "@app.command",                       # Top-level Typer commands (e.g. playground)
    "@*_app.command",                     # Typer subcommand groups: init_app, inspect_app, mcp_app
    "@*_app.callback",                    # Typer group callbacks (init_app.callback default)
    "@server.list_resources",             # MCP protocol handlers
    "@server.list_resource_templates",
    "@server.read_resource",
    "@server.list_tools",
    "@server.call_tool",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "."
local_scheme = "no-local-version"
# Filter tags at the git level so setuptools_scm only sees canonical
# `dbt-charts-vX.Y.Z` semver tags for this package. Every workspace member
# in this monorepo uses a self-describing tag prefix (`<pkg>-v<ver>`) so
# there is no shared `v*` namespace to fight over. Without this filter,
# the default `git describe --tags` would match sibling packages' tags
# (e.g. `vscode-ext-v0.1.3` for the IDE extension) and the default
# tag_regex would strip the prefix, polluting dbt-charts's computed version.
#
# setuptools_scm's default tag_regex already handles the `<prefix>-v`
# shape — it strips the leading `dbt-charts-` and extracts `0.1.0` from
# `dbt-charts-v0.1.0`, so no separate tag_regex override is needed here.
# `release.yml`'s "Refuse non-semver release tags" step gates the same
# shape on the author side.
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "dbt-charts-v[0-9]*.[0-9]*.[0-9]*",
]
# Docker builds (`apps/cloud/Dockerfile`, `apps/docs/Dockerfile`,
# `apps/playground/Dockerfile`) build the dbt-charts wheel without .git in
# context (`.git` is `.dockerignore`d). T5's release pipeline will tag
# real versions; this fallback keeps non-release builds from crashing.
# Note: this is only honored when there is no git context at all (e.g.
# building from a tarball with `.git/` missing). With git present but
# zero matching tags, setuptools_scm falls back to its own bootstrap
# state — `0.0.1.dev<N>` where N is total reachable commit count —
# instead of using this string verbatim.
fallback_version = "0.0.0"

# Layout-coupled: package roots and exclude/force-include below reference
# on-disk paths. Update in lock-step with any structural move of `src/dbt_charts/`
# or the peer `d3_format`/`mdsvg` packages.
[tool.hatch.build.targets.wheel]
packages = ["src/dbt_charts"]
# Markdown discipline: exclude all .md by default, then force-include the
# runtime-loaded set. For directories with mixed .md + non-.md content that
# all ships together (skills tree, _init_templates tree), exclude the whole
# subtree from the package walk and force-include the directory so hatchling
# doesn't double-write the non-.md siblings.
exclude = [
    "**/*.md",
    "src/dbt_charts/ai/skills/**",
    "src/dbt_charts/ai/prompts/**",
    "src/dbt_charts/agent_api/_init_templates/**",
]

# `d3_format`/`mdsvg` (peer packages, not `dbt_charts` submodules) can't join
# `packages` above: hatchling's `packages`/`only-include` hard-rejects any
# path starting with `..` (`BuilderConfig.only_include` in
# hatchling/builders/config.py), and a same-root symlink to reach them
# checks out as a literal text file on an unprivileged Windows checkout —
# hatchling's `packages` handling then silently ships that text file as the
# "package" instead of erroring. `force-include` accepts cross-tree `../`
# paths directly with no symlink needed, so both are force-included instead.
# This previously needed a custom build hook to skip force-include on
# editable builds, because `libs/markdown-svg`/`libs/d3-format` were ALSO
# separate uv workspace members with their own live editable install —
# hatchling's editable builder applies `force-include` too, and the
# resulting frozen copy shadowed that other live install. Now that neither
# library is a separate workspace member, there is no competing install left
# to shadow; dbt-charts' own copy is the only one, so no hook is needed. The
# trade-off: editing `libs/d3-format`/`libs/markdown-svg` source needs a
# plain `uv sync` to show up in an editable dbt-charts install (force-include
# always copies, for both wheel targets, unlike `src/dbt_charts` itself which
# is a live-editable `packages` entry) — that `uv sync` alone is enough, and
# does not need `--reinstall-package`, only because the `[tool.uv] cache-keys`
# entries above extend uv's rebuild cache to those two source trees; uv's
# default cache keys only cover this project's own files, so without that
# declaration a plain `uv sync` would silently keep serving a stale copy.
# An environment driven without `uv run` (a venv interpreter invoked directly,
# an IDE test runner) never consults those cache keys at all, so the visual
# suite additionally refuses to render from a copy that does not match the
# checkout -- see `dbt-charts/tests/visual/freshness.py`.
[tool.hatch.build.targets.wheel.force-include]
# Runtime-loaded docs (read at runtime via importlib.resources / Path.read_text).
"src/dbt_charts/DBT_CHARTS_SYNTAX.md" = "dbt_charts/DBT_CHARTS_SYNTAX.md"
"src/dbt_charts/agent_api/docs/yaml-reference.md" = "dbt_charts/agent_api/docs/yaml-reference.md"
"src/dbt_charts/agent_api/docs/error-reference.md" = "dbt_charts/agent_api/docs/error-reference.md"
"src/dbt_charts/agent_api/docs/warning-reference.md" = "dbt_charts/agent_api/docs/warning-reference.md"
# Whole-directory force-includes (paired with the matching `**` exclude above).
"src/dbt_charts/agent_api/_init_templates" = "dbt_charts/agent_api/_init_templates"
"src/dbt_charts/ai/skills" = "dbt_charts/ai/skills"
"src/dbt_charts/ai/prompts" = "dbt_charts/ai/prompts"
"libs/markdown-svg/src/mdsvg" = "mdsvg"
"libs/d3-format/src/d3_format" = "d3_format"

# Artifact-audit policy consumed by `.github/scripts/check_published_artifact.py`
# (wired into the smoke-install job by T2).
[tool.dbt_charts_boundary]
allowed_roots = ["src/dbt_charts", "libs/markdown-svg/src/mdsvg", "libs/d3-format/src/d3_format"]
forbidden_name_substrings = ["us-west1-python.pkg.dev", "internal-eng@", "tasks/workstreams/", "ai_notes/"]
forbidden_fixture_path_roots = ["tasks/", "apps/", "ai_notes/", ".claude/", ".agents/", ".cursor/"]
forbidden_token_prefixes = ["ghp_", "github_pat_", "sk-", "sk-ant-", "AKIA", "BEGIN PRIVATE KEY"]
# Regex patterns that must not match wheel/sdist content. Use single-quoted
# TOML literal strings so backslashes (\b, \() survive verbatim. Enforces
# dbt-charts/AGENTS.md's "no internal decision identifiers in shipped artifacts"
# rule and the parallel ban on personal-name and internal-repo-path comments.
forbidden_content_regexes = [
    # AI-written decision-doc refs (D12, D14, D18, …) and task-letter refs
    # (`Task C`, `Task E`). Decision refs ship in two equivalent shapes:
    #   `(D14)` / `(D14 invariant 1)` / `(D14, D15)` — paren-wrapped
    #   `D-019` / `D-053` — hyphenated, often inline (e.g. "the D-019
    #       trigger fires when …")
    # Both bypass scrubbing if only one shape is gated. The paren regex
    # requires 2+ digits so the d3-library `(D3 format string)` phrasing
    # in DBT_CHARTS_SYNTAX.md / yaml-reference.md doesn't false-fire; the
    # hyphenated regex is anchored on `D-` + digits so plain alphanumeric
    # IDs (`ERR-001`, `node-1d-019`) don't collide.
    '\(D[0-9]{2,}\b',
    '\bD-[0-9]+\b',
    '\bTask [A-Z]\b',
    # Personal names and internal experiment / project names.
    # `chart-lab\b` so `chart-label` doesn't false-fire; `\b` works on the
    # trailing side because hyphen is a non-word char.
    '\bRJ\b',
    'chart-lab\b',
    'chart-workbench',
    'company-overview',
    # Internal repo paths that don't ship in the wheel — references to them
    # in shipped artifacts decay into dangling pointers.
    'design/chart-briefs',
    'design/experiments',
    'apps/docs/',
    # Internal planning-doc filenames (decisions.md, spec.md, design.md). Keep
    # `index.md` un-flagged — the wheel intentionally ships an `index.md`
    # template under `agent_api/_init_templates/`.
    '\bdecisions\.md\b',
    '\bspec\.md\b',
    '\bdesign\.md\b',
]
# Proprietary profiler module paths that must be absent from the OSS PyPI wheel.
# These paths are substring-matched against wheel RECORD entry paths so they
# catch the module regardless of nesting depth. After the super_schema
# extraction (into libs/super-schema/), the audit acts as a regression guard:
# any accidental re-addition of a profiler module triggers a build failure.
forbidden_module_paths = [
    "core/inspect/inspector.py",
    "core/inspect/sources/super_schema.py",
    "core/inspect/storage.py",
    "core/inspect/context_contract.py",
    "core/inspect/semantic_detector.py",
    "core/inspect/quality_detector.py",
    "core/inspect/grain_detector.py",
    "core/inspect/relationship_detector.py",
    "core/inspect/relationship_context.py",
    "core/inspect/relationship_warnings.py",
    "core/inspect/join_multiplicity.py",
    "core/inspect/audit.py",
    "core/inspect/connection.py",
    "core/inspect/query_builder.py",
    "core/inspect/profile_utils.py",
    "core/inspect/discovery.py",
    "core/inspect/instrumentation.py",
    "core/inspect/description_merge.py",
    "core/inspect/schema_context.py",
    "core/inspect/staleness.py",
]
# The private dbt-charts-super-schema package is probed via
# importlib.util.find_spec at startup and imported conditionally when
# present. The AST audit sees the import names but the package is
# intentionally not declared as a runtime dep — it is a private plugin,
# not a PyPI dep. Absent → dbt-only mode; present → warm-cache enrichment.
# `google` is the lazy `from google.cloud import bigquery` behind the BigQuery
# feature gate in sql_adapter.py; google-cloud-bigquery is the optional
# `bigquery` extra, not a runtime dep, so the AST audit needs the carve-out.
# `databricks` (databricks-sql-connector) is imported by the lazily-loaded
# databricks_connection_manager.py behind the databricks adapter gate; it is a
# transitive dep of the optional `databricks` extra, not a runtime dep.
# `openai` is the lazy import inside ai/openai_gateway.py's OpenAIGateway. No
# `dct` verb reaches it — the gateway exists for in-repo hosts (Cloud,
# Playground, evals), each of which declares openai itself. (A lIe does not
# use it; it carries its own client, which is why the follow-up folds in that
# consolidation.)
# Deferred, not undecided: extracting ai/openai_gateway.py was priced against
# what removing this one entry buys and judged not worth it on that basis
# alone. The reasons that do stand alone — core ships an importable-but-
# unrunnable surface, and the repo has three OpenAI client wrappers — are
# tracked in a follow-up.
allowed_external_imports = [
    "dbt_charts_super_schema",
    "google",
    "databricks",
    "openai",
]
# Declared deps that the wheel never imports directly but that another
# declared dep loads at runtime. The audit's AST scan can't see this case.
#   `msgpack` — used by `mashumaro` inside `dbt-adapters`' manifest
#       serializer (cache load/store path). Removing it breaks dbt builds.
transitively_required_dependencies = ["msgpack"]

[tool.mypy]
python_version = "3.10"
namespace_packages = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
extra_checks = true
disallow_untyped_calls = true
warn_unreachable = true
disallow_any_unimported = true
disable_error_code = ["import-untyped"]
enable_error_code = [
    "truthy-bool",
    "redundant-expr",
    "possibly-undefined",
    "redundant-self",
    "unused-awaitable",
    "narrowed-type-not-subtype",
    "deprecated",
    "unimported-reveal",
    "exhaustive-match",
    "ignore-without-code",
]
exclude = ["tests/"]

# Modules that interact with untyped third-party libraries (pygments, dbt_charts_super_schema)
# have no stubs available; suppress disallow_any_unimported only where unavoidable.
# The three execute/ modules name `pyarrow.Table` in signatures: pyarrow ships a
# py.typed marker but its `__init__.pyi` is still a placeholder whose
# `__getattr__` returns Any, so every such annotation reads as an unfollowed
# import. Naming the real type is worth more than the check it costs here; drop
# these entries once pyarrow's stubs are real.
[[tool.mypy.overrides]]
module = [
    "dbt_charts.integrations.highlighting",
    "dbt_charts.core.inspect.resolver",
    "dbt_charts.core.inspect.cache_factory",
    "dbt_charts.core.execute.cache_backend",
    "dbt_charts.core.execute.file_source_materializer",
    "dbt_charts.core.execute.trivial_local_cache",
]
disallow_any_unimported = false
