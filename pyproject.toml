[build-system]
requires = ["maturin>=1.15,<2", "setuptools-scm>=8"]
build-backend = "_build_backend"
backend-path = ["."]

# Duplicates a subset of the root [dependency-groups].dev: the root group
# covers running the whole monorepo from the workspace root, but dbt-charts/
# also ships standalone (exported as its own repo root by
# dbt-charts/oss/copy.bara.sky), where there is no root to inherit from.
# Keep this scoped to exactly what dbt-charts/tests and mod.just use.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution; `test` recipe runs -n auto
    "pytest-timeout>=2.2.0",  # Kill hung tests
    "pytest-postgresql>=9.0.0",  # tests only: throwaway Postgres cluster
    "psycopg>=3.1",  # tests only
    "pillow>=9.0.0",  # tests only
    "pyarrow>=14.0.0",  # tests only: writes CSV/Parquet fixtures
    "filelock>=3.0",  # FileLock for xdist fixture TOCTOU guard (tests/integration/conftest.py)
    "packaging>=22",  # PEP 440 parsing (tests/core/test_packaging_metadata.py)
    "dbt-core==1.12.5",  # Match the monorepo lock for the dbt-internal-API canaries
    "dbt-adapters==1.24.5",  # Match the monorepo adapter API surface
    "dbt-duckdb==1.10.0",  # Match the monorepo DuckDB adapter
    "dbt-databricks==1.12.6",  # Databricks credential-isolation tests
    "dbt-bigquery==1.11.1",  # BigQuery profile and adapter tests
    "dbt-postgres==1.10.0",  # PostgreSQL adapter tests
    "dbt-redshift==1.11.1",  # Redshift adapter tests
    "dbt-snowflake==1.11.5",  # Snowflake adapter tests
    "trino==0.338.0",  # Trino driver tests
    # Excluded on Windows: it pins mmh3<4.2, which has no cp313 Windows wheel
    # and would compile from source (minutes); the Windows subset needs no Athena.
    "dbt-athena==1.10.2; sys_platform != 'win32'",  # Athena adapter tests
    "dbt-clickhouse==1.10.3",  # ClickHouse adapter tests
    "dbt-sqlserver==1.11.0",  # SQL Server adapter tests (needs dbt-adapters>=1.24.1)
    "dbt-fabric==1.10.0",  # Fabric adapter tests
    "google-cloud-bigquery>=3.33.0",  # BigQuery warehouse-check tests
    "markdown>=3.0",  # Markdown reference and fence tests
    "mcp>=1.0.0,<2",  # MCP server tests
    "streamlit>=1.51.0",  # Streamlit integration tests
    "brotli>=1.2.0",  # FontTools WOFF2 inspection tests
    "openai>=1.0.0",  # OpenAI client construction tests
    "ruff>=0.16.10",  # Static-rule tests invoke Ruff directly
    "pymdown-extensions>=10.0",  # Markdown superfence integration tests
    # >=1.17: earlier releases silently drop extra_checks, disable_error_code,
    # and several enable_error_code entries below (exhaustive-match needs
    # 1.17+ specifically) rather than erroring, so a looser floor would pass
    # green while checking less than this config says it does.
    "mypy>=1.17",  # Type checking (see [tool.mypy] below)
    "types-pyyaml>=6.0",  # Type stubs for PyYAML (core/utils.py, core/compile/parse/source_map.py)
    "tach==0.35.3",  # Import-boundary enforcement; see tach.toml. Matches the root pin.
    "vulture>=2.16",  # Dead-code finder; see [tool.vulture] below. Matches the root pin.
    "pyright==1.1.414",  # CI gate on rules mypy structurally can't catch; see oss/pyrightconfig.json. Matches the root pin.
]

[project]
name = "dbt-charts"
dynamic = ["version"]
description = "Declarative YAML around SQL for dbt-native dashboards: easy for agents to write, easy for humans to audit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Fivetran, Inc."}
]
keywords = ["dbt", "dashboards", "data-visualization", "charts", "business-intelligence", "sql", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer>=0.27,<0.28",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "annotated-types>=0.4.0",
    # Backport of stdlib importlib.resources — as_file() gains directory support
    # only in 3.12+. Used by
    # core/fonts.py:get_fonts_dir() to materialize a persistent real directory
    # for foreign libs (StaticFiles, vl-convert, fontTools), and by
    # agent_api/init.py for the Traversable type of the template walk.
    "importlib_resources>=6.0",
    "jinja2>=3.1.6",
    # <1: httpx 1.0 drops httpx.LocalProtocolError, which
    # cloud_client/errors.py references at module import time. A plain
    # re-lock will not pick a pre-release (uv resolves stable releases by
    # default) -- the real exposure is httpx 1.0 final, or an explicit
    # --pre install, either of which breaks `dct` import entirely without
    # this bound.
    "httpx>=0.24.0,<1",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "vl-convert-python>=1.9.0",
    "pygments>=2.21.0",
    "fonttools>=4.0",
    # plotext 6.0.0 reshaped its API and dropped the module-level functions
    # core/render/terminal_charts.py calls (clear_data, clear_figure, plotsize,
    # theme, title, bar, plot, scatter, xticks, build — not a rename, several
    # have no 6.x module-level equivalent). The import is unguarded, so
    # `dct render --format terminal` raises AttributeError under 6.x — a runtime
    # break for wheel consumers, not just a type-checker complaint, which is why
    # this cap is a published bound (unlike the type-only openai cap in
    # [tool.uv] below).
    "plotext>=5.0.0,<6",
    "rich>=13.0.0",
    # 30.x split the node hierarchy into Expr/Expression; core annotates
    # against exp.Expr, which 28.x does not define.
    "sqlglot>=30.0.0",
    "duckdb>=1.0.0",  # SET file_search_path (duckdb_adapter relative-path resolution)
    # Builds Arrow from Python values without pyarrow (core/execute/arrow_ingest.py).
    "nanoarrow>=0.9.0",
    "tomli-w>=1.0.0",
    # core/compile/config.py's default_cache_path() locates the per-user cache
    # directory for the query-result cache `dct render` and `dct serve` use by
    # default; execute/drivers/_fetch.py finds dbt's shared driver cache with it.
    "platformdirs>=4.0",
    # dbt_macro_loader.py and dbt_adapter_factory.py reach into dbt-internal
    # API (MacroParser, MacroManifest, FACTORY internals,
    # generate_runtime_macro_context) to bootstrap dbt manifests/macro
    # contexts — capped below the next major since that API can be reshaped
    # without warning. dbt_manifest.py imports nothing from dbt: it reads the
    # manifest as plain JSON. Canaries: test_dbt_macro_loader.py,
    # test_dbt_adapter_factory.py.
    "dbt-core>=1.8,<2",
    "dbt-adapters>=1.20,<2",
    "dbt-common>=1.0",
    # core/execute/adapters/dbt_adapter_factory.py monkeypatches
    # dbt.adapters.duckdb.environments.Environment.initialize_db (a classmethod
    # swap, not a public API) to force read-only introspection connections.
    # Capped below the next major since that internal shape can move without
    # warning.
    "dbt-duckdb>=1.10,<2",
    # dbt's manifest serialization runs through mashumaro's msgpack mixin —
    # required at runtime for cache load/store even though the AST audit
    # only sees `import msgpack` deep inside the mashumaro dependency.
    "msgpack>=1.0.0",
    "titlecase>=2.4",
    # core/serve/server.py's /__livereload SSE endpoint imports watchfiles.awatch
    # to push browser reloads on file changes. Not pulled transitively (uvicorn is
    # declared without the [standard] extra) — load-bearing, not optional.
    "watchfiles>=1.1.1",
    "jsonschema>=4.0",
    # mdsvg is a peer package built into the dbt_charts wheel (see
    # `_build_backend.py`) rather than declared as a separate PyPI package,
    # so its runtime dependency nh3 must be declared here explicitly.
    "nh3>=0.3.3",
    # 1.0.594 is the first dbt-protos release carrying events/charts.proto.
    "dbt-protos>=1.0.594",
    "dbtlabs-vortex>=0.2.0",
]

[project.urls]
Homepage = "https://www.getdbt.com/product/dbtcharts"
Documentation = "https://docs.dbtcharts.com"
Playground = "https://play.dbtcharts.com"
Repository = "https://github.com/dbt-labs/dbt-charts"
Issues = "https://github.com/dbt-labs/dbt-charts/issues"
Changelog = "https://github.com/dbt-labs/dbt-charts/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# `dbt-adapters` provides the generic adapter interface only; each warehouse
# adapter ships in its own package.
bigquery = [
    "dbt-bigquery>=1.10,<2.0",
    "google-cloud-bigquery>=3.33.0",
]

snowflake = [
    "dbt-snowflake>=1.10,<2.0",
]

redshift = [
    "dbt-redshift>=1.11.1,<2.0",
]

databricks = [
    "dbt-databricks>=1.12.1,<1.12.7",
]

postgresql = [
    "dbt-postgres>=1.10,<2.0",
]

spark = [
    "dbt-spark>=1.10,<2.0",
]

trino = [
    "trino>=0.334",
]

athena = [
    "dbt-athena>=1.10,<2.0",
]

clickhouse = [
    "dbt-clickhouse>=1.10,<2.0",
]

# dbt-sqlserver 1.12 made its drivers extras, and its default backend is
# pyodbc, so the bare package fails at connect. The host also needs Microsoft
# ODBC Driver 17 or 18, which pip cannot install.
sqlserver = [
    "dbt-sqlserver[pyodbc]>=1.10,<2.0",
]

fabric = [
    "dbt-fabric>=1.9,<2.0",
]

# dbt v2's lake compute driver has no PyPI build. dbt publishes it on its own CDN
# and `execute/drivers/_fetch.py` downloads it on first use, checksum-pinned, so
# this extra installs the machinery to load and verify one: the ADBC driver
# manager and zstd for the compressed artifact. platformdirs, which finds the
# cache dbt shares, is a base dependency.
lakecompute = [
    "adbc-driver-manager>=1.12",
    "zstandard>=0.22",
]

mcp = [
    # Capped at 1.x: `ai/mcp/server.py` uses the low-level decorator API
    # (`@server.list_resources()`, `@server.call_tool()`, ...), which mcp 2.0
    # removed from `mcp.server.Server`. Under 2.x the import still succeeds and
    # `dct mcp serve` dies at startup before it can speak the protocol, so the
    # client only ever sees an opaque -32000. Lift the cap with the port.
    "mcp>=1.0.0,<2",
]

server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

streamlit = [
    "streamlit>=1.51.0",
]

mkdocs-plugin = [
    "mkdocs>=1.4.0",
]

[project.scripts]
dct = "dbt_charts.cli.main:app"

# Duplicates a subset of the root [tool.pytest.ini_options]: the root config
# covers running the whole monorepo (testpaths across every package, Django
# settings for apps/cloud, namespace-package handling to avoid module-name
# collisions between different packages' tests/ directories). dbt-charts/ also
# ships standalone, where there is no root to inherit from — and pytest
# resolves ini options from the nearest pyproject.toml to the invoked path,
# so a [tool.pytest.ini_options] here fully shadows the root's for any
# dbt-charts-scoped run rather than layering on top of it. Keep this
# self-sufficient, not partial: everything dbt-charts/tests actually needs to
# collect and pass, whether run from here, standalone, or dbt-charts-scoped
# inside the monorepo.
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: dbt-charts/tests/ has no __init__.py (AGENTS.md forbids
# adding one), so conftest.py's relative imports (`from ._paths import ...`)
# need importlib's namespace-package-aware resolution instead of prepend
# mode's __init__.py walk. loadgroup: xdist_group markers
# (test_no_path_mutation.py, test_wheel_asset_inventory.py,
# test_packaging_mdsvg.py, test_oss_install_smoke.py) pin specific tests to
# one worker for isolation; the default --dist=load ignores that marker.
addopts = "--import-mode=importlib --maxprocesses=6 --dist=loadgroup"
timeout = 60
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "windows: opt-in — test asserted Windows-safe; the release-gating Windows subset is exactly `-m windows`",
    "docs_derived: computed from apps/docs/** content (e.g. DOCS_DIR); selected by docs.yml's docs lane, whose path filter — unlike the main test matrix — includes apps/docs/**",
]

# uv's default rebuild cache keys cover only this project's own files. The
# extension's Rust sources and the build backend live elsewhere, so a plain
# `uv sync` would keep serving a stale `_engine` without these. (Python under
# src/dbt_charts and the vendored libs is live through `.pth` redirects.)
[tool.uv]
# Dev/type-checking resolution only (type-only breaks — a *runtime* API break
# is a published [project] bound instead, see plotext above). uv only honors
# constraint-dependencies from the workspace root, so these entries protect
# the standalone export, where dbt-charts is its own root. The root
# pyproject.toml carries the same numpy/openai ceilings for the
# monorepo's shared lock.
constraint-dependencies = [
    # Transitive only (duckdb's stub surface pulls it in) — no direct
    # import in src/dbt_charts needs it. numpy>=2.5 ships __init__.pyi with
    # unconditional PEP 695 `type` statements, which mypy cannot parse
    # under python_version = "3.11" (that syntax needs 3.12+ regardless of
    # the *running* interpreter) — dying before it checks a single file.
    # Capped at the last release before that stub change so `[tool.mypy]`
    # below can target 3.11 without vendoring a numpy pin the rest of the
    # dependency tree doesn't otherwise need.
    "numpy<2.5",
    # openai>=3 swapped its HTTP transport from httpx to the separate httpx2
    # fork, so its exception constructors (APITimeoutError, RateLimitError, …)
    # now type their request/response params as httpx2.Request/Response. The
    # ai tests build those exceptions from plain httpx.Request/Response for
    # error-classification coverage, which then fails pyright ("httpx._models
    # is not assignable to httpx2._models"). oss/uv.lock holds the export on
    # the 2.x line today; this ceiling is what keeps the next re-lock from
    # walking into 3.x before those mocks are ported off httpx.
    "openai<3",
    # sqlglot majors reshape the expression type surface (28 -> 30 did); this
    # keeps a re-lock of oss/uv.lock on the major the monorepo type-checks
    # against, the same ceiling libs/asql publishes for the shared lock.
    "sqlglot<31",
]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "_build_backend.py" },
    { file = "libs/chart-svg/*/src/**/*" },
    { file = "libs/chart-svg/*/assets/**/*" },
    { file = "src/dbt_charts/core/defaults/palettes/tone/*.yml" },
    { file = "libs/chart-svg/*/Cargo.toml" },
    { file = "libs/chart-svg/python/Cargo.lock" },
]

# Duplicates a subset of the root [tool.vulture]: the root config scans the
# whole monorepo; this one is what the standalone export runs (`just lint`,
# cwd = repo root there). The monorepo's `just ci-lint` also runs it.
[tool.vulture]
min_confidence = 80
sort_by_size = true
paths = ["src", "tests", "scripts", "vulture-whitelist.py"]
exclude = [
    "**/.venv/**",
    "**/build/**",
    "**/__pycache__/**",
]
# Ported from the root [tool.vulture].ignore_names entry for this exact test:
# the fixture activates its mock/setup as a side effect, the test body never
# reads the returned value.
ignore_names = ["patch_mcp_clients"]  # tests/cli/test_mcp_init.py
ignore_decorators = [
    "@app.command",                       # Top-level Typer commands (e.g. playground)
    "@*_app.command",                     # Typer subcommand groups: init_app, inspect_app, mcp_app
    "@*_app.callback",                    # Typer group callbacks (init_app.callback default)
    "@server.list_resources",             # MCP protocol handlers
    "@server.list_resource_templates",
    "@server.read_resource",
    "@server.list_tools",
    "@server.call_tool",
]

# One native module: `dbt_charts._engine` is the PyO3 crate at
# libs/chart-svg/python (cp311-abi3, one wheel per platform). The build backend
# is `_build_backend.py`, a thin wrapper over maturin that adds the git-tag
# version (maturin has none) and ships the vendored `mdsvg`/`d3_format` peer
# packages (maturin cannot include paths outside this directory).
[tool.maturin]
manifest-path = "libs/chart-svg/python/Cargo.toml"
module-name = "dbt_charts._engine"
python-source = "src"
features = ["pyo3/extension-module"]
sbom = { rust = false }
# Markdown shipped in the wheel is exactly what the runtime reads (skills,
# prompts, the syntax guide); every other .md is dev context.
exclude = [
    "**/AGENTS.md",
    "**/CLAUDE.md",
    "src/dbt_charts/core/inspect/*.md",
    "src/dbt_charts/core/diagnostics/MESSAGING.md",
    "src/dbt_charts/core/render/fonts/README.md",
]
# The sdist rebuilds its wheel through the backend wrapper, which must ship.
include = [
    { path = "_build_backend.py", format = "sdist" },
    { path = "libs/markdown-svg/src/mdsvg/**/*", format = "sdist" },
    { path = "libs/d3-format/src/d3_format/**/*", format = "sdist" },
]

# Artifact-audit policy consumed by `.github/scripts/check_published_artifact.py`
# (wired into the smoke-install job by T2).
[tool.dbt_charts_boundary]
allowed_roots = ["src/dbt_charts", "libs/markdown-svg/src/mdsvg", "libs/d3-format/src/d3_format"]
native_extension = "dbt_charts/_engine"
forbidden_name_substrings = ["us-west1-python.pkg.dev", "internal-eng@", "tasks/workstreams/", "ai_notes/"]
forbidden_fixture_path_roots = ["tasks/", "apps/", "ai_notes/", ".claude/", ".agents/", ".cursor/"]
forbidden_token_prefixes = ["ghp_", "github_pat_", "sk-", "sk-ant-", "AKIA", "BEGIN PRIVATE KEY"]
# Regex patterns that must not match wheel/sdist content. Use single-quoted
# TOML literal strings so backslashes (\b, \() survive verbatim. Enforces
# dbt-charts/AGENTS.md's "no internal decision identifiers in shipped artifacts"
# rule and the parallel ban on personal-name and internal-repo-path comments.
forbidden_content_regexes = [
    # AI-written decision-doc refs (D12, D14, D18, …) and task-letter refs
    # (`Task C`, `Task E`). Decision refs ship in two equivalent shapes:
    #   `(D14)` / `(D14 invariant 1)` / `(D14, D15)` — paren-wrapped
    #   `D-019` / `D-053` — hyphenated, often inline (e.g. "the D-019
    #       trigger fires when …")
    # Both bypass scrubbing if only one shape is gated. The paren regex
    # requires 2+ digits so the d3-library `(D3 format string)` phrasing
    # in DBT_CHARTS_SYNTAX.md and model docstrings doesn't false-fire; the
    # hyphenated regex is anchored on `D-` + digits so plain alphanumeric
    # IDs (`ERR-001`, `node-1d-019`) don't collide.
    '\(D[0-9]{2,}\b',
    '\bD-[0-9]+\b',
    '\bTask [A-Z]\b',
    # Personal names and internal experiment / project names.
    # `chart-lab\b` so `chart-label` doesn't false-fire; `\b` works on the
    # trailing side because hyphen is a non-word char.
    '\bRJ\b',
    'chart-lab\b',
    'chart-workbench',
    'company-overview',
    # Internal repo paths that don't ship in the wheel — references to them
    # in shipped artifacts decay into dangling pointers.
    'design/chart-briefs',
    'design/experiments',
    'apps/docs/',
    # Internal planning-doc filenames (decisions.md, spec.md, design.md). Keep
    # `index.md` un-flagged — the wheel intentionally ships an `index.md`
    # template under `agent_api/_init_templates/`.
    '\bdecisions\.md\b',
    '\bspec\.md\b',
    '\bdesign\.md\b',
]
# Proprietary profiler module paths that must be absent from the OSS PyPI wheel.
# These paths are substring-matched against wheel RECORD entry paths so they
# catch the module regardless of nesting depth. After the super_schema
# extraction (into libs/super-schema/), the audit acts as a regression guard:
# any accidental re-addition of a profiler module triggers a build failure.
forbidden_module_paths = [
    "core/inspect/inspector.py",
    "core/inspect/sources/super_schema.py",
    "core/inspect/storage.py",
    "core/inspect/context_contract.py",
    "core/inspect/semantic_detector.py",
    "core/inspect/quality_detector.py",
    "core/inspect/grain_detector.py",
    "core/inspect/relationship_detector.py",
    "core/inspect/relationship_context.py",
    "core/inspect/relationship_warnings.py",
    "core/inspect/join_multiplicity.py",
    "core/inspect/audit.py",
    "core/inspect/connection.py",
    "core/inspect/query_builder.py",
    "core/inspect/profile_utils.py",
    "core/inspect/discovery.py",
    "core/inspect/instrumentation.py",
    "core/inspect/description_merge.py",
    "core/inspect/schema_context.py",
    "core/inspect/staleness.py",
]
# The private dbt-charts-super-schema package is probed via
# importlib.util.find_spec at startup and imported conditionally when
# present. The AST audit sees the import names but the package is
# intentionally not declared as a runtime dep — it is a private plugin,
# not a PyPI dep. Absent → dbt-only mode; present → warm-cache enrichment.
# `google` is the lazy `from google.cloud import bigquery` behind the BigQuery
# feature gate in sql_adapter.py; google-cloud-bigquery is the optional
# `bigquery` extra, not a runtime dep, so the AST audit needs the carve-out.
# `databricks` (databricks-sql-connector) is imported by the lazily-loaded
# databricks_connection_manager.py behind the databricks adapter gate; it is a
# transitive dep of the optional
# `databricks` extra, not a runtime dep.
# `openai` is the lazy import inside ai/openai_gateway.py's OpenAIGateway. No
# `dct` verb reaches it — the gateway exists for in-repo hosts (Cloud,
# Playground, evals), each of which declares openai itself. (A lIe does not
# use it; it carries its own client, which is why the follow-up folds in that
# consolidation.)
# Deferred, not undecided: extracting ai/openai_gateway.py was priced against
# what removing this one entry buys and judged not worth it on that basis
# alone. The reasons that do stand alone — core ships an importable-but-
# unrunnable surface, and the repo has three OpenAI client wrappers — are
# tracked in a follow-up.
allowed_external_imports = [
    "dbt_charts_super_schema",
    "google",
    "databricks",
    "openai",
]
# Declared deps that the wheel never imports directly but that another
# declared dep loads at runtime. The audit's AST scan can't see this case.
#   `msgpack` — used by `mashumaro` inside `dbt-adapters`' manifest
#       serializer (cache load/store path). Removing it breaks dbt builds.
transitively_required_dependencies = ["msgpack"]

[tool.mypy]
python_version = "3.11"
# Hand stubs for libraries that ship none (nanoarrow); relative to this file so
# mypy finds them from any working directory.
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
namespace_packages = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
extra_checks = true
disallow_untyped_calls = true
warn_unreachable = true
disallow_any_unimported = true
disable_error_code = ["import-untyped"]
enable_error_code = [
    "truthy-bool",
    "redundant-expr",
    "possibly-undefined",
    "redundant-self",
    "unused-awaitable",
    "narrowed-type-not-subtype",
    "deprecated",
    "unimported-reveal",
    "exhaustive-match",
    "ignore-without-code",
]
exclude = ["tests/"]

# Modules that interact with untyped third-party libraries (pygments, dbt_charts_super_schema)
# have no stubs available; suppress disallow_any_unimported only where unavoidable.
[[tool.mypy.overrides]]
module = [
    "dbt_charts.integrations.highlighting",
    "dbt_charts.core.inspect.resolver",
    "dbt_charts.core.inspect.cache_factory",
    "dbt_charts.core.execute.cache_backend",
]
disallow_any_unimported = false

# trino.dbapi ships no annotations on connect().
[[tool.mypy.overrides]]
module = ["dbt_charts.core.execute.drivers.trino"]
disallow_untyped_calls = false
