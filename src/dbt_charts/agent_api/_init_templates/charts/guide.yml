# yaml-language-server: $schema=https://docs.dbtcharts.com/schema/board.json
# Starter board: a working board to copy from.
#
# The data is inline, so it renders before any warehouse is connected, and
# the rest reads the way a board over real tables does. Delete this file once
# you have boards of your own.

title: Starter board
notes: >
  Scaffolded by dct init. Inline sample sales data, a region control, a KPI
  row with a month-over-month delta, a trend, a breakdown, and a detail table.

# Variables render as controls. These inline rows are not filtered by this
# one; it reaches the text below. Against SQL, `WHERE {{ filter('region', region) }}`
# in each query makes every chart follow the pick.
variables:
  region:
    input: select
    options:
      static: [East, West, Central]

# Queries own the data: grain, aggregation, ordering. Charts only paint it.
# `type: values` is inline rows; a `sql:` query against a `source:` replaces
# it once you have a warehouse. `formats:` says how a column prints on every
# chart that shows it, so no chart restates it.
queries:
  monthly_by_product:
    type: values
    columns: [month, product, revenue, orders]
    formats:
      revenue: currency
    values:
      - [2026-01-01, Enterprise, 239100, 60]
      - [2026-01-01, Team, 147700, 313]
      - [2026-01-01, Starter, 76000, 450]
      - [2026-02-01, Enterprise, 250400, 63]
      - [2026-02-01, Team, 154500, 328]
      - [2026-02-01, Starter, 79600, 471]
      - [2026-03-01, Enterprise, 240100, 60]
      - [2026-03-01, Team, 147300, 312]
      - [2026-03-01, Starter, 76700, 454]
      - [2026-04-01, Enterprise, 265100, 66]
      - [2026-04-01, Team, 163900, 348]
      - [2026-04-01, Starter, 84600, 501]
      - [2026-05-01, Enterprise, 257800, 65]
      - [2026-05-01, Team, 159700, 339]
      - [2026-05-01, Starter, 82000, 487]
      - [2026-06-01, Enterprise, 276700, 69]
      - [2026-06-01, Team, 171500, 364]
      - [2026-06-01, Starter, 88500, 525]

  by_product:
    type: values
    columns: [product, revenue]
    formats:
      revenue: currency
    values:
      - [Enterprise, 1529200]
      - [Team, 944600]
      - [Starter, 487400]

  # A KPI wants exactly one row: the latest month, with the change from the
  # month before it.
  latest_month:
    type: values
    columns: [revenue, orders, avg_order, revenue_change]
    values:
      - [536700, 958, 560.2, 0.074]

charts:
  revenue_kpi:
    type: kpi
    query: latest_month
    label: Revenue, latest month
    value: revenue
    style:
      value:
        format: currency_whole
      support:
        format: percent_delta
    support:
      value: revenue_change
      label: vs prior month

  orders_kpi:
    type: kpi
    query: latest_month
    label: Orders, latest month
    value: orders
    style:
      value:
        format: integer

  avg_order_kpi:
    type: kpi
    query: latest_month
    label: Average order
    value: avg_order
    style:
      value:
        format: currency_whole

  revenue_trend:
    type: line
    query: monthly_by_product
    title: Revenue by month
    x: month
    y: revenue
    color: product

  revenue_by_product:
    type: bar
    query: by_product
    title: Revenue by product
    x: product
    y: revenue

  monthly_detail:
    type: table
    query: monthly_by_product
    title: Monthly detail
    style:
      columns:
        revenue:
          format: currency_whole
        orders:
          format: integer

# Layout: rows stack, cols sit side by side. Name a chart to place it; a
# `text:` block is Markdown and can read variables.
rows:
  - text: |
      Region control: {{ region or 'All' }}. These inline rows are not
      filtered by it; the SQL `filter()` helper does that once a warehouse
      replaces them (step 2 below). Edit `charts/guide.yml` and watch this
      page change.
  - cols: [revenue_kpi, orders_kpi, avg_order_kpi]
  - cols: [revenue_trend, revenue_by_product]
  - monthly_detail
  - title: Make it yours
    text: |
      1. Register your warehouse under `sources:` in `dbt_charts.yml` and check
         it with `dct query <source> 'SELECT 1'`.
      2. Replace a `values:` query with `sql:` plus `source: <name>` against
         one of its tables, and add a `WHERE` using the `filter('region',
         region)` helper so the control filters it.
      3. Add one `.yml` file under `charts/` per board; `dct serve` picks it up.
      4. `dct validate` catches mistakes; `dct docs` opens the reference.
