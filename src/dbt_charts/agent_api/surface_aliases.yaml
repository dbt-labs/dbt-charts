# Surface aliases for skill macro expansion.
#
# Authoring convention:
#
#   {{ s_<key> }}  renders as the `tool` side on the shared AI tool-call
#   surface, `dct` side on CLI
#
# Common patterns inside a SKILL.md:
#
#   "Use `{{ s_validate_board }}` after every edit."
#     → Tool-call agent reads: `validate_board`
#     → CLI agent reads: `dct validate`
#
#   "{{ s_render_png_example }}"
#     → Whole code block flips between surfaces.
#
# Each top-level key here maps to a `tool:` and `dct:` value. Either side may
# be an empty string when the content is one-sided.
#
# Add a new key here, then reference it as `{{ s_<key> }}` in any wheel
# SKILL.md. Board-YAML template tokens (`{{ region }}` etc.) are not macros —
# they have no `s_` prefix and pass through untouched. Test coverage lives in
# `dbt-charts/tests/agent_api/test_skill_render.py` and the surface fan-out test
# in `dbt-charts/tests/agent_api/test_skills.py`.

# ---- Inline tool references (one-liners inside prose) ----------------------

validate_board:
  tool: "validate_board"
  dct: "dct validate"

execute_query:
  tool: "execute_query"
  dct: "dct query SOURCE SQL"

render_board:
  tool: "render_board"
  dct: "dct render"

query_board:
  tool: "query_board"
  dct: "dct query BOARD.yml QUERY"

describe_query:
  tool: "describe_query"
  dct: "dct query SOURCE SQL --describe"

search_boards:
  tool: "search_boards"
  dct: "dct search"

# The project-file primitives belong to the in-process agent loop, not the CLI —
# there is no `dct read-file`, so the dct side names the capability instead of a
# command. Note the `tool` side also reaches MCP clients (Claude Code, Cursor),
# whose file tools are their own and differently named: prose referencing these
# aliases must read correctly for an agent that has *some* file tool, not assume
# it answers to ours.
read_file:
  tool: "read_file"
  dct: "your file-read tool"

write_file:
  tool: "write_file"
  dct: "your file-write tool"

