yaml_reference_footer:
  tool: "Full YAML reference is the `docs` tool — call `docs` for the overview, `docs(topic=…)` for one section, `docs(search=…)` for full-text search."
  dct: "Full YAML reference is `dct docs` — `dct docs` for the overview, `dct docs <topic>` for one section, `dct docs -s \"<query>\"` for full-text search."

error_reference_footer:
  tool: "Full error reference — every `ERR-*` code, message template, and docs pointer — is `docs(topic=\"error-reference\")`."
  dct: "Full error reference — every `ERR-*` code, message template, and docs pointer — is `dct docs error-reference`."

review_pointer:
