# ---- Bare skill-name references (naming a skill in prose, not invoking it) -
#
# `tool` and `dct` are both the bare registry name: `dct skills <name>`
# resolves names against the bare registry, so the CLI reader must see the
# same name a tool-call reader does. `install` is the file-installed,
# dct-prefixed directory name, and renders nowhere except the on-disk
# SKILL.md `dct init skills` writes. Different from the `skill_*` family
# above, whose `dct` side is a `dct skills <name>` command.

skill_name_build:
  tool: "board-build"
  dct: "board-build"
  install: "dct-board-build"

skill_name_custom_chart_build:
  tool: "custom-chart-build"
  dct: "custom-chart-build"
  install: "dct-custom-chart-build"

skill_name_design_board:
  tool: "board-design"
  dct: "board-design"
  install: "dct-board-design"

skill_name_replicate_board:
  tool: "board-replicate"
  dct: "board-replicate"
  install: "dct-board-replicate"

skill_name_review:
  tool: "board-review"
  dct: "board-review"
  install: "dct-board-review"

skill_name_structural_review:
  tool: "board-structural-review"
  dct: "board-structural-review"
  install: "dct-board-structural-review"

skill_name_visual_review:
  tool: "board-visual-review"
  dct: "board-visual-review"
  install: "dct-board-visual-review"

skill_name_cloud_setup:
  tool: "cloud-setup"
  dct: "cloud-setup"
  install: "dct-cloud-setup"

skill_name_design_report:
  tool: "report-design"
  dct: "report-design"
  install: "dct-report-design"

skill_name_troubleshooting:
  tool: "troubleshooting"
  dct: "troubleshooting"
  install: "dct-troubleshooting"

# ---- Chart / styling page phrases (generated by scripts/gen_skill_pages.py) --

page_checker:
  tool: "the `render_board` tool"
  dct: "the `dct` command line"

page_only_below:
  tool: "the Tools below are all you need"
  dct: "`dct` needs only the Commands below"

page_styling:
  tool: "the styling page (`get_skill('styling')`)"
  dct: "the styling page (the styling skill beside this one; `dct skills styling` prints the same text, so read one copy, not both)"
  install: "the styling page (the `dct-styling` skill beside this one; `dct skills styling` prints the same text, so read one copy, not both)"

page_commands_heading:
  tool: "Tools"
  dct: "Commands"

page_commands_note:
  tool: "These are every tool a board needs."
  dct: "These are every command and flag a board needs; skip `--help`."

columns_query_example:
  tool: "`execute_sql(source=SOURCE, sql=\"SELECT table_name, column_name, data_type FROM information_schema.columns\")`"
  dct: "`dct query SOURCE \"SELECT table_name, column_name, data_type FROM information_schema.columns\"`"

check_step:
  tool: "Check each board you write with `render_board(yaml_content=<yaml>)`{{#if_tool write_file}} (or `render_board(path=<board>)` once saved){{/if_tool}}: it runs the board's queries and returns what each chart draws and the board's problems. Fix everything it reports in one edit; run it again until it reports no errors."
  dct: "Run `dct serve --detach --port 8080`: it checks every board, prints their problems, then each board's URL with `ok` or its error and warning counts. Fix everything it prints in one edit; run it again until no board shows errors."

style_recheck:
  tool: "run `render_board(yaml_content=<yaml>)`{{#if_tool write_file}} (or `render_board(path=<board>)` once saved){{/if_tool}} and fix what it reports until it reports no errors."
  dct: "run `dct serve --detach --port 8080` and fix what it prints until no board shows errors."

finish_reply:
  tool: "Hand over the board YAML and the preview URL `render_board` returned for it, if it returned one (never a server root), plus a line on what the data says and what you assumed."
  dct: "Hand over `http://localhost:8080/<board>/` (that board URL, never the server root) plus a line on what the data says and what you assumed."

# ---- Sentence-level shared phrases (same intent, different vocabulary) ----

render_to_verify:
  tool: "Call `render_board` to see the visual result — queries are cached after first execution, so re-rendering is nearly instant."
  dct: "Run `dct render <path>` to see the visual result — queries are cached after first execution, so re-rendering is nearly instant."

# ---- Discovery / footer blocks (whole-paragraph, both sides populated) ----

docs_discovery:
  tool: |
    YAML field reference lives behind the `docs` tool (overview),
    `docs(topic=…)` (one section in depth), and `docs(search=…)` (full-text
    search).
  dct: |
    YAML field reference is `dct docs` (overview), `dct docs <topic>` (one
    section in depth), and `dct docs -s "<query>"` (full-text search).

# ---- Code-block examples (whole fenced block, surface-specific) -----------

render_png_example:
  tool: |
    ```text
    render_board(path="charts/finance/revenue-overview.yml", format="png")
    ```
  dct: |
    ```bash
    dct render charts/finance/revenue-overview.yml --format png
    ```

