# Default dbt charts Configuration
# ==============================
#
# STRUCTURE:
#   [everything here] Engine internals — not per-board authorable
#
# All visual/authorable config (style, theme, board layout) belongs in the
# Board cascade via charts/meta.yml — NOT here. A stray style:/theme: key
# in dbt_charts.yml raises a ValidationError pointing at charts/meta.yml.
# See: themes/stark.yaml for the structural root style; themes/clarity.yaml
# is the shipped default.


# ============================================================================
# EXPORT
# ============================================================================
# public_url: canonical origin prepended to links in dct render exports.
# Set this to your deployment URL (e.g. "https://dashboards.example.com") so
# exported HTML/SVG/PDF files carry fully-qualified links that open standalone.
# Leave empty (the default) for local use — links stay root-relative.

public_url: ""

# ============================================================================
# VEGA-LITE
# ============================================================================
# Engine internals for the Vega-Lite output channel. The schema URL is a
# Python constant (dbt_charts.core.compile.vega_lite.VEGA_LITE_SCHEMA_URL) —
# bumping it requires code changes, so it is not authorable here.
# Presentation fields (default_theme, default_palette) have moved to the
# Board/style cascade.

vega:
  config: {}


# ============================================================================
# QUERY-RESULT CACHE
# ============================================================================
# The cascade root that every source, board, and query inherits (field-by-
# field, nearest scope wins). There is no separate backend switch: the store is
# provisioned lazily when any resolved query policy is enabled. Omitting `path`
# = ephemeral in-memory cache auto-provisioned by the engine; setting it
# (`cache: {path: .dct-cache.duckdb}` in dbt_charts.yml) selects a persistent
# cache file, created if absent.
#
# Written as a block, not the `cache: 24h` scalar every other scope prefers,
# because this is the one layer a project merges *into* rather than over:
# `deep_merge_dict` recurses only where both sides are mappings, so a scalar
# here would be replaced wholesale by a project `cache: {path: ...}` — silently
# dropping the ttl and caching forever. A project scalar (`cache: 12h`,
# `cache: false`) still replaces this block outright, which is what it means.
#
# The 24h default ttl is a lazy backstop: cost scales with post-expiry reads,
# and it matches the daily-pipeline reality — dashboards needing tighter
# freshness override per source/board/query. ttl uses short-duration strings
# (s/m/h/d/w, m = minutes, compound like 1h30m) or the keyword `forever`.

cache:
  ttl: 24h


# ============================================================================
# EXECUTION
# ============================================================================
# Controls query execution parallelism. DuckDB-backed projects serialize
# access via an internal lock, so raising max_workers only helps external
# warehouse executors (BigQuery, Snowflake, etc.).
#
# max_query_duration_seconds is a safety ceiling on a single query's run time,
# enforced as a server-side statement timeout on network warehouses (DuckDB/
# SQLite have no server to enforce it). Shipped generous — comfortably above
# normal query times, well below the gunicorn request-worker backstop.
# Override per source with sources.<name>.max_query_duration_seconds.

execution:
  max_workers: 8
  max_query_duration_seconds: 120
  # Hard cap on matched files per glob pattern in file sources. Prevents
  # runaway fan-out when a wildcard accidentally matches thousands of files.
  # Override in dbt_charts.yml under execution.max_glob_file_count.
  max_glob_file_count: 1000
  # Hard cap on table entries in a single files: map — bounds one source's
  # worth of fan-out. Deliberately generous, not a typical-project quota.
  # Override in dbt_charts.yml under execution.file_source_max_tables.
  file_source_max_tables: 500
  # Safety ceiling on a single file-source relation's uncompressed byte size
  # (5 GB): the file's own bytes for CSV/JSON, and for Parquet the
  # uncompressed total its footer records. Deliberately generous — runaway-
  # relation protection, not a tight per-file quota. Override in
  # dbt_charts.yml under execution.file_source_max_bytes; a deployment
  # ceiling (DCT_FILE_SOURCE_MAX_BYTES_CEILING) can lower it further.
  file_source_max_bytes: 5000000000
  # Safety ceiling on rows returned by a single query. Exceeding it truncates
  # the result (with a warning), it never fails the query. Override in
  # dbt_charts.yml under execution.max_rows.
  max_rows: 1000000
  # Safety ceiling on the serialized byte size of a single query result (50MB).
  # Exceeding it truncates the result (with a warning), it never fails the
  # query. Override in dbt_charts.yml under execution.max_result_bytes.
  max_result_bytes: 52428800
  # Safety ceiling on one board render's cumulative Jinja-emitted template
  # output (50MB), summed across every templated field (queries, titles,
  # markdown) in that render, not per field. Exceeding it is a hard error,
  # never a truncation. Override in dbt_charts.yml under
  # execution.max_template_output_bytes.
  max_template_output_bytes: 52428800
  dialect_aliases:
    sqlserver: tsql
    mssql: tsql
    mariadb: mysql


# Project ceiling for board html_policy.  DCT_HTML_POLICY_CEILING env var
# overrides this and cannot be raised by any project or board setting.
# Default (trusted-raw) is permissive — no ceiling — for local development.
# Cloud hard-pins DCT_HTML_POLICY_CEILING=safe-subset at the deployment level.
html_policy_ceiling: trusted-raw


# ============================================================================
# SERVER
# ============================================================================
# Serve-only runtime controls. Project-level dbt_charts.yml may override these
# under the same server: namespace.

server:
  debug: true
  nav: true
  port: null
  markdown_metadata_table: false


# ============================================================================
# CHART RENDERING CONSTANTS
# ============================================================================
# Algorithm constants for chart layout. Not per-board authorable — these
# control axis label sizing, tooltip formatting, and rendering heuristics.
# Note: preferred_width lives at style.charts.preferred_width in the theme cascade.

chart_rendering:
  axis:
    label_gap_spaces: 1
    label_gap_spaces_numeric: 2
    # Absolute pixels, deliberately not a fraction of plot width — a proportional
    # rule can't tell apart "60 monthly points at year cadence, 45px apart on a
    # 282px card" (correct to leave flat) from "...180px apart on a 1128px card"
    # (correct to reject as too sparse): both are 19.9% of usable width, opposite
    # correct answers.
    sparse_ceiling_px: 90.0
  kpi:
    # Spacing between value baseline and the title block. Title and support
    # form a fixed 3-line block at one consistent rhythm — see
    # ``_resolve_kpi_layout`` in ``core/render/chart/kpi.py``. Inner edge
    # padding (top/bottom/left/right) all derive from
    # ``style.charts.kpi.content_padding`` for a unified inset.
    minimum_title_value_gap: 14.0
  spark_bar:
    title_height: 24.0
    title_baseline_y: 16.0
    more_rows_font_size: 10.0
    more_rows_offset_y: 12.0
    more_rows_bottom_padding: 8.0
    text_baseline_offset: 4.0
    side_padding: 4.0
    avg_char_width_px: 7.0
  step_band:
    # Fraction of the full band width the xOffset range insets to when a
    # band-aware `curve: step` is disconnected (`connect: false`), so adjacent
    # plateaus at a similar y don't optically weld into one bar. Connected
    # lines/area keep the full [0, bandwidth('x')] range. See
    # render/chart/step_band.py:apply_step_band.
    disconnected_width: 0.9
  endpoint_labels:
    # Largest share of the chart's slot the right-hand series-label rail may
    # claim. Series names measuring wider are ellipsized by Vega at the pane's
    # mark limit — uncapped, a long name makes the rail wider than the whole
    # canvas and the concat overshoot correction has no width left to give.
    max_width_fraction: 0.33
    # Target separation between adjacent endpoint labels, as a multiple of the
    # label font size. 1.3: bounding rects kiss at 1.0x but descenders touch
    # caps; 1.3 reads cleanly. A rendering constant, not a theme value — it does
    # not vary by theme and never differed per width tier, so it lives here with
    # max_width_fraction rather than on the authored style surface.
    line_height_multiplier: 1.3
  facet:
    # Small-multiples per-panel sizing. vl-convert does not reflow facet panels
    # under autosize:fit, so the render bridge divides the slot into per-panel
    # dimensions itself (see render/chart/vega_lite.py _apply_facet_layout).
    # chrome_px reserves a gutter for the left row-header label plus the measure
    # axis; min_panel_px is the per-panel width below which
    # WARN-FACET-PANEL-WIDTH-BELOW-MINIMUM fires — it is advisory, not a floor,
    # because the card boundary always wins and panels shrink past it rather
    # than paint outside the card; mirror_axis_px is the extra right-edge gutter when the measure
    # axis is mirrored to the far edge (both-edge grid) so it is not clipped.
    chrome_px: 120.0
    min_panel_px: 120.0
    mirror_axis_px: 80.0
  stroke:
    # Density-adaptive line/area stroke clamp bounds (compile/resolve/
    # adaptive_stroke.py). min_width is the hairline floor below which a dense
    # line stops reading as a trace; max_width is the ceiling above which a
    # sparse line dominates the data it draws. Calibrated against the density
    # lab — retune by re-running that calibration, not casually.
    min_width: 1.5
    max_width: 4.0
  point:
    # Line-chart point companion (compile/resolve/adaptive_stroke.py
    # bake_point_companions). diameter_ratio: point diameter as a multiple of
    # the resolved line stroke -- diameter = ratio * stroke, and size (the
    # authored/emitted VL area unit) = diameter**2, NOT pi*r**2: measured
    # directly off the rendered mark path radius, the pi*r**2 reading is
    # wrong here. Calibrated 2026-08-26 against a ratio x density sweep: 1.0
    # hides inside the stroke's round cap; 1.3 self-extinguishes by n=50;
    # 1.6-2.0 reads clearly at low density; 2.0 beads into a caterpillar by
    # n=140. 1.7 chosen for legibility over the density formula's own
    # pi*stroke**2 (1.772x) -- the render cannot tell them apart.
    diameter_ratio: 1.7
    # Points switch on once adjacent rendered points are at least ~18px
    # apart -- below that the dots bead into a caterpillar instead of
    # reading as discrete observations. Expressed as px-per-point (chart
    # width / distinct x count -- the same density signal adaptive_stroke
    # already computes) because that is the signal resolve can see at
    # compile time, before Vega-Lite lays out the axis. Measured 2026-08-26
    # by rendering a line chart at a fixed 700px card width across N=8..140
    # and reading actual point x-positions out of the SVG: rendered spacing
    # runs narrower than px-per-point (the axis gutter eats part of the
    # card width, and spacing divides by N-1 gaps where px-per-point divides
    # by N), converging to a ~0.89x ratio at higher N. The measured 18px
    # spacing crossing landed between N=31 (20.8px, px_per_point=22.58) and
    # N=32 (17.9px, px_per_point=21.88) on that board -- 22.5 sits in that
    # gap. Retune by re-running the sweep, not casually.
    min_px_per_point: 22.5
  pie:
    # Wedges with share at or below this value get no direct label — the wedge
    # still renders, hover tooltip carries the value. 8% is the observed danger
    # floor: 5-6% wedges next to each other vertically stack their labels at
    # near-cardinal angles; 8% gives an honest buffer.
    wedge_label_min_share: 0.08
    # Wedges below this share are physically unreliable: arc gap/stroke can
    # erase the colored sliver, leaving the source row with no visible mark or
    # hover target.
    invisible_slice_share: 0.02
    # Below this fraction of the label-free disk, direct labels are starving
    # the wheel badly enough to prefer the table. Locked against the
    # calibration sweep (see the wheel-first-pie-donut-labeling initiative).
    wheel_dominance_min_ratio: 0.6
    # Calibration and composition constants shared by final pie resolution
    # and the mechanical SVG/Vega emitters.
    label_reach_coefficient: 0.85
    outer_fraction: 0.9
    attached_table_gap_px: 12.0
    hybrid_heading_gap_px: 6.0
    # Placement thresholds (right-of-wheel vs below): the table goes to the
    # RIGHT when the wheel region left over after reserving the table's
    # measured width stays comfortably dominant — at least this fraction of
    # the card width, AND at least this many px absolute (guards tiny-but-
    # proportionally-fine regions on very narrow cards). Otherwise "below".
    right_placement_min_width_fraction: 0.5
    right_placement_min_width_px: 280.0
    # Right-placement wheel diameter cap: without it, a very wide card leaves
    # an oversized wheel region, inflating the donut and stranding the table
    # way out at the card's far edge. Comfortable-viewing ceiling.
    right_placement_max_wheel_px: 480.0
  bar:
    # Band-scale padding for grouped bars (xOffset mode). paddingInner = gap
    # between groups; paddingOuter = margin at both plot edges. Set by
    # apply_grouped_bar_spacing on the outer categorical axis scale.
    grouped_bar_padding_inner: 0.2
    grouped_bar_padding_outer: 0.2
    # Height a single-row (`row`) top legend costs against the plot-height
    # floor -- bar-only; see ChartRenderingConfig.BarConfig's field comment
    # in compile/models/config.py.
    plot_height_floor_row_legend_total_px: 31.0
    hover_band_trigger_fraction: 0.02
    hover_band_extend_fraction: 0.05
    # Vertical room one value label needs inside its bar segment, as a multiple
    # of the label font size. 1.15: the glyph box plus enough air that a label
    # kept at the threshold still reads as inside its band rather than welded to
    # the segment boundary. The fit test that uses it is deliberately
    # conservative (it bounds the segment against the whole slot height, not the
    # smaller plot rectangle), so this only ever governs labels that provably
    # cannot fit.
    label_fit_line_height_multiplier: 1.15
    # Same convention as chart_rendering.axis.label_gap_spaces, applied to the
    # horizontal stacked-bar top rail's own adjacent-label collision check.
    top_rail_label_gap_spaces: 1
  plot_height_floor:
    # Protect-the-plot floor -- see ChartRenderingConfig.PlotHeightFloorConfig's
    # field comments in compile/models/config.py for the sweep this was
    # calibrated against and why each constant has the value it does. Shared
    # by every cartesian family that estimates a plot-height floor (a
    # candidate legend's own height is passed in by the caller, not read
    # here).
    ratio: 0.30
    irreducible_height_px: 52.0
    axis_titles_height_px: 21.0
    subtitle_height_px: 14.0
    # Marginal cost of one wrapped compact-legend row, for use alongside the
    # three fixed-chrome fields above -- NOT the same number as
    # chart_rendering.legend.row_height_px (16.0), which is that legend's
    # per-row cost inside its own *total*-footprint-at-collapse calculation
    # (legend_wrap_required_height_px, chrome_height_px: 47.0 included).
    # Summing this floor's own irreducible_height_px/axis_titles_height_px
    # with that total double-counts the non-legend chrome baked into its
    # 47.0px term. This value is the number the retired
    # plot_height_floor_compact_legend_row_px constant carried (measured as
    # (baseline plot height minus legend-off plot height) / row count, on the
    # same grouped-bar sweep as the fields above) -- restored here rather than
    # re-derived, since collapsing the two into one calculation was the bug.
    compact_legend_row_px: 21.0
  type_inference:
    # Maximum ordinal bucket count before treating temporal data as continuous.
    # An ordinal bar chart becomes an indistinguishable comb of gridlines well
    # before decades of buckets pile up. 60 buckets (5 years of monthly ticks)
    # is the point where individual bars stop being resolvable at typical chart
    # widths — past it, fall back to a continuous temporal scale and let
    # Vega-Lite pick its own sparse "nice" ticks. Also the floor for the
    # scaffold budget: an auto-detected grain, coarse or fine, survives only
    # while the empty buckets gap-fill would synthesize stay within
    # max(distinct buckets, this value).
    max_ordinal_buckets: 60
  frame:
    # Vertical gap between the page footer text and the hairline rule above it.
    # Used by both the height-reservation math and the rule-position math so
    # the two never drift.
    footer_rule_gap_px: 2
    # Horizontal gap between footer-baseline timestamp and footer attribution
    # text.
    footer_timestamp_gap_px: 12
    # Weight of the footer's brand phrase, set against the lighter words
    # around it. Only 500 and 600 have a static font face for vl-convert to
    # swap in, so a higher value renders heavier in a browser and flat in
    # every PNG/PDF export.
    footer_brand_weight: 600
  support_table:
    # Vertical gap between divider rule and first row of the attached
    # support table strip.
    divider_gap: 4.0
    # For temporal/quantitative x axes with more than this many ticks,
    # sample every Nth column so the header row stays legible.
    chart_support_table_max_x_ticks: 40
    # Protect-the-plot floor for the column block (compile/resolve/chart/
    # plot_width_floor.py). Breaching it raises rather than warns -- see
    # ChartRenderingConfig.SupportTableConfig's own comment for why.
    plot_width_floor_ratio: 0.30
    # Warns when the column block alone already claims a large share of
    # the pre-axis-chrome footprint it shares with the plot -- well before
    # the hard floor above would raise. Calibrated against a stacked-bar +
    # per_series + Total render sweep so a WARN window exists between a
    # clean render and the hard floor, not a razor's edge between them.
    column_block_share_warn_ratio: 0.4
  gradient:
    # Nice-tick target count for a data-derived gradient legend domain
    # (heatmap's themed color scale — geoshape never reaches this, since
    # its domain is read back client-side), matching the example in
    # nice_tick_values's own docstring. Axis ticks don't hardcode a
    # convention (ay.ticks.count is author-set, default None = no baked
    # ticks) — this constant is specific to the gradient-legend seam.
    nice_tick_count: 6
  legend:
    # Fixed chrome around each entry in a single-row top legend: the swatch
    # box and the gap before the next entry. Matches the tooltip legend's own
    # swatch.size (10.0, see style.tooltip.swatch in the theme). Deliberately
    # NOT derived from mark size or entry count — a swatch stays legible-sized
    # even when the marks it names are countless and tiny.
    # The entry's label text itself is never estimated with a constant; it is
    # measured against the real resolved label font (legend_row_fits).
    row_swatch_width_px: 10.0
    row_entry_gap_px: 16.0
    # Fixed horizontal chrome a single-row top legend's own left edge loses
    # before it can begin (legend_row_fits' width bound) -- Vega-Lite's
    # autosize:fit anchors a top legend to the plot's own local origin, not
    # the card's left edge, so a real left-side axis eats directly into the
    # row's budget. min_reserve_px is the near-universal floor: every family
    # reached by the top-legend fit rule defaults its quantitative measure
    # axis to the RIGHT, so ordinarily nothing axis-driven sits to the
    # legend's left -- measured directly on a plain vertical bar (no left
    # axis content at all): root-frame offset 18px, rounded up for safety.
    # dimension_axis_reserve_chrome_px is added on top of a horizontal bar's
    # own measured dimension-label width (estimate_left_axis_reserve_px) --
    # the one shape that puts a real, content-driven axis on the left (its
    # dimension field becomes Vega-Lite's y-channel). Measured directly: a
    # horizontal bar with 4 month-name category labels (widest label ~22.3px
    # at the legend's own font) reserved 65px total -- 65 - 22.3 ≈ 43px of
    # chrome beyond the label text itself (tick length, label offset).
    #
    # This fixes a real defect: a compile-time "fits" claim that ignored
    # this reserve entirely let a single-row top legend hard-clip against
    # the card edge at exactly the rung the fit rule exists to get right.
    min_reserve_px: 20.0
    dimension_axis_reserve_chrome_px: 43.0
    # Calibrated estimate of one wrapped legend row's height (label line
    # height plus row padding) and the fixed title/padding chrome above the
    # rows -- the legend's *total* footprint at collapse
    # (legend_wrap_required_height_px), used by bar.py's own
    # stacked-legend-yield classifier (_stack_legend_should_yield), where
    # nothing else is subtracted alongside it. The plot-height floor's own
    # compact-legend charge and the fallback ladder's rung-2 check
    # (legend_wrap_fits_height_budget) want the marginal per-row cost
    # instead -- chart_rendering.plot_height_floor.compact_legend_row_px,
    # not this pair -- since both already charge their own fixed chrome
    # separately and summing this pair's chrome_height_px on top double-
    # counts it.
    #
    # Calibrated by binary-searching the true collapse height directly (available
    # card height, independent of the width-derived aspect-ratio estimate — a
    # sweep over width conflates two nonlinear functions: aspect_ratio_height's
    # own min-height clamp, and this row math), at row counts 6-10 (12/13-14/
    # 15-16/17-18/19-20 series): required height was 143/159/175/191/207px, an
    # exact 16.0px/row fit with 47.0px fixed chrome. Verified width-independent
    # (150/200/450px card widths reproduce the same per-row thresholds where the
    # legend is top/compact) and against a 253-case sweep (widths 150-380px,
    # series 3-25) with zero false negatives — every real collapse the old
    # 18.5/20.0 constants missed (13-14 series at width <= 232px, 15-18 at
    # 250-282px) is now caught.
    row_height_px: 16.0
    chrome_height_px: 47.0
  hover_emphasis:
    # The share of its own color a receded mark keeps while another mark is
    # hovered. The runtime writes each receded fill and stroke as a solid
    # blend of the mark's color at this weight toward the chart background:
    # exactly the pixels the mark would show at this opacity over that
    # background, and exactly what painting the chart's own background over
    # the plot at 0.3 would show. That background weight of 0.3 was chosen
    # from a rendered comparison at 0.15 / 0.25 / 0.35 / 0.5.
    dimmed_opacity: 0.7
  color_variants:
    # Constants for variant()/label_ink()'s move-toward-a-pole color
    # derivation (compile/resolve/style/palette.py). Engine config, not a
    # theme value -- same reason as hover_emphasis.dimmed_opacity above:
    # there is no wide range of settings that reads well, so we tune it
    # rather than the author. One rule shape for all four tiers:
    # L' = L + (pole - L) * k, hue held, chroma scaled, gamut-clipped.
    light_k: 0.30
    light_chroma: 0.60
    light_min_gap: 0.03
    light_pale_gap: 0.03
    dark_pole: 0.20
    dark_k: 0.30
    pale_l: 0.86
    pale_chroma: 0.32
    deep_pole: 0.28
    deep_k: 0.85
    # WCAG contrast floor label_ink guarantees against its canvas.
    # No hard ceiling in the config model, but above roughly 4.6 a
    # mid-gray canvas (where black and white give near-equal contrast)
    # cannot clear the floor from either ink direction -- raising this
    # much past 4.5 needs a check against the canvases it will run on.
    label_ink_min_contrast: 4.5


# ============================================================================
# RENDERING / EXPORT DEFAULTS
# ============================================================================

rendering:
  png:
    scale: 1.0
