# Default dbt charts Configuration
# ==============================
#
# STRUCTURE:
#   [everything here] Engine internals — not per-board authorable
#
# All visual/authorable config (style, theme, board layout) belongs in the
# Board cascade via charts/meta.yml — NOT here. A stray style:/theme: key
# in dbt_charts.yml raises a ValidationError pointing at charts/meta.yml.
# See: themes/_base.yaml for the structural root style; themes/clarity.yaml
# is the shipped default.


# ============================================================================
# EXPORT
# ============================================================================
# public_url: canonical origin prepended to links in dct render exports.
# Set this to your deployment URL (e.g. "https://dashboards.example.com") so
# exported HTML/SVG/PDF files carry fully-qualified links that open standalone.
# Leave empty (the default) for local use — links stay root-relative.

public_url: ""

# ============================================================================
# QUERY-RESULT CACHE
# ============================================================================
# The cascade root that every source, board, and query inherits (field-by-
# field, nearest scope wins). There is no separate backend switch: the store is
# provisioned lazily when any resolved query policy is enabled. Omitting `path`
# = the per-user cache file every project shares, pruned of entries older than
# a week; setting it (`cache: {path: .dct-cache.duckdb}` in dbt_charts.yml)
# selects that file instead, created if absent and never pruned.
#
# Written as a block, not the `cache: 24h` scalar every other scope prefers,
# because this is the one layer a project merges *into* rather than over:
# `deep_merge_dict` recurses only where both sides are mappings, so a scalar
# here would be replaced wholesale by a project `cache: {path: ...}` — silently
# dropping the ttl and caching forever. A project scalar (`cache: 12h`,
# `cache: false`) still replaces this block outright, which is what it means.
#
# The 24h default ttl is a lazy backstop: cost scales with post-expiry reads,
# and it matches the daily-pipeline reality — dashboards needing tighter
# freshness override per source/board/query. ttl uses short-duration strings
# (s/m/h/d/w, m = minutes, compound like 1h30m) or the keyword `forever`.

cache:
  ttl: 24h


# ============================================================================
# EXECUTION
# ============================================================================
# Controls query execution parallelism. DuckDB-backed projects serialize
# access via an internal lock, so raising max_workers only helps external
# warehouse executors (BigQuery, Snowflake, etc.).
#
# max_query_duration_seconds is a safety ceiling on a single query's run time,
# enforced as a server-side statement timeout on network warehouses (DuckDB/
# SQLite have no server to enforce it). Shipped generous — comfortably above
# normal query times, well below the gunicorn request-worker backstop.
# Override per source with sources.<name>.max_query_duration_seconds.

execution:
  max_workers: 8
  max_query_duration_seconds: 120
  # Hard cap on matched files per glob pattern in file sources. Prevents
  # runaway fan-out when a wildcard accidentally matches thousands of files.
  # Override in dbt_charts.yml under execution.max_glob_file_count.
  max_glob_file_count: 1000
  # Hard cap on table entries in a single files: map — bounds one source's
  # worth of fan-out. Deliberately generous, not a typical-project quota.
  # Override in dbt_charts.yml under execution.file_source_max_tables.
  file_source_max_tables: 500
  # Safety ceiling on a single file-source relation's uncompressed byte size
  # (5 GB): the file's own bytes for CSV/JSON, and for Parquet the
  # uncompressed total its footer records. Deliberately generous — runaway-
  # relation protection, not a tight per-file quota. Override in
  # dbt_charts.yml under execution.file_source_max_bytes; a deployment
  # ceiling (DCT_FILE_SOURCE_MAX_BYTES_CEILING) can lower it further.
  file_source_max_bytes: 5000000000
  # Safety ceiling on rows returned by a single query. Exceeding it truncates
  # the result (with a warning), it never fails the query. Override in
  # dbt_charts.yml under execution.max_rows.
  max_rows: 1000000
  # Safety ceiling on the serialized byte size of a single query result (50MB).
  # Exceeding it truncates the result (with a warning), it never fails the
  # query. Override in dbt_charts.yml under execution.max_result_bytes.
  max_result_bytes: 52428800
  # Safety ceiling on one board render's cumulative Jinja-emitted template
  # output (50MB), summed across every templated field (queries, titles,
  # markdown) in that render, not per field. Exceeding it is a hard error,
  # never a truncation. Override in dbt_charts.yml under
  # execution.max_template_output_bytes.
  max_template_output_bytes: 52428800
  dialect_aliases:
    sqlserver: tsql
    mssql: tsql
    mariadb: mysql
    lakecompute: duckdb
  # Lake compute's production API endpoint, sent when a source sets no
  # base_url. dbt v2's driver requires one and reads this same default from its
  # own profile layer. Override in dbt_charts.yml under
  # execution.lakecompute.default_base_url.
  lakecompute:
    default_base_url: https://api.lake-compute.fivetran.com/


# Project ceiling for board html_policy.  DCT_HTML_POLICY_CEILING env var
# overrides this and cannot be raised by any project or board setting.
# Default (trusted-raw) is permissive — no ceiling — for local development.
# Cloud hard-pins DCT_HTML_POLICY_CEILING=safe-subset at the deployment level.
html_policy_ceiling: trusted-raw


# ============================================================================
# SERVER
# ============================================================================
# Serve-only runtime controls. Project-level dbt_charts.yml may override these
# under the same server: namespace.

server:
  debug: true
  nav: true
  port: null
  markdown_metadata_table: false


# ============================================================================
# RENDERING / EXPORT DEFAULTS
# ============================================================================

rendering:
  png:
    scale: 1.0
  thumbnail:
    # render/thumbnail.py: the abstracted, unreadable board picture.
    # Share of the page ink (black on a light page, white on a dark one)
    # blended into the page for every placeholder.
    placeholder_ink: 0.20
    # Value bars and status-colored blocks blend their source color into the page.
    bar_color_weight: 0.6
    status_color_weight: 0.75
    # HSV saturation past which a color counts as chromatic (a status color,
    # a saturated mark).
    chromatic_saturation: 0.3
    # Placeholder height as a share of the measured line box; text at or above
    # large_text_size px takes the taller share. Never thinner than min_text_height px.
    text_height: 0.48
    large_text_height: 0.60
    large_text_size: 20.0
    min_text_height: 2.0
    # Value bars: height share of the line box, rounding cap, minimum width,
    # the gap kept from the previous column, and the largest share of the
    # table's width one bar may take.
    bar_height: 0.72
    bar_max_corner_radius: 3.0
    min_bar_width: 2.0
    bar_gap: 14.0
    bar_room_share: 0.22
    # Text cells draw as blocks this share of the column's widest cell, no
    # narrower than min_block_width px.
    block_share: 0.55
    min_block_width: 10.0
    # A collapsed variable control's pill height as a share of its box.
    variable_pill_height: 0.6
    # Conditional-format glyphs draw as dots: radius is this share of the
    # line box, no smaller than min_glyph_dot_radius px.
    glyph_dot_share: 0.32
    min_glyph_dot_radius: 2.5
    # Text chunks whose baselines differ by less than this share of the
    # larger font size sit on one visual line.
    same_line_share: 0.6
