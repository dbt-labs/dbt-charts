# Categorical palette — category-6-tonal-blue
#
# Single-hue categorical palette anchored on vivid-10 slot 1 (blue, H≈248.8°
# in OKLCH). Strict-safe core of 4 stops (color-alone CVD-safe under Leonardo
# ΔE ≥ 11) plus 2 extended stops that REQUIRE redundant form encoding
# (dash/marker/pattern) past slot 4. See docs/guides/palettes.md#tonal-monochrome-category-6-tonal-.

name: category-6-tonal-blue
description: |
  Tonal monochromatic blue palette. 6 stops at fixed hue (H≈248.8°), all in
  the blue family. Use for editorial / brand-restrained dashboards that want
  one hue throughout. Strict-safe core: slots 1-4 (Leonardo ΔE ≥ 11 pairwise).
  Extended: slots 5-6 (require dash, marker, or pattern redundancy past slot 4).
  See docs/guides/palettes.md#tonal-monochrome-category-6-tonal-.

colors:
  - "#0375c4"    # 1 — bluish (anchor / default single-series)
  - "#81b3e5"    # 2 — carolina blue (light tint)
  - "#004a7f"    # 3 — prussian blue (dark saturated)
  - "#002341"    # 4 — marine (very dark)
  - "#6f89a3"    # 5 — blue/gray (extended; form-redundant)
  - "#c2d3e4"    # 6 — light blue gray (extended; form-redundant)
