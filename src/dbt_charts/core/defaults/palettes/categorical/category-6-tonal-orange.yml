# Categorical palette — category-6-tonal-orange
#
# Single-hue categorical palette anchored on vivid-10 slot 5 (orange, H≈41°
# in OKLCH). Same architecture as category-6-tonal-blue.

name: category-6-tonal-orange
description: |
  Tonal monochromatic orange palette. 6 stops at fixed hue (H≈41°), all in
  the orange family (warm reds drifting into chestnut/chocolate browns at the
  dark end). Use for editorial / brand-restrained dashboards that want one
  hue throughout. Strict-safe core: slots 1-4 (Leonardo ΔE ≥ 11 pairwise).
  Extended: slots 5-6 (require dash, marker, or pattern redundancy past slot 4).
  See docs/guides/palettes.md#tonal-monochrome-category-6-tonal-.

colors:
  - "#b74c1f"    # 1 — brick orange (anchor)
  - "#df9b82"    # 2 — pinkish tan (light tint)
  - "#7b2900"    # 3 — chestnut (dark saturated)
  - "#3c1303"    # 4 — chocolate brown (very dark)
  - "#a17d6f"    # 5 — reddish gray (extended; form-redundant)
  - "#e3cbc2"    # 6 — pinkish gray (extended; form-redundant)
