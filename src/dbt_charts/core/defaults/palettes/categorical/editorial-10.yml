# Categorical palette: editorial-10
#
# Quiet categorical cycle for editorial, cream, plain, and solid themes.
# Ordered for cycling, with restrained chroma so multi-series charts accompany
# rather than compete with the themes' darker single-series marks.
#
# Every tier (dark, light, pale, deep) is derived live from these stops by
# variant() (compile/resolve/style/palette.py) -- no companion file to keep
# in sync. Address a tier with a third token segment appended to a direct
# palette.slot reference or a role-indirected bracket/dotted token.

name: editorial-10
description: |
  Quiet 10-color categorical palette for editorial-voiced light themes.
  Blue-led, muted, and ordered for automatic series cycling.

colors:
  - "#40639c"    # 1  blue
  - "#779bc9"    # 2  sky
  - "#608470"    # 3  green
  - "#775770"    # 4  purple
  - "#d49656"    # 5  gold
  - "#ae6349"    # 6  rust
  - "#a0b6b7"    # 7  teal
  - "#ad9c7f"    # 8  brown
  - "#7a8895"    # 9  gray
  - "#5c6668"    # 10 graphite

# Public compatibility roles. The vocabulary matches vivid-10; each family
# maps the roles to its own semantic colors. Values are 1-indexed slot refs.
aliases:
  blue: 1
  sky: 2
  green: 3
  brown: 8
  gold: 5
  purple: 4
  orange: 6     # rust
  sage: 7       # teal
  gray: 9
  charcoal: 10  # graphite
