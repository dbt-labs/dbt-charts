# Categorical palette — vivid-10
#
# Chroma-pushed retune of category-10's hues, in green-third slot order. The
# five lead hues (blue, cyan, green, gold, orange) sit near the sRGB gamut
# ceiling (OKLCH C 0.14-0.17); purple and moss are held lower (C ~0.10-0.11)
# because both are tuned against color-vision deficiency, not for chroma:
#   - Purple is rosy (H ~334°) so it keeps its red side apart from blue when
#     protanopia removes red. Its lightness sits in the palette's middle band,
#     beside moss and orange; its tight pairs are blue below (blue+purple 9.02
#     under protanopia) and gray above (purple+gray 9.18 under deuteranopia).
#     Lightening it closes on gray.
#   - Moss is calm (C 0.109) because a more saturated moss collapses onto
#     orange under deuteranopia, and one greener collapses onto green.
#
# Color-vision deficiency. Worst-case CIEDE2000 across deuteranopia,
# protanopia, and tritanopia as the first N stops accumulate:
#   N=2      23.27  blue+cyan      tritanopia
#   N=3..5   11.97  cyan+green     tritanopia
#   N=6       9.02  blue+purple    protanopia
#   N=7..10   9.01  orange+moss    deuteranopia
# In plain words: the palette clears the Leonardo gate (ΔE 11) through five
# series, and keeps a floor of 9 for every series count beyond.
# Four pairs sit between 9 and 11, where the palette is tight: orange+moss
# 9.01 (deuteranopia), blue+purple 9.02 (protanopia), purple+gray 9.18
# (deuteranopia), green+moss 9.99 (protanopia). Moving purple or moss moves
# at least one of them. Pinned in tests/core/test_vivid_10_palette.py.
#
# Slot order — the three constraints it satisfies, in priority order:
#   1. Brown and charcoal sit past slot 7. They are the only two stops under
#      3:1 against neon's near-black canvas (2.73:1 and 2.63:1), so a chart
#      needs eight series before it draws one. Brown is also the least
#      chromatic of the eight non-neutral hues (OKLCH C 0.071, under half of
#      blue's 0.150 — only gray and charcoal sit lower, and they are meant
#      to), a poor fit for the lead slots of a palette named for its chroma.
#   2. Purple and moss hold slots 6 and 7. They are the only hues with a
#      partner under ΔE 11 among blue, cyan, green, gold, and orange
#      (blue+purple, orange+moss, green+moss), so whichever arrives first ends
#      the run above 11. Placing both after the other five holds 11.97
#      through N=5.
#   3. Cyan holds slot 2.
#
# The order controls how many leading series clear 11, not the floor: five,
# with brown, charcoal, and gray held past slot 7.
#
# Categorical palettes have no LUT, no surface variants, no interpolation.
# Stops are what you get — exactly as authored.
#
# Every tier (dark, light, pale, deep) is derived live from these stops by
# variant() (compile/resolve/style/palette.py) -- no companion file to keep
# in sync. Address a tier with a third token segment appended to a direct
# palette.slot reference or a role-indirected bracket/dotted token.

name: vivid-10
description: |
  Default 10-color categorical palette for qualitative data encoding.
  Blue-first, green third; the five most chromatic hues lead, then purple,
  moss, brown, and the two neutrals. Retune of the former category-10 hues,
  lifting blue/cyan/green/gold toward the M2 chart-fill chroma band.

colors:
  - "#0073c2"    # 1 — blue (default single-series)
  - "#00c8ee"    # 2 — cyan
  - "#00ad75"    # 3 — green
  - "#e1a500"    # 4 — gold
  - "#da5a23"    # 5 — orange
  - "#a86c9d"    # 6 — purple
  - "#6a8f47"    # 7 — moss
  - "#7a5531"    # 8 — brown
  - "#949daa"    # 9 — gray
  - "#505b6b"    # 10 — charcoal

# Named hue roles — swap-invariant color tokens. `category.green` addresses the
# green slot of whichever palette the theme's `category` role points to, so
# swapping stark ↔ editorial keeps green green without an author change. Values
# are 1-indexed slot refs (they follow a hex retune automatically). This
# vocabulary is identical in editorial-10.yml — the palette themes swap to.
aliases:
  blue: 1
  sky: 2
  green: 3
  gold: 4
  orange: 5
  purple: 6
  sage: 7
  brown: 8
  gray: 9
  charcoal: 10
