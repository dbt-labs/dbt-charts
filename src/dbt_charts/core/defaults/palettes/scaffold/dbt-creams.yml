# Scaffold palette — dbt-creams (warm-canvas UI chrome)
#
# Cream-scaffold complement to dbt-grays. Use on warm-canvas themes.
# A theme assigns `palettes.chrome: dbt-creams` and keeps writing the same
# step numbers (chrome[N]) it writes for dbt-grays, so the whole ladder swaps
# at once.
#
# Inherits the endpoint aliases (0, 100, white, black) from dbt-grays via
# `extends:`. Only cream-specific colors are listed below.

name: dbt-creams
extends: dbt-grays
description: |
  Warm cream-toned scaffold — UI structural framing for warm-canvas themes.
  The same step numbers as dbt-grays: steps 1-12 run from warm near-white (1) to
  warm near-black (12), with step 0 white and step 100 black inherited. Applied
  to canvas backgrounds, borders, dividers, axis labels, table stripes, and
  secondary text on editorial/print-styled themes.

colors:
  - "#FAF7F0"    # 1
  - "#F5F2EB"    # 2
  - "#E9E1D2"    # 3
  - "#DDD3C0"    # 4
  - "#CEC1AB"    # 5
  - "#B2A691"    # 6
  - "#918878"    # 7
  - "#6F685D"    # 8
  - "#56504A"    # 9
  - "#403B37"    # 10
  - "#2A2725"    # 11
  - "#1A1714"    # 12
