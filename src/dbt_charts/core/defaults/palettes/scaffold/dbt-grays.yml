# Scaffold palette — dbt-grays (neutral gray UI chrome)
#
# Scaffolds are UI structural framing, NOT data encoding. They live in
# their own directory to make the taxonomy honest:
#   palettes/sequential/  — data, ordered magnitude
#   palettes/diverging/   — data, signed/around midpoint
#   palettes/categorical/ — data, unordered categories
#   palettes/scaffold/    — UI structure (canvas/borders/text/stripes)
#   palettes/tone/        — UI roles (info/negative/warning/positive)
#
# Theme role: chrome. Address form: chrome[N] — a step number, never a job
# name. What a step is for is the theme's decision, not the palette's.

name: dbt-grays
description: |
  Neutral gray scaffold — UI chrome. An ordered ramp addressed by step number,
  lightest to darkest: steps 1-12 run from near-white (1) to near-black (12); a
  higher number is more ink. Step 0 is white and step 100 is black, the ends of
  the ink scale. Applied to canvas backgrounds, borders, dividers, axis labels,
  table stripes, and secondary text. Pairs with dbt-creams for warm-canvas themes.

colors:
  - "#FAFAFA"    # 1
  - "#F7F8FA"    # 2
  - "#EDEFF2"    # 3
  - "#DFE1E5"    # 4
  - "#D0D3D9"    # 5
  - "#B0B2B8"    # 6
  - "#8A8C8F"    # 7
  - "#626366"    # 8
  - "#494A4C"    # 9
  - "#313233"    # 10
  - "#222222"    # 11
  - "#161616"    # 12

aliases:
  # Endpoints outside the ladder, measured in ink (0 none, 100 full). Declared
  # here so the resolver carries no scaffold knowledge: a numbered step is
  # looked up in the aliases first, then in `colors:`.
  "0": "#FFFFFF"
  "100": "#000000"
  white: "0"
  black: "100"
