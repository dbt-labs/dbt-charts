# Unified theme: clarity
# The shipped dbt charts default. Serif-forward titles, multi-step gray scaffold
# ladder — a refined editorial voice applied on top of the
# `stark` structural root. Pick `stark` directly to opt out of the refined
# hierarchy; pick `paper` for the same voice on a warm canvas.

extends: stark
notes: the default
style:
  background: dbt-grays.white
  # Clarity palette — gray scaffold muted step in place of the stark muted.
  muted: chrome[8]
  # Rebind the categorical role to the editorial-10 family. `_base` binds
  # category to vivid-10; without this rebind, theme-portable refs like
  # `category[2]` or `category[2].dark` keep resolving to stark's palette
  # after a theme switch. Absolute pins (`vivid-10.2.dark`) stay pinned by
  # design.
  palettes:
    category: editorial-10
    # The blue sequential ramp. Bound as a
    # role so the heatmap/geoshape gradients below and any `sequence[N]` token
    # read the same palette.
    sequence: dbt-seq-blue
  # Board/card border — subtle gray when a board opts into a visible border.
  # `stark` collapses this to ink (gray-80); `clarity` restores the
  # soft separator.
  border:
    color: chrome[4]
  # Prose ink — gray-90, restored from `stark`'s ink collapse.
  font:
    color: chrome[11]
  # The editorial voice: serif headlines and prose on top of `stark`'s sans.
  fonts:
    heading:
      family: "'Source Serif 4', Georgia, 'Times New Roman', serif"
    body:
      family: &serif "'Source Serif 4', Georgia, 'Times New Roman', serif"
  title:
    # Serif headlines — the editorial voice the `clarity` theme adds on top
    # of `stark`. Source Serif 4 is the editorial board; chart-title
    # typography is width-driven (see core/compile/resolve/style/typography.py) and reads
    # this family for medium/wide chart cards.
    #
    # No color pin here — the InheritSlot carries `font.color` (gray-90),
    # so titles and headings read the same ink as prose.
    subtitle:
      font:
        color: chrome[7]
  charts:
    color:
      categorical:
        # One fixed ink for every single-series chart on the board — same
        # data, same color, regardless of reading-order position. The named
        # role (rather than a direct `editorial-10.1.dark` pin) keeps this
        # pointing at slot 1's blue if the family is ever reordered.
        single_series_palette: [category.blue.dark]
    axis:
      labels:
        font:
          color: chrome[8]
      title:
        font:
          # Axis titles render in `subtitle` — quieter than `heading` (which
          # is the chart-title role). Editorial precedent: axis titles
          # orient, they don't compete with marks or the chart title.
          color: chrome[7]
      grid:
        # One rung quieter than the measure grid (axis_y below), never more.
        color: &category_grid chrome[4]
        threshold:
          color: chrome[7]
      ticks:
        color: *category_grid
      line:
        color: chrome[3]
    axis_y:
      grid:
        color: chrome[5]
      ticks:
        color: chrome[5]
    axis_quantitative:
      labels:
        font:
          color: chrome[11]
      grid:
        color: chrome[5]
      ticks:
        color: chrome[5]
    legend:
      label:
        font:
          color: chrome[8]
      title:
        font:
          color: chrome[10]
    # Resets border.width / shadow.visible / swatch.radius / active_marker --
    # stark (the structural root) sets 1.5 / false / 0 / triangle for its own
    # utilitarian look; those values would otherwise leak into every descendant
    # that doesn't override them. clarity's soft look predates stark's tooltip
    # rework, so these resets restore it explicitly.
    tooltip:
      background: dbt-grays.white
      label:
        font:
          color: chrome[7]
      value:
        font:
          color: chrome[11]
      border:
        color: chrome[4]
        # No border on shadowed themes: the drop shadow already separates the
        # card, so the outline is redundant. Kept only on stark, which turns the
        # shadow off and relies on a hard outline for its utilitarian look.
        width: 0.0
        radius: 4.0
      shadow:
        visible: true
      swatch:
        radius: 3.0
      active_marker: fill
    # One scaffold rung past this theme's own measure gridline, at twice
    # that gridline's width -- reads as structure, not as another series.
    hover_emphasis:
      drop_line_color: chrome[6]
      drop_line_width: 3.0
    kpi:
      # KPI value font is a serif on clarity-voiced themes — narrative type
      # for the headline number, its affix, and its glyph, while the label
      # and support row stay on the tabular sans (kpi.font.family from stark).
      value:
        font:
          extends: body
          size: 24
        affix:
          font:
            extends: label
            family: *serif
        glyph:
          font:
            extends: label
            family: *serif
    bar:
      # Inward-align the category (row) labels on horizontal bars into the
      # measured margin. axis_x is the category axis on both orientations;
      # resolve maps inward against the axis's own edge, which is only ever
      # left/right for a horizontal bar — vertical bars' bottom labels have
      # no edge to resolve against and stay untouched.
      axis_x:
        labels:
          align: inward
    heatmap:
      # Inward-align the row labels (heatmap's y is always the nominal row axis).
      axis_y:
        labels:
          align: inward
      color:
        gradient:
          palette: sequence
    geoshape:
      color:
        gradient:
          palette: sequence
    line:
      endpoint_labels:
        visible: auto
    area:
      endpoint_labels:
        visible: auto
    pie:
      total:
        value:
          font:
            color: chrome[11]
        label:
          font:
            color: chrome[7]
    marks:
      text:
        font:
          color: chrome[10]
      rule:
        stroke:
          color: chrome[11]
      geoshape:
        # Neutral fill for geography without joined data. Comes from the
        # gray scaffold, not the categorical palette: the basemap is chrome
        # and must recede behind the marks drawn on it. A categorical swatch
        # is picked to hold its own against other series, which is the
        # opposite requirement: a categorical light stop rendered a
        # mid-tone mark effectively invisible against it.
        fill: chrome[5]
    support_table:
      neutral_color: chrome[8]
      label:
        font:
          color: chrome[8]
      divider:
        color: chrome[8]
      row:
        divider:
          color: chrome[8]
    table:
      header:
        divider:
          color: chrome[11]
        font:
          color: chrome[10]
      row:
        divider:
          color: chrome[11]
        roles:
          summary:
            divider:
              color: chrome[11]
          total:
            divider:
              color: chrome[11]
        stripe:
          color: chrome[2]   # subtle zebra (one scaffold stop off canvas)
  variables:
    # Variable-strip labels track the muted gray rather than the
    # cooler #666666 stark uses.
    font:
      color: chrome[8]
    # Variable-strip input border — subtle gray separator. `stark` collapses
    # this to ink (gray-80); `clarity` restores the soft separator.
    border:
      color: chrome[5]
