# Unified theme: clarity
# The shipped dbt charts default. Serif-forward titles, multi-step gray scaffold
# ladder — a refined editorial voice. Pick `stark` for a flat single-ink
# look; pick `paper` for the same voice on a warm canvas.

extends: _base
notes: the default
style:
  background: dbt-grays.white
  # Rebind the categorical role to the editorial-10 family. `_base` binds
  # category to vivid-10; without this rebind, theme-portable refs like
  # `category[2]` or `category[2].dark` keep resolving to vivid-10
  # after a theme switch. Absolute pins (`vivid-10.2.dark`) stay pinned by
  # design.
  palettes:
    category: editorial-10
    # The blue sequential ramp. Bound as a
    # role so the heatmap/geoshape gradients below and any `sequence[N]` token
    # read the same palette.
    sequence: dbt-seq-blue
  roles:
    muted: chrome[8]
  # Board/card border — subtle gray when a board opts into a visible border.
  border:
    color: chrome[4]
  # Prose ink — gray-90.
  font:
    color: chrome[11]
  # The editorial voice: serif headlines and prose over `_base`'s sans.
  fonts:
    heading:
      family: "'Source Serif 4', Georgia, 'Times New Roman', serif"
    body:
      family: &serif "'Source Serif 4', Georgia, 'Times New Roman', serif"
  title:
    # Serif headlines — the editorial voice the `clarity` theme adds.
    # Source Serif 4 is the editorial board; chart-title
    # typography is width-driven (see core/compile/resolve/style/typography.py) and reads
    # this family for medium/wide chart cards.
    #
    # No color pin here — the InheritSlot carries `font.color` (gray-90),
    # so titles and headings read the same ink as prose.
    subtitle:
      font:
        color: chrome[7]
  charts:
    color:
      categorical:
        # One fixed ink for every single-series chart on the board — same
        # data, same color, regardless of reading-order position. The dark
        # variant of `category` slot 1, so a board that rebinds `category`
        # gets the darker variant of its own first color.
        single_series_palette: ["category[1].dark"]
    axis:
      labels:
        font:
          color: chrome[8]
      title:
        font:
          # Axis titles render in `subtitle` — quieter than `heading` (which
          # is the chart-title role). Editorial precedent: axis titles
          # orient, they don't compete with marks or the chart title.
          color: chrome[7]
      grid:
        # One rung quieter than the measure grid (axis_y below), never more.
        color: &category_grid chrome[4]
        threshold:
          color: chrome[7]
      ticks:
        # A tick continues the floor, so it wears the measure grid.
        color: chrome[5]
      line:
        color: chrome[3]
    axis_y:
      grid:
        color: chrome[5]
    axis_band:
      labels:
        font:
          color: chrome[11]     # category names print in ink; time stays muted via `axis`
    axis_quantitative:
      labels:
        font:
          color: chrome[11]
      grid:
        color: chrome[5]
    legend:
      label:
        font:
          color: chrome[8]
      title:
        font:
          color: chrome[10]
    # Soft tooltip: no outline (the _base drop shadow separates the card).
    # stark is the hard-outline variant.
    tooltip:
      background: dbt-grays.white
      label:
        font:
          color: chrome[7]
      value:
        font:
          color: chrome[11]
      border:
        color: chrome[4]
        # No border on shadowed themes: the drop shadow already separates the
        # card, so the outline is redundant. Kept only on stark, which turns the
        # shadow off and relies on a hard outline for its utilitarian look.
        width: 0.0
    # One scaffold rung past this theme's own measure gridline, at twice
    # that gridline's width -- reads as structure, not as another series.
    hover_emphasis:
      drop_line_color: chrome[6]
      drop_line_width: 3.0
    kpi:
      # KPI value font is a serif on clarity-voiced themes — narrative type
      # for the headline number, its affix, and its glyph, while the label
      # and support row stay on the tabular sans (kpi.font.family from `_base`).
      value:
        font:
          extends: body
          size: 24
        affix:
          font:
            extends: label
            family: *serif
        glyph:
          font:
            extends: label
            family: *serif
          arrow:
            font:
              family: *serif
    bar:
      # Inward-align the category (row) labels on horizontal bars into the
      # measured margin. axis_x is the category axis on both orientations;
      # resolve maps inward against the axis's own edge, which is only ever
      # left/right for a horizontal bar — vertical bars' bottom labels have
      # no edge to resolve against and stay untouched.
      axis_x:
        labels:
          align: inward
    heatmap:
      # Inward-align the row labels (heatmap's y is always the nominal row axis).
      axis_y:
        labels:
          align: inward
      color:
        gradient:
          palette: sequence
    geoshape:
      color:
        gradient:
          palette: sequence
    pie:
      total:
        value:
          font:
            color: chrome[11]
        label:
          font:
            color: chrome[7]
    marks:
      text:
        font:
          color: chrome[10]
      rule:
        stroke:
          color: chrome[11]
      geoshape:
        # Neutral fill for geography without joined data. Comes from the
        # gray scaffold, not the categorical palette: the basemap is chrome
        # and must recede behind the marks drawn on it. A categorical swatch
        # is picked to hold its own against other series, which is the
        # opposite requirement: a categorical light stop rendered a
        # mid-tone mark effectively invisible against it.
        fill: chrome[5]
    support_table:
      neutral_color: chrome[8]
      label:
        font:
          color: chrome[8]
      divider:
        color: chrome[8]
      row:
        divider:
          color: chrome[8]
    table:
      header:
        divider:
          color: chrome[11]
        font:
          color: chrome[10]
      row:
        divider:
          color: chrome[11]
        roles:
          summary:
            divider:
              color: chrome[11]
          total:
            divider:
              color: chrome[11]
        stripe:
          color: chrome[2]   # subtle zebra (one scaffold stop off canvas)
  variables:
    # Variable-strip labels track the muted gray.
    font:
      color: chrome[8]
    # Variable-strip input border — subtle gray separator.
    border:
      color: chrome[5]
