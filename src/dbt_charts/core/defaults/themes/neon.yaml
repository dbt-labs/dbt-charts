# Unified theme: neon  [PLACEHOLDER — render model PARKED, see the parking note under sans-theme-refs]
# Vivid's dark-chrome sibling: super-saturated marks glowing against dark chrome.
# Neutral near-black canvas (chrome[12] #161616 — neutral, NOT navy) is the
# backdrop that lets the marks glow; the color lives entirely in the vivid-10 marks.
# FOUR coarse chrome tiers (+2 grid stops), all from dbt-grays (no opacity, no inline hex).
# "Values pop": numeric readouts get the max-contrast tier, above titles — opposite
# clarity's soft mid-anchored ramp.
#   VALUE chrome[1]   (#FAFAFA) — quant-axis numbers, data labels, values, zero-baseline (max)
#   HIGH  chrome[3]     (#EDEFF2) — titles, legend, table headers
#   MID   chrome[7] (#8A8C8F) — category labels, axis titles, support text
#   FAINT chrome[10]  (#313233) — domain, borders
#   GRID  chrome[9] (#494A4C) — category/time gridlines + their ticks
#   +     chrome[8]    (#626366) — measure gridlines + their ticks, one step brighter
# Both grid rungs sit above FAINT: a gridline at FAINT barely reads on the void canvas.
# They split across two rungs because gridlines are not one job: at hairline width
# the only way to sit the category grid behind the measure grid is contrast. On this
# dark canvas the measure grid moves UP (away from the background) rather than the
# category grid moving down.
# Backgrounds: canvas chrome[12] (#161616) + one panel tier chrome[11] (#222222).
# The engine's automatic label ink (label_ink()) is canvas-aware by
# construction -- it reads light on this dark canvas with no theme-level
# role rebind needed. A board or theme that explicitly wants the .light or
# .dark *variant* of a mark color still picks it by name, same as any
# other theme; "which variant reads well on a dark canvas" is the
# dark-mode-theming follow-on's question, not this theme's to answer here.
# All color from vivid-10 marks only. Confident marks, flat fills.
extends: _base
notes: saturated, glowing colors
style:
  background: chrome[12]
  accent: info.border
  muted: &mid chrome[7]
  font:
    color: &high chrome[3]
  palettes:
    sequence: dbt-seq-blue-dark
  # Lighter tone stops for the dark canvas — the default positive/negative
  # `.solid` greens/reds are tuned for light bg and read too dark here.
  tones:
    positive: positive.border
    negative: negative.border
  border:
    color: &faint chrome[10]
  title:
    font:
      weight: 600
    subtitle:
      font:
        color: *mid
  text:
    # Color inherits from `font.color` (InheritSlot) — no pin here so a
    # board-root style.font.color override reaches prose.
    code:
      theme: monokai
      font:
        color: *high
      background: &panel chrome[11]
      border:
        color: *faint
        width: 1
        radius: 4
    blockquote:
      font:
        color: *mid
        style: italic
      background: *panel
      border:
        color: *high
        width: 3
        radius: 0
    divider:
      color: *faint
    column:
      divider:
        color: *faint
  charts:
    color:
      categorical:
        single_series_palette: ['vivid-10.1']   # brand-blue single series (data color, not chrome)
    # Bar tracks on the FAINT tier — `_base` pins these to the light-canvas
    # fill gray, which would glare on the near-black canvas. (Table twin
    # sits in the table block below.)
    spark_bar:
      bar:
        background: *faint
    axis:
      line:
        color: *faint
      grid:
        # Hairline gridlines, so contrast carries the axis hierarchy width
        # cannot: this sits one rung closer to the canvas than the measure
        # grid on axis_y below. Same rule as the light themes, opposite
        # direction, because the background sits on the other side.
        color: &category_grid chrome[9]
        width: 1
        threshold:
          color: &value chrome[1]  # baseline anchors at max contrast
      ticks:
        color: *category_grid
      labels:
        font:
          color: *mid
      title:
        font:
          color: *mid
    axis_y:
      grid:
        color: &measure_grid chrome[8]  # measure grid reads above the vertical one
      ticks:
        # A tick and its gridline mark the same value; they read as one mark
        # crossing the axis line. Without this the measure tick wore the
        # category tier while sitting on the measure axis.
        color: *measure_grid
        width: 1                   # the hairline this theme's grid is drawn at
    axis_band:
      labels:
        font:
          color: *value            # category names POP; time labels stay MID via `axis`
    axis_quantitative:
      grid:
        color: *measure_grid       # a quantitative x (scatter) is a measure too
      labels:
        font:
          color: *value            # numeric readouts POP
      ticks:
        color: *measure_grid       # tracks the quantitative grid above
        width: 1                   # the hairline this theme's grid is drawn at
    legend:
      label:
        font:
          color: *high
      title:
        font:
          color: *high
    bar:
      axis_x:                      # inward-align horizontal-bar row labels (resolve scopes to left/right edge)
        labels:
          align: inward
    scatter:
      legend:
        visible: true              # scatter encodes color/size → needs legend
      # Quant×quant keeps even grid weight. `_base` states that as its own 1.5
      # measure width, which stops tracking once a theme goes hairline — restate
      # it against this theme's width so both axes stay matched.
      axis_x:
        grid:
          width: 1
    marks:
      bar:
        border:
          radius: 2
      text:
        font:
          color: *value            # direct data labels = values = max
      rule:
        stroke:
          color: *high
      geoshape:
        fill: *faint                 # unjoined regions = dark neutral, recede on near-black
    # Choropleth + heatmap default continuous color. _base uses `blues`
    # (light→dark: low values bright), which inverts emphasis on a dark canvas.
    # dbt-seq-blue-dark keeps neon's blue brand identity (viridis's rainbow
    # scheme was unrelated to it) and is luminance-monotonic dark-first
    # (low=dark recede, high=bright pop) like every -dark palette fork —
    # structural to the fork, not a bug.
    geoshape:
      color:
        gradient:
          palette: sequence
    heatmap:
      color:
        gradient:
          palette: sequence
      axis_y:                      # inward-align heatmap row labels (y is always nominal)
        labels:
          align: inward
    table:
      header:
        divider:
          color: *high
        background: *panel
        font:
          color: *high
      row:
        divider:
          color: *high
        roles:
          summary:
            divider:
              color: *high
          total:
            divider:
              color: *high
        stripe:
          color: *panel
      spark:
        bar:
          background: *faint
    support_table:
      neutral_color: *value
      label:
        font:
          color: *mid
      divider:
        color: *faint
      row:
        divider:
          color: *faint
    # Soft dark tooltip: no outline, a drop shadow, rounded swatch, and a
    # background-fill active marker. stark is the hard-outline variant.
    tooltip:
      background: *panel
      label:
        font:
          color: *mid
      value:
        font:
          color: *value
      border:
        color: *faint
        # Borderless like the other shadowed themes (see clarity.yaml).
        width: 0.0
        radius: 4.0
      shadow:
        visible: true
      swatch:
        radius: 3.0
      active_marker: fill
    # Inverts the "away from background" rule the other themes follow: neon's
    # canvas is chrome[12] (near-black), so a step AWAY from it is
    # lighter, not darker.
    hover_emphasis:
      drop_line_color: chrome[7]
      drop_line_width: 2.0
    pie:
      total:
        value:
          font:
            color: *value
        label:
          font:
            color: *mid
  variables:
    font:
      color: *mid
    border:
      color: *faint
    input:
      background: *panel
