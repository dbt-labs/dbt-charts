# Unified theme: paper
# The shipped `clarity` theme on a warm cream surface. Chart chrome is wired
# through the dbt-creams.* palette so axis grids, ticks, labels, and mark
# strokes sit on the cream canvas instead of inheriting the gray defaults
# from `stark`.

extends: clarity
style:
  palettes:
    sequence: dbt-seq-brown
  background: dbt-creams.canvas
  muted: dbt-creams.muted
  font:
    color: dbt-creams.ink
  title:
    # No color pin here — the InheritSlot carries `font.color`, so titles
    # and headings read the same ink as prose.
    subtitle:
      font:
        color: dbt-creams.subtitle
  border:
    color: dbt-creams.border
  text:
    # Color inherits from `font.color` (InheritSlot) — no pin here so a
    # board-root style.font.color override reaches prose.
    code:
      background: dbt-creams.surface-subtle
      border:
        color: dbt-creams.border
    blockquote:
      font:
        color: dbt-creams.muted
      border:
        color: dbt-creams.border
    # Markdown rules + markdown-table gridlines (was charts.table.border.color).
    rule:
      color: dbt-creams.border
  charts:
    color:
      categorical:
        # Single-series ink rhythm: brown, gold, rust. Warm canvas takes warm
        # inks; the cycle
        # threads through yellow-brown → tobacco → red-brown without ever
        # crossing into cool territory. Stops sit at OKLCH L 0.32–0.35
        # alongside clarity's cool cycle (matched ink-band weight). Named
        # roles preserve the intended hues if the family is reordered again.
        single_series_palette: [category.brown.deep, category.gold.deep, category.orange.deep]
    # bar.border.color now tracks theme.background via self-reference at the
    # structural-root level (see stark.yaml), so the cream knockout
    # falls out of theme.background = cream-025 automatically. No explicit
    # override needed here.
    marks:
      rule:
        stroke:
          color: dbt-creams.ink
      text:
        font:
          color: dbt-creams.heading
      geoshape:
        # Basemap chrome on a warm canvas. Clarity's equivalent comes from
        # dbt-grays; paper takes its own ladder from dbt-creams so the terrain
        # belongs to the page rather than sitting cold on it.
        #
        # A lighter step than the gray themes use, deliberately. The warm
        # ladder is tinted at every step, so the value that reads as neutral
        # ground on a gray canvas reads as a tan continent on cream — a
        # subject competing with the marks rather than ground beneath them.
        fill: dbt-creams.grid
    axis:
      grid:
        color: dbt-creams.grid
        threshold:
          color: dbt-creams.subtitle
      ticks:
        color: dbt-creams.grid
      line:
        color: dbt-creams.grid
      labels:
        font:
          color: dbt-creams.muted
      title:
        font:
          # Axis titles in `subtitle` — quieter than chart-title `heading`.
          # Editorial precedent: axis titles orient, not compete.
          color: dbt-creams.subtitle
    # axis_x cascades from axis — no overrides needed.
    axis_y:
      grid:
        color: dbt-creams.grid-emphasis  # softer grid for the value axis (overrides default gray)
      ticks:
        color: dbt-creams.grid-emphasis
    axis_quantitative:
      # Overrides clarity's dbt-grays.ink quantitative-label color — paper's
      # axis chrome stays on the dbt-creams ladder throughout.
      labels:
        font:
          color: dbt-creams.muted
      grid:
        color: dbt-creams.grid-emphasis
      ticks:
        color: dbt-creams.grid-emphasis
    legend:
      label:
        font:
          color: dbt-creams.muted
      title:
        font:
          color: dbt-creams.heading
    # Themed sequential default for heatmap/geoshape gradient color — _base's
    # `blues` measures 1.08:1 contrast against the cream canvas at its light
    # end (WCAG floor is 3:1), so low-value cells are effectively invisible.
    # dbt-seq-brown reads warm against the cream canvas instead.
    geoshape:
      color:
        gradient:
          palette: sequence
    heatmap:
      color:
        gradient:
          palette: sequence
    # Standalone spark-bar track on the warm fill gray — stark pins the
    # cool-gray fill, which would sit as a cool cast on the cream canvas.
    spark_bar:
      bar:
        background: dbt-creams.fill-muted
    table:
      header:
        font:
          color: dbt-creams.heading
      row:
        stripe:
          color: dbt-creams.surface-subtle
      paginator:
        # Cream-scaffold variant of the default gray ramp — same three-tier
        # contrast, warm-canvas colors.
        color_active: dbt-creams.ink
        color_inactive: dbt-creams.inactive
        color_disabled: dbt-creams.disabled
      spark:
        # Spark progress track was renamed to `bar` upstream (single
        # horizontal bar with optional track in `bar-normalize`).
        bar:
          background: dbt-creams.border
    tooltip:
      background: dbt-grays.white
      label:
        font:
          color: dbt-creams.subtitle
      value:
        font:
          color: dbt-creams.ink
      border:
        color: dbt-creams.border
        radius: 4.0
    # Literal dbt-creams.* token, not chrome.* -- style.palettes.chrome stays
    # bound to dbt-grays in _base.yaml and is never rebound for paper, so a
    # chrome.* reference here would hand paper cool-gray neutrals on a warm
    # canvas. One scaffold rung past paper's own measure gridline, at twice
    # that gridline's width.
    hover_emphasis:
      drop_line_color: dbt-creams.disabled
      drop_line_width: 3.0
    support_table:
      font:
        color: dbt-creams.muted
      divider:
        color: dbt-creams.muted
      label:
        font:
          color: dbt-creams.muted
  variables:
    font:
      color: dbt-creams.muted
    placeholder:
      # Cream-toned hint for warm-canvas themes (overrides stark's
      # gray disabled token so unselected text stays in the cream ramp).
      font:
        color: dbt-creams.disabled
    border:
      color: dbt-creams.grid-emphasis
