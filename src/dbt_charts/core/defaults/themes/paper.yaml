# Unified theme: paper
# The shipped `clarity` theme on a warm cream surface. `palettes.chrome` is
# rebound to dbt-creams, so every chrome[N] stop (axis grids, ticks, labels,
# mark strokes) sits on the cream canvas instead of the gray ladder.

extends: clarity
notes: clarity, warmer
style:
  palettes:
    chrome: dbt-creams
    sequence: dbt-seq-brown
  background: chrome[1]
  muted: chrome[8]
  font:
    color: chrome[11]
  title:
    # No color pin here — the InheritSlot carries `font.color`, so titles
    # and headings read the same ink as prose.
    subtitle:
      font:
        color: chrome[7]
  border:
    color: chrome[4]
  text:
    # Color inherits from `font.color` (InheritSlot) — no pin here so a
    # board-root style.font.color override reaches prose.
    code:
      # Inline code keeps clarity's gray ink, not a cream stop.
      font:
        color: dbt-grays.10
      background: chrome[2]
      border:
        color: chrome[4]
    blockquote:
      font:
        color: chrome[8]
      border:
        color: chrome[4]
    divider:
      color: chrome[4]
    column:
      divider:
        color: chrome[4]
  charts:
    pie:
      # The donut total keeps clarity's gray inks, not cream stops.
      total:
        value:
          font:
            color: dbt-grays.11
        label:
          font:
            color: dbt-grays.7
    color:
      categorical:
        # Single-series ink rhythm: brown, gold, rust. Warm canvas takes warm
        # inks; the cycle
        # threads through yellow-brown → tobacco → red-brown without ever
        # crossing into cool territory. Stops sit at OKLCH L 0.32–0.35
        # alongside clarity's cool cycle (matched ink-band weight). Named
        # roles preserve the intended hues if the family is reordered again.
        single_series_palette: [category.brown.deep, category.gold.deep, category.orange.deep]
    # bar.border.color now tracks theme.background via self-reference at the
    # structural-root level (see _base.yaml), so the cream knockout
    # falls out of theme.background = cream-025 automatically. No explicit
    # override needed here.
    marks:
      rule:
        stroke:
          color: chrome[11]
      text:
        font:
          color: chrome[10]
      geoshape:
        # Basemap chrome on a warm canvas. Clarity's equivalent comes from
        # dbt-grays; paper takes its own ladder from dbt-creams so the terrain
        # belongs to the page rather than sitting cold on it.
        #
        # A lighter step than the gray themes use, deliberately. The warm
        # ladder is tinted at every step, so the value that reads as neutral
        # ground on a gray canvas reads as a tan continent on cream — a
        # subject competing with the marks rather than ground beneath them.
        fill: chrome[3]
    axis:
      grid:
        # One rung quieter than the measure grid (axis_y below), never more.
        color: &category_grid chrome[4]
        threshold:
          color: chrome[7]
      ticks:
        color: *category_grid
      line:
        color: chrome[3]
      labels:
        font:
          color: chrome[8]
      title:
        font:
          # Axis titles in `subtitle` — quieter than chart-title `heading`.
          # Editorial precedent: axis titles orient, not compete.
          color: chrome[7]
    # axis_x cascades from axis — no overrides needed.
    axis_y:
      grid:
        color: chrome[5]  # softer grid for the value axis (overrides default gray)
      ticks:
        color: chrome[5]
    axis_quantitative:
      # Overrides clarity's chrome[11] quantitative-label color — paper's
      # axis chrome stays on the dbt-creams ladder throughout.
      labels:
        font:
          color: chrome[8]
      grid:
        color: chrome[5]
      ticks:
        color: chrome[5]
    legend:
      label:
        font:
          color: chrome[8]
      title:
        font:
          color: chrome[10]
    # Themed sequential default for heatmap/geoshape gradient color — _base's
    # `blues` measures 1.08:1 contrast against the cream canvas at its light
    # end (WCAG floor is 3:1), so low-value cells are effectively invisible.
    # dbt-seq-brown reads warm against the cream canvas instead.
    geoshape:
      color:
        gradient:
          palette: sequence
    heatmap:
      color:
        gradient:
          palette: sequence
    # Standalone spark-bar track on the warm fill gray — stark pins the
    # cool-gray fill, which would sit as a cool cast on the cream canvas.
    spark_bar:
      bar:
        background: chrome[3]
    table:
      header:
        divider:
          color: chrome[11]
        font:
          color: chrome[10]
      row:
        divider:
          color: chrome[11]
        roles:
          summary:
            divider:
              color: chrome[11]
          total:
            divider:
              color: chrome[11]
        stripe:
          color: chrome[2]
      paginator:
        # Cream-scaffold variant of the default gray ramp — same three-tier
        # contrast, warm-canvas colors.
        color_active: chrome[11]
        color_inactive: chrome[9]
        color_disabled: chrome[6]
      spark:
        # Spark progress track was renamed to `bar` upstream (single
        # horizontal bar with optional track in `bar-normalize`).
        bar:
          background: chrome[4]
    tooltip:
      background: dbt-grays.white
      label:
        font:
          color: chrome[7]
      value:
        font:
          color: chrome[11]
      border:
        color: chrome[4]
        radius: 4.0
    # One scaffold rung past paper's own measure gridline, at twice that
    # gridline's width.
    hover_emphasis:
      drop_line_color: chrome[6]
      drop_line_width: 3.0
    support_table:
      neutral_color: chrome[8]
      divider:
        color: chrome[8]
      row:
        divider:
          color: chrome[8]
      label:
        font:
          color: chrome[8]
  variables:
    font:
      color: chrome[8]
    placeholder:
      # Cream-toned hint for warm-canvas themes (overrides stark's
      # gray disabled token so unselected text stays in the cream ramp).
      font:
        color: chrome[6]
    border:
      color: chrome[5]
