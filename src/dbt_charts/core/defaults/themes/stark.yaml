# Theme: stark
# A minimal, achromatic theme: one black ink on every text and chrome slot.
# A leaf like its siblings (clarity, vivid, neon): shared defaults live in
# `_base`, so a choice made here reaches stark and nothing else.
#
# Best for: the mono-color palette, once pattern fills exist to carry series
# distinction without hue. Stark's own single-series ink is pure black today
# (`dbt-grays.black`), which is what a hue-free palette needs.

extends: _base
notes: grayscale, black ink
style:
  # ── Colors ─────────────────────────────────────────────────────────────────
  # Stark's sequential identity is achromatic: magnitude without hue, matching
  # its utilitarian voice. Bound as a role so the heatmap/geoshape gradients
  # below and any `sequence[N]` token read the same palette.
  palettes:
    sequence: dbt-seq-gray
  # Secondary text (KPI support rows, table more-rows/empty-state lines, muted
  # annotations). Stark is single-tier: muted is the same ink as every other
  # text slot; multi-tier themes bind it to a rung of their own ladders.
  roles:
    muted: chrome[10]
  background: dbt-grays.white

  font:
    color: &color_ink chrome[10]

  border:
    color: *color_ink

  title:
    subtitle:
      font:
        color: *color_ink

  annotations:
    rule:
      marks:
        rule:
          stroke:
            width: 2

  charts:
    color:
      categorical:
        # Single-series ink palette. Today: one element; every single-series
        # chart on the board uses slot 0. Follow-up rhythm pass cycles through
        # multiple slots per chart-id in reading order.
        # Stark commits to pure black; every other theme binds its own
        # single-series ink.
        single_series_palette: [dbt-grays.black]
    axis:
      line:
        color: *color_ink
      ticks:
        color: *color_ink
      grid:
        color: *color_ink
        threshold:
          color: *color_ink
      labels:
        font:
          color: *color_ink
      title:
        font:
          color: *color_ink

    legend:
      label:
        font:
          color: *color_ink
      title:
        font:
          color: *color_ink

    table:
      header:
        divider:
          color: *color_ink
        font:
          color: *color_ink
      row:
        divider:
          color: *color_ink
        roles:
          summary:
            divider:
              color: *color_ink
          total:
            divider:
              color: *color_ink

    marks:
      text:
        font:
          color: *color_ink
      rule:
        stroke:
          color: *color_ink
      geoshape:
        # Neutral fill for geography without joined data; keeps unjoined
        # countries/regions visible without entering the data color scale.
        fill: chrome[5]

    # Themed sequential default for heatmap/geoshape gradient color — see
    # paper.yaml for the contrast-floor rationale (blues' light end fails
    # WCAG on a light canvas too, just less severely than on paper's cream
    # surface).
    geoshape:
      color:
        gradient:
          palette: sequence
    heatmap:
      color:
        gradient:
          palette: sequence

    # Tooltip tracks the board's own light ground (was black on a white board --
    # a mismatched ground). Sharp corners + thick black outline + no shadow +
    # square swatch read as this theme's utilitarian voice; the triangle
    # active_marker (vs. every other theme's background fill) is its other
    # tooltip signature.
    tooltip:
      background: dbt-grays.white
      label:
        font:
          color: *color_ink
      value:
        font:
          color: *color_ink
      border:
        color: dbt-grays.black
        width: 1.5
        radius: 0.0
      shadow:
        visible: false
      swatch:
        radius: 0.0
      active_marker: triangle

    # Deliberately the SAME color as this theme's own gridline: stark's
    # gridline already sits one rung below the ceiling the single-series ink
    # owns, so there is no color headroom left -- the drop line carries the
    # distinction on weight alone (double the gridline width).
    hover_emphasis:
      drop_line_color: chrome[10]
      drop_line_width: 3.5


    support_table:
      neutral_color: *color_ink
      divider:
        color: *color_ink
      row:
        divider:
          color: *color_ink
      label:
        font:
          color: *color_ink

    pie:
      total:
        value:
          font:
            color: *color_ink
        label:
          font:
            color: *color_ink

  variables:
    font:
      color: *color_ink
    border:
      color: *color_ink
