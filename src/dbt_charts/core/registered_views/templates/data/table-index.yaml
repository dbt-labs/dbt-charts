title: [[ (path.source ~ "/" ~ path.schema ~ "/" ~ path.table) | tojson ]]

links:
  auto: true

[% set vars = plan_variables(queries.columns.rows) %]
[% if vars %]
variables:
[% for v in vars %]
  [[ v.name | tojson ]]:
    input: [[ v.input | tojson ]]
    visible: true
[% endfor %]
[% endif %]

queries:
  rows:
    type: sql
    source: [[ path.source | tojson ]]
    sql: >-
      SELECT * FROM [[ sql_identifier(path.schema) ]].[[ sql_identifier(path.table) ]]
      WHERE 1=1
      [% for v in vars %]AND {{ filter('[[ v.name ]]', [[ v.name ]]) }}
      [% endfor %]LIMIT 500

charts:
  row_data:
    title: [[ path.table | tojson ]]
    type: table
    query: rows

rows:
  - row_data
