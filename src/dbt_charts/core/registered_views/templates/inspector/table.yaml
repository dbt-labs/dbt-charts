[#- Transpose the column profiles into a describe-style overview: one table row
    per characteristic, one table column per data column. Built from the `columns`
    pre-template schema query so the pivot happens in the view layer. -#]
[%- set cols = (queries.columns.rows if (queries is defined and queries.columns is defined and queries.columns.rows is defined) else []) -%]
[%- set names = cols | map(attribute='name') | list -%]
[#- Concise describe overview — the 5 core characteristics. Numeric min/max/mean
    are column-specific and live on the column page as KPIs, not here. -#]
[%- set characteristics = [['Type', 'actual_type'], ['Role', 'role'], ['Semantic', 'semantic_type'], ['Null %', 'null_percentage'], ['Distinct', 'distinct_count']] -%]
[%- set pivot = pivot_column_profiles(cols, characteristics) -%]
[#- style.columns is styling-only (order comes from the pivoted row shape
    built above) — one entry per data column attaches its header link to the
    column page. -#]
[%- set colstyle = column_header_styles(names, path.source, path.schema, path.table) -%]
extends: neon
title: [[ ("Inspector: " ~ path.source ~ "/" ~ path.schema ~ "/" ~ path.table) | tojson ]]

text: [[ ("[← " ~ path.schema ~ "](/inspector/" ~ path.source ~ "/" ~ path.schema ~ "/)") | tojson ]]

queries:
  row_count:
    type: sql
    source: [[ path.source | tojson ]]
    sql: >-
      SELECT COUNT(*) AS row_count
      FROM [[ sql_identifier(path.schema) ]].[[ sql_identifier(path.table) ]]

  profile:
    type: values
    columns: [[ (['Attribute'] + names) | tojson ]]
    values: [[ pivot | tojson ]]

  sample_data:
    type: sql
    source: [[ path.source | tojson ]]
    sql: >-
      SELECT * FROM [[ sql_identifier(path.schema) ]].[[ sql_identifier(path.table) ]]
      LIMIT 100

charts:
  rows_kpi:
    label: Rows
    type: kpi
    query: row_count
    value: row_count
    style:
      value:
        format: ",.0f"

  column_profiles:
    title: Columns
    type: table
    query: profile
    # Compact describe overview — always show all characteristic rows at once.
    style: [[ {"columns": colstyle, "pagination": {"enabled": false}} | tojson ]]

  sample_rows:
    title: "Sample Data"
    type: table
    query: sample_data
    style:
      hide_underscore_columns: false

rows:
  - rows_kpi
  - column_profiles
  - sample_rows
